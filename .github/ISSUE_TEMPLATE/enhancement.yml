name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first, then the solution you have in mind.

        > [!WARNING]
        > Remove Wi-Fi names, passwords, API keys, tokens and any other private data before posting.

  - type: textarea
    attributes:
      label: What problem does this solve?
      description: What is awkward, missing or impossible today?
      placeholder: "I want to ... but today I have to ..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: What should the editor, the panel or the integration do instead?
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      options:
        - Panel type or display
        - Editor
        - Themes and colours
        - Notifications
        - Updates and firmware
        - Dashboard card
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Other ways this could be solved, or workarounds you use today.

  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to other projects or anything else that helps.
      render: text

  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and feature wishlist.
          required: true
