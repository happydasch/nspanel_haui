name: Set up the toolchain

description: Install Python, Node and the dependencies a CI job needs.

inputs:
  python:
    description: Python version; empty skips Python.
    required: false
    default: ""
  node:
    description: Node version; empty skips Node.
    required: false
    default: ""
  requirements:
    description: Install requirements-<name>.txt (dev, docs or esphome); empty skips.
    required: false
    default: ""
  npm:
    description: '"true" installs the frontend tooling with npm ci.'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The pip cache is keyed by its one requirements file: a key shared by the
    # dev, docs and esphome jobs is saved by whichever job ends first, so the
    # others would download their packages on every run.
    - name: Set up Python ${{ inputs.python }}
      if: inputs.python != ''
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python }}
        cache: ${{ inputs.requirements != '' && 'pip' || '' }}
        cache-dependency-path: requirements-${{ inputs.requirements }}.txt

    - name: Install the ${{ inputs.requirements }} dependencies
      if: inputs.requirements != ''
      shell: bash
      run: python -m pip install -r "requirements-${{ inputs.requirements }}.txt"

    - name: Set up Node ${{ inputs.node }}
      if: inputs.node != ''
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node }}
        cache: ${{ inputs.npm == 'true' && 'npm' || '' }}
        cache-dependency-path: package-lock.json

    - name: Install the frontend tooling
      if: inputs.node != '' && inputs.npm == 'true'
      shell: bash
      run: npm ci
