name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref supersedes the previous one, its docs deploy
# included: every push to master or dev deploys the docs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The name is the required check on master.
    name: tests (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node replays the hub's card renders in tests/test_card_renders.py, so
      # it belongs to the pytest job.
      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          node: "24"
          npm: "true"
          requirements: dev

      - name: Check icon cheatsheet is up to date
        run: |
          python -m scripts.font_tools.gen_cheatsheet
          git diff --exit-code -- docs/cheatsheet.html

      - name: Check translations are up to date
        # extract_translations.py rebuilds en.json and the other locale files
        # from the Python/frontend strings.  A stale locale file means a new
        # string shipped without a translation slot; regenerate and commit.
        run: |
          python -m scripts.translations.extract_translations
          git diff --exit-code -- custom_components/nspanel_haui/haui/locale scripts/translations/translate.json

      - name: Check version sources agree
        # manifest.json is the source of truth for firmware versions. Check its
        # mirrors without --tft-update: the TFT version is independent, and
        # pytest checks it against both HMIs and both TFTs.
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/nspanel_haui/manifest.json'))['version'])")
          python -m scripts.bump_version "$VERSION" --check

      - name: Enforce a display TFT version bump when a Nextion HMI or TFT changed
        # A display change committed under an unchanged tft_version never
        # reaches a panel that already reports that version. Compare against the
        # PR merge base (base.sha) or the commit a push came from (before). A
        # manual dispatch has no change set to compare.
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m scripts.verify_nextion.check_hmi_bump --base "$BASE_SHA"

      # Also runs the frontend style guard (tests/test_frontend_styles.py), both
      # HMI layout spec checks with the touch settings and landscape/portrait
      # parity (test_gen_layout.py), and the display version check: both HMIs
      # and both TFTs carry version.yaml's tft_version (test_bump_version.py).
      - name: Run tests
        run: pytest tests/

      - name: Check ruff formatting
        run: ruff format --check custom_components/ scripts/ tests/

      - name: Run ruff
        run: ruff check custom_components/ scripts/

      - name: Run mypy
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node: "24"
          npm: "true"

      - name: Type-check frontend modules
        run: npm run typecheck:frontend

      - name: Run frontend tests
        run: node --test 'tests/frontend/*.test.mjs'

  esphome:
    # A separate job keeps ESPHome's cryptography pin out of the pytest
    # environment (see requirements-esphome.txt).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: esphome

      - name: Validate the universal firmware config
        run: esphome config esphome/nspanel_haui_universal.yaml

  docs:
    # Builds once per run. Runs on master and dev upload the site for
    # deploy-docs; a PR run only proves the strict build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: docs

      # Applied before the build, so the uploaded artifact is deployable as it is.
      - name: Apply the dev site URLs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        run: bash scripts/docs/dev_site.sh

      - name: Build site
        run: zensical build --strict

      - name: Upload the built site
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 1
          if-no-files-found: error

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  # Pages hosts a single site, so every deploy publishes both branches: master
  # at the root and dev under dev/ (the editor footer links prereleases there).
  # The current branch comes from the docs artifact; only its sibling is built
  # here, inside the deploy concurrency group (shared by both branches) so the
  # last deploy always carries both branch tips.
  deploy-docs:
    needs: docs
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkouts happen before the artifact download: actions/checkout cleans
      # untracked files, which would delete the downloaded site.
      - name: Check out the dev site
        if: github.ref == 'refs/heads/master'
        uses: actions/checkout@v7
        with:
          ref: dev
          path: dev

      - name: Check out the stable site
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v7
        with:
          ref: master
          path: stable

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: current

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # The sibling builds with its own branch's docs requirements and, for
      # dev, its own copy of the dev site URLs.
      - name: Build the dev site
        if: github.ref == 'refs/heads/master'
        working-directory: dev
        run: |
          bash scripts/docs/dev_site.sh
          python -m pip install -r requirements-docs.txt
          zensical build --strict

      - name: Build the stable site
        if: github.ref == 'refs/heads/dev'
        working-directory: stable
        run: |
          python -m pip install -r requirements-docs.txt
          zensical build --strict

      - name: Combine the sites
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/master" ]; then
            cp -R current site
            cp -R dev/site site/dev
          else
            cp -R stable/site site
            cp -R current site/dev
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
