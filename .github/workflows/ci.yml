name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref cancels the previous one, its docs deploy included.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Required status check on master.
    name: tests (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node replays the card renders in tests/test_card_renders.py.
      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          node: "24"
          npm: "true"
          requirements: dev

      - name: Check generated cheatsheet and translations
        run: make generated-check

      - name: Check version sources agree
        # manifest.json is the version source of truth; pytest checks tft_version.
        run: make version-check

      - name: Enforce a display TFT version bump when a Nextion HMI or TFT changed
        # Fails when an HMI or TFT changed without a tft_version bump. A manual
        # dispatch has no change set to compare.
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m scripts.verify_nextion.check_hmi_bump --base "$BASE_SHA"

      # Also runs the frontend style guard, both HMI layout checks and the
      # display version check.
      - name: Run tests
        run: pytest tests/

      - name: Check ruff formatting
        run: ruff format --check custom_components/ scripts/ tests/

      - name: Run ruff
        run: ruff check custom_components/ scripts/

      - name: Run mypy
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node: "24"
          npm: "true"

      - name: Type-check frontend modules
        run: npm run typecheck:frontend

      - name: Run frontend tests
        run: node --test 'tests/frontend/*.test.mjs'

  esphome:
    # Separate job: ESPHome's cryptography pin conflicts with the test toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: esphome

      - name: Validate the universal firmware config
        run: esphome config esphome/nspanel_haui_universal.yaml

  docs:
    # Strict build once per run. master and dev runs upload the site for deploy-docs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: docs

      # Applied before the build, so the uploaded artifact is deployable.
      - name: Apply the dev site URLs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        run: bash scripts/docs/dev_site.sh

      - name: Build site
        run: zensical build --strict

      - name: Upload the built site
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 1
          if-no-files-found: error

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  # Publishes both branches to Pages: master at the root, dev under dev/. The
  # current branch comes from the docs artifact, only its sibling is built here.
  deploy-docs:
    needs: docs
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkouts come before the artifact download: checkout cleans untracked files.
      - name: Check out the dev site
        if: github.ref == 'refs/heads/master'
        uses: actions/checkout@v7
        with:
          ref: dev
          path: dev

      - name: Check out the stable site
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v7
        with:
          ref: master
          path: stable

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: current

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # The sibling builds with its own branch's docs requirements and dev site URLs.
      - name: Build the dev site
        if: github.ref == 'refs/heads/master'
        working-directory: dev
        run: |
          bash scripts/docs/dev_site.sh
          python -m pip install -r requirements-docs.txt
          zensical build --strict

      - name: Build the stable site
        if: github.ref == 'refs/heads/dev'
        working-directory: stable
        run: |
          python -m pip install -r requirements-docs.txt
          zensical build --strict

      - name: Combine the sites
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/master" ]; then
            cp -R current site
            cp -R dev/site site/dev
          else
            cp -R stable/site site
            cp -R current site/dev
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      # The run's artifact list can lag the upload, so deploy-pages would look it
      # up and find nothing (actions/deploy-pages#451).
      - name: Wait for the artifact list
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
