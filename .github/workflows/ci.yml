name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is per job: a newer push supersedes the previous run's gates, but
# a push must never cancel the Pages deploy of an older docs-changing push.
jobs:
  tests:
    # The matrix suffix keeps the required check name `tests (3.14)`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    concurrency:
      group: ci-${{ github.ref }}-tests
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node replays the hub's card renders in tests/test_card_renders.py, so
      # it belongs to the pytest job.
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python-version }}
          node: "24"
          requirements: dev

      - name: Check icon cheatsheet is up to date
        run: |
          python -m scripts.font_tools.gen_cheatsheet
          git diff --exit-code -- docs/cheatsheet.html

      - name: Check translations are up to date
        # extract_translations.py rebuilds en.json and the other locale files
        # from the Python/frontend strings.  A stale locale file means a new
        # string shipped without a translation slot; regenerate and commit.
        run: |
          python -m scripts.translations.extract_translations
          git diff --exit-code -- custom_components/nspanel_haui/haui/locale scripts/translations/translate.json

      - name: Check version sources agree
        # manifest.json is the source of truth for firmware versions. Check its
        # mirrors without --tft-update: the TFT version is independent and is
        # checked separately against both HMIs below.
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/nspanel_haui/manifest.json'))['version'])")
          python -m scripts.bump_version "$VERSION" --check

      - name: Enforce a display TFT version bump when the Nextion HMI changed
        # A screen change committed under an unchanged system.tftVersion never
        # reaches a panel that already reports that version. Compare against the
        # PR merge base (base.sha) or the commit a push came from (before). A
        # manual dispatch has no change set to compare.
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m scripts.verify_nextion.check_hmi_bump --base "$BASE_SHA"

      - name: Validate Nextion assets
        # Runs the release gate on every push/PR so stale HMI versions, touch
        # settings or portrait assets fail early. version.yaml is the source of
        # truth for the TFT version; it may differ from the firmware version.
        # Check both specs: landscape is the default, portrait is explicit.
        run: |
          python -m scripts.verify_nextion.verify_nextion --require-portrait
          python -m scripts.hmi_layout.gen_layout --check
          python -m scripts.hmi_layout.gen_layout --spec portrait --check

      - name: Run tests
        run: pytest tests/

      - name: Check ruff formatting
        run: ruff format --check custom_components/ scripts/ tests/

      - name: Run ruff
        run: ruff check custom_components/ scripts/

      - name: Run mypy
        run: mypy

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-frontend
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node: "24"
          npm: "true"

      - name: Type-check frontend modules
        run: npm run typecheck:frontend

      - name: Run frontend tests
        run: node --test 'tests/frontend/*.test.mjs'

  esphome:
    # A separate job keeps ESPHome's cryptography pin out of the pytest
    # environment (see requirements-esphome.txt).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-esphome
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: esphome

      - name: Validate the universal firmware config
        run: esphome config esphome/nspanel_haui_universal.yaml

  docs:
    # Builds once per run. Push runs upload the site for deploy-docs; a PR run
    # only proves the strict build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    concurrency:
      # Do not cancel push runs: a cancelled docs job would lose the only
      # deploy for a docs-changing push whose successor changes no docs.
      group: ci-${{ github.ref }}-docs
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: docs

      - name: Check whether this run changes the docs
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            changed=true
          elif [ "$EVENT" = "pull_request" ]; then
            changed=false
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed=true
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- docs mkdocs.yml requirements-docs.txt; then
            changed=false
          else
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      # The editor footer links prerelease versions to /dev/, so the dev site
      # carries its own site_url, repo link and edit links. Applied before the build, so
      # the uploaded artifact is deployable as it is.
      - name: Apply the dev site URLs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        run: |
          sed -i \
            -e 's#^site_url: .*#site_url: https://happydasch.github.io/nspanel_haui/dev/#' \
            -e 's#^repo_url: .*#repo_url: https://github.com/happydasch/nspanel_haui/tree/dev#' \
            -e 's#^edit_uri: edit/master/#edit_uri: edit/dev/#' \
            mkdocs.yml

      - name: Build site
        run: zensical build --strict

      - name: Upload the built site
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 1
          if-no-files-found: error

  hassfest:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-hassfest
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-hacs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  # Pages hosts a single site, so every deploy publishes both branches: master
  # at the root and dev under dev/ (the editor footer links prereleases there).
  # The current branch comes from the docs artifact; only its sibling is built
  # here, inside the deploy concurrency group so the last deploy always carries
  # both branch tips.
  deploy-docs:
    needs: docs
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'schedule' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') &&
      needs.docs.result == 'success' &&
      needs.docs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkouts happen before the artifact download: actions/checkout cleans
      # untracked files, which would delete the downloaded site.
      - name: Check out the dev site
        if: github.ref == 'refs/heads/master'
        uses: actions/checkout@v7
        with:
          ref: dev
          path: dev
          fetch-depth: 0

      - name: Check out the stable site
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v7
        with:
          ref: master
          path: stable
          # MkDocs' git-revision-date plugin (master up to 0.4.4) needs the history.
          fetch-depth: 0

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: current

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the dev site
        if: github.ref == 'refs/heads/master'
        working-directory: dev
        run: |
          sed -i \
            -e 's#^site_url: .*#site_url: https://happydasch.github.io/nspanel_haui/dev/#' \
            -e 's#^repo_url: .*#repo_url: https://github.com/happydasch/nspanel_haui/tree/dev#' \
            -e 's#^edit_uri: edit/master/#edit_uri: edit/dev/#' \
            mkdocs.yml
          python -m venv ../venv-dev
          ../venv-dev/bin/pip install -r requirements-docs.txt
          ../venv-dev/bin/zensical build --strict

      # The sibling builds with its own docs requirements, in its own venv.
      # master still builds with MkDocs until the zensical migration is
      # released; drop the mkdocs branch then.
      - name: Build the stable site
        if: github.ref == 'refs/heads/dev'
        working-directory: stable
        run: |
          python -m venv ../venv-stable
          ../venv-stable/bin/pip install -r requirements-docs.txt
          if [ -x ../venv-stable/bin/zensical ]; then
            ../venv-stable/bin/zensical build --strict
          else
            ../venv-stable/bin/mkdocs build --strict
          fi

      - name: Combine the sites
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/master" ]; then
            cp -R current site
            cp -R dev/site site/dev
          else
            cp -R stable/site site
            cp -R current site/dev
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
