name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref cancels the previous one, its docs deploy included.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Runs for both long-lived branches; the required check on master.
    name: tests (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node replays the card renders in tests/test_card_renders.py.
      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          node: "24"
          npm: "true"
          requirements: dev

      - name: Check generated cheatsheet and translations
        run: make generated-check

      - name: Check version sources agree
        # manifest.json is the version source of truth; pytest checks tft_version.
        run: make version-check

      - name: Enforce a display TFT version bump when a Nextion HMI or TFT changed
        # Fails when an HMI or TFT changed without a tft_version bump. A manual
        # dispatch has no change set to compare.
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m scripts.verify_nextion.check_hmi_bump --base "$BASE_SHA"

      # Also runs the frontend style guard, both HMI layout checks and the
      # display version check.
      - name: Run tests
        run: pytest tests/

      - name: Check ruff formatting
        run: ruff format --check custom_components/ scripts/ tests/

      - name: Run ruff
        run: ruff check custom_components/ scripts/

      - name: Run mypy
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: "24"
          npm: "true"

      - name: Type-check frontend modules
        run: npm run typecheck:frontend

      - name: Run frontend tests
        run: node --test 'tests/frontend/*.test.mjs'

  esphome:
    # Separate job: ESPHome's cryptography pin conflicts with the test toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: esphome

      - name: Validate the universal firmware config
        run: esphome config esphome/nspanel_haui_universal.yaml

  docs:
    # Strict build once per run; a master push uploads the site for deploy-docs,
    # a dev push only proves the docs build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: docs

      - name: Build site
        run: zensical build --strict

      - name: Upload the built site
        # The published site is the released documentation, so dev never deploys.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: docs-site
          path: site/
          retention-days: 1
          if-no-files-found: error

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c  # master 2026-11-21

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main 2026-11-21
        with:
          category: integration

  # Publishes the stable master to Pages; dev builds the same site without deploying it.
  deploy-docs:
    needs: docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: docs-site
          path: site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site/

      # The run's artifact list can lag the upload, so deploy-pages would look it
      # up and find nothing (actions/deploy-pages#451).
      - name: Wait for the artifact list
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
