name: Development Firmware

# Dispatched on `dev`, the development branch (not the repository default, which is
# `master`). Builds a universal image that reports `X.Y.Z.dev<run>`, writes the same
# version into `manifest.json` and `version.yaml`, commits that one bump back to `dev`,
# tags the commit, publishes it as a prerelease and prunes the older ones. The branch
# version matters: an integration installed from `dev` and custom firmware built from it
# report it, and the hub finds the matching TFT manifest by that version.
on:
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Base version for a new minor or major cycle (for example 0.6.0). Empty
          continues the newest vX.Y.Z tag as its next patch.
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: dev-firmware
  # A new dispatch queues behind the running one, so nothing is cancelled.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the dev branch
        # `master` is the repository default, so the dispatch form preselects it. A
        # build anywhere else would commit a development version into stable code and
        # tag it, so fail before the compile instead of after it.
        if: github.ref_name != 'dev'
        run: |
          echo "Development Firmware builds on dev only; this run is on $GITHUB_REF_NAME." >&2
          exit 1

      # Tags name the base version, so the full history is fetched. Credentials are
      # persisted because the version bump is pushed back to `dev`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          python: "3.14"
          requirements: esphome

      - name: Derive the build version
        # X.Y.Z.dev<run>, one PEP 440 string for the image, the tag and the manifest.
        id: version
        env:
          BASE: ${{ inputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            python -m scripts.release.dev_version "$GITHUB_RUN_NUMBER" --base "$BASE"
          else
            python -m scripts.release.dev_version "$GITHUB_RUN_NUMBER"
          fi

      - name: Set the development version
        # The image, the tag and the branch must all report this version: custom
        # firmware built from `dev` uses it to find its TFT in the release manifest.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python -m scripts.bump_version "$VERSION"

      - name: Compile the universal firmware
        run: bash scripts/release/compile_firmware.sh

      - name: Verify the image reports the build version
        # A dev build must not publish an image that still reports the released
        # version: the version bump is the only place it enters the image.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          if ! strings nspanel_haui_ota.bin | grep -Fq "version $VERSION"; then
            echo "nspanel_haui_ota.bin does not report $VERSION" >&2
            exit 1
          fi
          echo "Image reports $VERSION"

      - name: Generate the firmware manifest
        # The same schema as a stable release, its tft block included.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          python -m scripts.release.generate_firmware_manifest
          --tag "$VERSION" --name "NSPanel HAUI Development"

      - name: Write the release notes
        # A dispatched build has no push range, so the commits are those since the
        # newest tag reachable from the build commit.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TFT_VERSION: ${{ steps.version.outputs.tft_version }}
          REPO: ${{ github.repository }}
        run: |
          short="${GITHUB_SHA:0:7}"
          previous=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$previous" ]; then range="$previous..HEAD"; else range=HEAD; fi
          {
            printf 'Development firmware `%s`\n\n' "$VERSION"
            printf 'Firmware version: `%s` (reported by the image).\n' "$VERSION"
            printf 'Build commit: [`%s`](https://github.com/%s/commit/%s)\n' "$short" "$REPO" "$GITHUB_SHA"
            printf 'Firmware variant: `universal` (for universal test panels only).\n'
            printf 'Display TFT: `%s`.\n\n' "$TFT_VERSION"
            printf '## Commits in this build\n'
            git log --reverse --format='- [`%h`](https://github.com/'"$REPO"'/commit/%H) %s' "$range"
          } > dev-release-notes.md

      - name: Commit the development version to dev
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/nspanel_haui/manifest.json esphome/nspanel_haui/version.yaml
          if git diff --cached --quiet; then
            echo "The dev version is already ${VERSION}"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): development firmware ${VERSION}"
          # Other commits may have landed while the build ran. The bump is two
          # one-line edits, so rebase it and retry the push instead of losing it.
          attempt=1
          until git push origin HEAD:refs/heads/dev; do
            if [ "$attempt" -ge 5 ]; then
              echo "dev moved while building; the version commit was not pushed" >&2
              exit 1
            fi
            git fetch origin dev
            git rebase origin/dev
            attempt=$((attempt + 1))
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Tag the development version
        # The release tag points at the commit that carries the bumped manifest, so
        # the source archive HACS installs reports the same version as the image.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git tag -f "$VERSION" "$SHA"
          # A rerun of the same run number must re-point its tag at the new commit.
          git push --force origin "refs/tags/$VERSION"

      - name: Resolve the release assets
        # The two repair TFTs are listed only once they are committed: the
        # manifest names them in its `repair` block, and naming a missing file
        # would fail the publish below.
        id: assets
        run: |
          {
            echo 'files<<ASSETS'
            printf '%s\n' nspanel_haui.bin nspanel_haui_ota.bin \
              nextion/nspanel_haui.tft nextion/nspanel_haui_portrait.tft
            for tft in nextion/nspanel_haui_repair.tft \
              nextion/nspanel_haui_repair_portrait.tft; do
              if [ -f "$tft" ]; then printf '%s\n' "$tft"; fi
            done
            printf '%s\n' firmware-manifest.json
            echo 'ASSETS'
          } >> "$GITHUB_OUTPUT"

      - name: Publish the development prerelease
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: NSPanel HAUI ${{ steps.version.outputs.version }}
          body_path: dev-release-notes.md
          prerelease: true
          make_latest: false
          files: ${{ steps.assets.outputs.files }}

      - name: Run CI on the new dev commit
        # A push with GITHUB_TOKEN starts no workflow, so CI is dispatched.
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref dev

      - name: Prune old development prereleases
        # Keeps only the newest ones: too many would push the latest stable release
        # out of the Marketplace's and the hub's release lists. The pattern never
        # matches a stable release.
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.tag_name | test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.dev[0-9]+$"))) | [.created_at, .tag_name] | @tsv' \
            | sort -r \
            | tail -n +$((KEEP + 1)) \
            | cut -f2 \
            | while read -r tag; do
                echo "Deleting development prerelease $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
