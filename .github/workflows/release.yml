name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Never cancel an in-progress tagged release: cancellation during publication can leave a partial release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version tag for manual releases
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Run the release workflow on a v* tag; branch builds do not have a release manifest." >&2
          exit 1

      - uses: ./.github/actions/setup
        with:
          # ESPHome is pinned via requirements-esphome.txt to match min_version
          # in esphome/nspanel_haui/base.yaml so the released .bin is
          # reproducible. Its cryptography pin conflicts with the one Home
          # Assistant requires in requirements-dev.txt, so it never shares an
          # environment with the test toolchain.
          python: "3.14"
          requirements: esphome

      - name: Check the tag matches the integration version
        # The Marketplace offers the tag as the version while Home Assistant and
        # the hub read manifest.json; a tag that disagrees with it ships a
        # release users cannot update to cleanly.
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/nspanel_haui/manifest.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "manifest.json says $VERSION but the tag is v$TAG" >&2
            echo "run scripts/bump_version.py $TAG and commit before tagging" >&2
            exit 1
          fi

      # The Nextion gate is not repeated here: the tagged commit came through a
      # release PR whose required `tests (3.14)` check ran it.
      - name: Compile the universal firmware binary
        # esphome compile validates the config first.
        run: bash scripts/release/compile_firmware.sh

      - name: Generate the firmware update manifest
        # The hub's HAUI Firmware update entity reads this manifest
        # (releases/latest/download/firmware-manifest.json) and the editor's
        # firmware picker reads it per release; it uses the ESPHome web-tools
        # schema (name/version/builds[].ota) with an absolute download URL and
        # the image's md5.  ``variant: universal`` names the build (the image
        # compiles from nspanel_haui_universal.yaml with public credentials):
        # the hub only offers it to panels whose device state reports the same
        # variant, so a custom install.yaml build is never flashed with it.
        # The ``tft`` block names the display TFT and its per-model assets.
        # Its version comes from esphome/nspanel_haui/version.yaml, which only
        # advances when this release includes a TFT update. The generator
        # refuses a manifest without version, OTA image or TFT assets.
        run: python -m scripts.release.generate_firmware_manifest

      - name: Assemble the release notes
        # Release notes are prepared per release in .github/release-notes/<tag>.md
        # and published as the release body. Fall back to the changelog pointer
        # when no prepared file exists (older tags).
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
            echo "Using prepared release notes from $NOTES"
          else
            printf 'See [CHANGELOG.md](CHANGELOG.md) for release notes and\n[docs/user/update.md](docs/user/update.md) for breaking changes and update steps.\n' > release-notes.md
            echo "No prepared notes at $NOTES; using the changelog pointer."
          fi

      - name: Attach assets to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nspanel_haui.bin
            nspanel_haui_ota.bin
            nextion/nspanel_haui.tft
            nextion/nspanel_haui_portrait.tft
            firmware-manifest.json
          name: ${{ github.ref_name }}
          body_path: release-notes.md
