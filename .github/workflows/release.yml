name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ESPHome
        # Pinned via requirements-esphome.txt to match min_version in
        # esphome/nspanel_haui/base.yaml so the released .bin is reproducible.
        # ESPHome lives in its own file because its cryptography pin conflicts
        # with the one Home Assistant requires in requirements-dev.txt.
        run: pip install -r requirements-esphome.txt

      - name: Check the tag matches the integration version
        # HACS resolves the installed version from manifest.json; a tag that
        # disagrees with it ships a release users cannot update to cleanly.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/nspanel_haui/manifest.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "manifest.json says $VERSION but the tag is v$TAG" >&2
            echo "run scripts/bump_version.py $TAG and commit before tagging" >&2
            exit 1
          fi

      - name: Validate the Nextion assets (release gate)
        # Fails the release until the human Nextion Editor work landed:
        #   - clock.tTime "Send Component ID" enabled (tap advances the card)
        #   - system.tftVersion matches the integration version
        #   - the portrait HMI/TFT exist
        #   - the portrait spec still matches the committed HMI (alignment/font
        #     attributes, #64/#60) — the TFTs must be recompiled after any
        #     PORTRAIT_ATTRS change, so this catches a stale committed HMI.
        run: |
          python scripts/verify_nextion/verify_nextion.py --require-portrait
          python scripts/gen_portrait/gen_portrait.py --check

      - name: Validate the universal firmware config
        run: esphome config esphome/nspanel_haui_universal.yaml

      - name: Compile the universal firmware binary
        # Two images come out of a compile and they are not interchangeable:
        #   - firmware.factory.bin is a full flash image (bootloader + partition
        #     table + app from offset 0) — for manual/serial flashing only.
        #   - firmware.ota.bin is the app image the HTTP OTA platform writes into
        #     the OTA partition.  Feeding the factory image to OTA would write
        #     bootloader bytes into the app slot.
        run: |
          esphome compile esphome/nspanel_haui_universal.yaml
          BIN=$(find esphome/.esphome -name firmware.factory.bin -path "*nspanel-haui*" | head -1)
          if [ -z "$BIN" ]; then
            echo "firmware.factory.bin not found after compile" >&2
            exit 1
          fi
          cp "$BIN" nspanel_haui.bin
          OTA="$(dirname "$BIN")/firmware.ota.bin"
          if [ ! -f "$OTA" ]; then
            echo "firmware.ota.bin not found after compile" >&2
            exit 1
          fi
          cp "$OTA" nspanel_haui_ota.bin
          ls -lh nspanel_haui.bin nspanel_haui_ota.bin

      - name: Generate the firmware update manifest
        # The hub's HAUI Firmware update entity reads this manifest
        # (releases/latest/download/firmware-manifest.json) and the editor's
        # firmware picker reads it per release; it uses the ESPHome web-tools
        # schema (name/version/builds[].ota) with an absolute download URL and
        # the image's md5.  Only tag pushes get a manifest: a workflow_dispatch
        # run would otherwise advertise a branch name as the "version" and
        # every panel would try to update to it.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          with open("nspanel_haui_ota.bin", "rb") as fh:
              md5 = hashlib.md5(fh.read()).hexdigest()
          manifest = {
              "name": "NSPanel HAUI",
              "version": tag.lstrip("v"),
              "builds": [
                  {
                      "chipFamily": "ESP32",
                      "ota": {
                          "path": (
                              f"https://github.com/{repo}/releases/download/"
                              f"{tag}/nspanel_haui_ota.bin"
                          ),
                          "md5": md5,
                      },
                  }
              ],
          }
          with open("firmware-manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Assemble the release notes
        # Release notes are prepared per release in .github/release-notes/<tag>.md
        # and published as the release body. Fall back to the changelog pointer
        # when no prepared file exists (workflow_dispatch runs and older tags).
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
            echo "Using prepared release notes from $NOTES"
          else
            printf 'See [CHANGELOG.md](CHANGELOG.md) for release notes and\n[docs/upgrading.md](docs/upgrading.md) for breaking changes and update steps.\n' > release-notes.md
            echo "No prepared notes at $NOTES; using the changelog pointer."
          fi

      - name: Attach assets to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nspanel_haui.bin
            nspanel_haui_ota.bin
            nextion/nspanel_haui.tft
            nextion/nspanel_haui_portrait.tft
            firmware-manifest.json
          name: ${{ github.ref_name }}
          body_path: release-notes.md