name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a release in progress: cancellation can leave a partial release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version tag for manual releases
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Run the release workflow on a v* tag; branch builds do not have a release manifest." >&2
          exit 1

      - name: Require the tagged commit on master
        # A v* tag becomes the latest stable release for every panel, so it may only
        # name a commit that reached master through its dev -> master promotion.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/master; then
            echo "v tag $GITHUB_REF_NAME names $SHA, which is not on master." >&2
            echo "Promote dev into master with a pull request and tag the merge commit." >&2
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          # ESPHome is pinned to min_version in esphome/nspanel_haui/base.yaml for
          # reproducible builds; its cryptography pin conflicts with the test toolchain.
          python: "3.14"
          requirements: esphome

      - name: Check the tag matches the integration version
        # The Marketplace takes the version from the tag, Home Assistant and the hub
        # from manifest.json, so the two must agree.
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/nspanel_haui/manifest.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "manifest.json says $VERSION but the tag is v$TAG" >&2
            echo "run scripts/bump_version.py $TAG and commit before tagging" >&2
            exit 1
          fi

      # The HMI layout and version checks ran in the promotion PR's `tests (3.14)`
      # job; the manifest step still refuses a TFT without tft_version.
      - name: Compile the universal firmware binary
        # esphome compile validates the config first.
        run: bash scripts/release/compile_firmware.sh

      - name: Generate the firmware update manifest
        # Writes firmware-manifest.json (ESPHome web-tools schema) with the
        # universal variant, an absolute OTA URL and md5, and the tft block from
        # esphome/nspanel_haui/version.yaml. The hub's update entity and the
        # editor's firmware picker read it.
        run: python -m scripts.release.generate_firmware_manifest

      - name: Assemble the release notes
        # Publishes .github/release-notes/<tag>.md as the body, or the changelog
        # pointer when no prepared file exists (older tags).
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
            echo "Using prepared release notes from $NOTES"
          else
            printf 'See [CHANGELOG.md](CHANGELOG.md) for release notes and\n[docs/user/update.md](docs/user/update.md) for breaking changes and update steps.\n' > release-notes.md
            echo "No prepared notes at $NOTES; using the changelog pointer."
          fi

      - name: Attach assets to the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: |
            nspanel_haui.bin
            nspanel_haui_ota.bin
            nextion/nspanel_haui.tft
            nextion/nspanel_haui_portrait.tft
            firmware-manifest.json
          name: ${{ github.ref_name }}
          body_path: release-notes.md
