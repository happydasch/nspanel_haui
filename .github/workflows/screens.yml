name: Screens

# Regenerates the screen overview (docs/screens.html and the PNGs in
# docs/assets/screens/) from the hub's own renders and commits it to dev when
# it changed. It runs after Development Firmware instead of on push: that
# workflow pushes its version commit onto dev, and two bots pushing to dev at
# the same time would make one of them lose the race.
on:
  workflow_run:
    workflows: ["Development Firmware"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screens
  cancel-in-progress: true

jobs:
  screens:
    # A cancelled firmware run was superseded by a newer push, whose own run
    # triggers this workflow again.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # capture.mjs drives the runner's preinstalled Google Chrome.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Render screens
        run: python -m scripts.preview_gallery.gen_preview_gallery --docs

      - name: Commit changed screens
        # [skip ci] matches the dev-firmware bot commit. A non-force push fails
        # when dev moved on while rendering; that newer push runs this again.
        run: |
          git add -A docs/screens.html docs/assets/screens
          if git diff --cached --quiet; then
            echo "Screens are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(screens): regenerate screen overview [skip ci]"
          git push origin "HEAD:refs/heads/dev" || echo "::notice::dev moved on while rendering; the next run commits the screens"
