name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# New commits supersede CI for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # tests/test_card_renders.py replays the hub's card renders in the
      # browser's Nextion simulator with Node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build docs
        run: zensical build --strict

      - name: Check icon cheatsheet is up to date
        run: |
          python3 scripts/gen_fonts/gen_cheatsheet.py
          git diff --exit-code -- docs/cheatsheet.html

      - name: Check translations are up to date
        # extract_translations.py rebuilds en.json and the other locale files
        # from the Python/frontend strings.  A stale locale file means a new
        # string shipped without a translation slot; regenerate and commit.
        run: |
          python3 scripts/translations/extract_translations.py
          git diff --exit-code -- custom_components/nspanel_haui/haui/locale scripts/translations/translate.json

      - name: Check version sources agree
        # manifest.json is the source of truth. bump_version.py --check fails
        # when pyproject.toml, firmware yaml_version or the selected TFT sources
        # disagree. TFT releases include --tft-update; firmware-only releases
        # leave tft_version/HMI unchanged. TFT_VERSION_PIN is kept for the HMI
        # release-gate override when those TFTs are carried forward unchanged.
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/nspanel_haui/manifest.json'))['version'])")
          TFT_FLAG="--tft-update"
          if [ -n "${{ vars.TFT_VERSION_PIN }}" ]; then
            echo "TFT version pinned at ${{ vars.TFT_VERSION_PIN }}; checking firmware versions only"
            TFT_FLAG="--text-only"
          fi
          python3 scripts/bump_version.py "$VERSION" $TFT_FLAG --check

      - name: Validate Nextion assets
        # Runs the release gate on every push/PR so a stale HMI (tftVersion,
        # Send Component ID, portrait assets) fails early instead of at the tag.
        # With TFT_VERSION_PIN set (release ships the previous TFT unchanged)
        # a tftVersion mismatch is tolerated as a warning.
        run: |
          TFT_FLAG=""
          if [ -n "${{ vars.TFT_VERSION_PIN }}" ]; then
            echo "TFT version pinned at ${{ vars.TFT_VERSION_PIN }}; tolerating a tftVersion mismatch"
            TFT_FLAG="--allow-tft-version-mismatch"
          fi
          python3 scripts/verify_nextion/verify_nextion.py --require-portrait $TFT_FLAG

      - name: Run tests
        run: pytest tests/

      - name: Run ruff
        run: ruff check custom_components/ scripts/

      - name: Run mypy
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run frontend tests
        run: node --test 'tests/frontend/*.test.mjs'

  esphome:
    # The firmware YAMLs changed in this branch and only the release workflow
    # validated them before.  A separate job keeps ESPHome's cryptography pin
    # out of the pytest environment (see requirements-esphome.txt).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ESPHome
        run: pip install -r requirements-esphome.txt

      - name: Validate the universal firmware config
        run: esphome config esphome/nspanel_haui_universal.yaml
