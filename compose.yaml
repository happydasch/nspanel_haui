# Throwaway Home Assistant running the checked-out integration (docs/develop/development.md).
services:
  homeassistant:
    # The Home Assistant version the integration requires (minimum in the Marketplace
    # metadata); keep the default in step with HA_VERSION in the Makefile.
    image: homeassistant/home-assistant:${HA_VERSION:-2026.11.0}
    volumes:
      - ./.dev/ha-docker:/config
      - ./custom_components/nspanel_haui:/config/custom_components/nspanel_haui
    ports:
      - "8123:8123"
