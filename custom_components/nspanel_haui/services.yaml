# ── nspanel_haui.update_tft ──────────────────────────────────
update_tft:
  name: Update TFT
  description: >-
    Install the TFT the selected panel's firmware manifest names (the one the
    firmware needs, matched to the device's display model), or the TFT file at
    a URL. Select a single NSPanel device; this service cannot be called for
    all devices at once.
  fields:
    device:
      name: "Device"
      description: "NSPanel device whose display should be updated."
      required: true
      selector:
        device:
          integration: nspanel_haui
    version:
      name: "Version"
      description: >-
        The manifest's TFT version to install instead of the default, i.e. the
        one the firmware needs; it must match the manifest's tft.version.
        Cannot be combined with URL.
      required: false
      example: "0.4.4"
      selector:
        text:
    url:
      name: "URL"
      description: >-
        Optional http(s) URL of a .tft file to install instead of the manifest
        TFT (custom, development or older TFT builds). Cannot be combined with
        Version.
      required: false
      example: "http://homeassistant.local:8123/local/nspanel/nspanel_haui.tft"
      selector:
        text:
          type: url

# ── nspanel_haui.update_firmware ─────────────────────────────
update_firmware:
  name: Update firmware
  description: >-
    Install the firmware update Home Assistant offers for this panel, another
    GitHub release (older ones included), or the firmware OTA image at a URL.
    A release or URL install pauses the automatic firmware update until Home
    Assistant restarts. Select a single NSPanel device.
  fields:
    device:
      name: "Device"
      description: "NSPanel device whose firmware should be installed."
      required: true
      selector:
        device:
          integration: nspanel_haui
    version:
      name: "Version"
      description: >-
        Optional GitHub release to install instead of the offered update, e.g.
        an older release. Only releases that ship nspanel_haui_ota.bin install
        over the air. Cannot be combined with URL.
      required: false
      example: "0.4.2"
      selector:
        text:
    url:
      name: "URL"
      description: >-
        Optional http(s) URL of a firmware OTA image (firmware.ota.bin, not the
        factory image) to install. Cannot be combined with Version.
      required: false
      example: "http://homeassistant.local:8123/local/nspanel/firmware.ota.bin"
      selector:
        text:
          type: url

# ── nspanel_haui.open_panel ──────────────────────────────────
open_panel:
  name: Open panel
  description: >-
    Navigate the display to the specified panel.  The panel
    is opened through the navigation controller so the full
    render pipeline runs (goto_page, page ack, settle, set_panel).
    Navigation history, popups, and lock state are honored.

    If wakeup is enabled (default false), the display is woken
    before opening the panel — equivalent to calling
    reset_last_interaction first.
  fields:
    device:
      name: "Device"
      description: "Target NSPanel device. If omitted, applies to all devices."
      required: false
      selector:
        device:
          integration: nspanel_haui
    panel:
      name: "Panel key"
      description: >-
        Panel key to open (e.g. "grid_0", "light_0", "home").
      required: true
      example: "alarm"
      selector:
        text:
          type: text
    wakeup:
      name: "Wake up"
      description: "Wake the display before opening the panel."
      required: false
      default: false
      selector:
        boolean:

# ── nspanel_haui.close_panel ─────────────────────────────────
close_panel:
  name: Close panel
  description: >-
    Close the current panel and return to the previous panel
    (or home panel if there is no history).
  fields:
    device:
      name: "Device"
      description: "Target NSPanel device. If omitted, applies to all devices."
      required: false
      selector:
        device:
          integration: nspanel_haui

# ── nspanel_haui.wakeup ──────────────────────────────────────
wakeup:
  name: Wake up
  description: >-
    Wake the display (reset its inactivity timer) and exit the idle
    page if one is shown, returning to the previous panel (or the
    home panel per the snapshot restore setting).  Waking never
    depends on a configured panel.
  fields:
    device:
      name: "Device"
      description: "Target NSPanel device. If omitted, applies to all devices."
      required: false
      selector:
        device:
          integration: nspanel_haui

# ── nspanel_haui.idle ────────────────────────────────────────
idle:
  name: Idle
  description: >-
    Enter the idle state immediately by opening the configured idle
    page (idle_panel), as if the page timeout had fired.  Repeated
    calls keep the original pre-idle snapshot.  The display-off
    behavior is separate and governed by the auto display-off setting.
  fields:
    device:
      name: "Device"
      description: "Target NSPanel device. If omitted, applies to all devices."
      required: false
      selector:
        device:
          integration: nspanel_haui

# ── nspanel_haui.send_notification ───────────────────────────
send_notification:
  name: Send notification
  description: >-
    Show a notification on the panel with a title, message, icon, icon colour
    and sound. By default it stays queued until dismissed on the panel. Set a
    timeout to auto-dismiss it after that many seconds; persistent also opens
    it immediately, loops its sound and re-opens its popup until it is
    dismissed (or its timeout expires).
  fields:
    device:
      name: "Device"
      description: "Target NSPanel device. If omitted, applies to all devices."
      required: false
      selector:
        device:
          integration: nspanel_haui
    title:
      name: "Title"
      description: "Notification headline shown at the top of the panel."
      required: true
      example: "Doorbell"
      selector:
        text:
          type: text
    message:
      name: "Message"
      description: "Body text of the notification. Can be left empty for a title-only alert."
      required: false
      example: "Someone is at the front door"
      selector:
        text:
          type: text
          multiline: true
    icon:
      name: "Icon"
      description: "Material Design Icon (e.g. \"mdi:bell\") shown next to the title."
      required: false
      example: "mdi:bell"
      selector:
        icon:
    icon_color:
      name: "Icon color"
      description: >-
        Colour of the icon: "#rrggbb", an RGB565 number, "[r, g, b]" or an
        integer string. Leave empty to use the theme's text colour.
      required: false
      example: "#f69d31"
      selector:
        text:
    sound:
      name: "Sound"
      description: >-
        Sound played for the notification. "none" keeps it silent. Sounds play
        only when the device's sound-on-notification setting is on.
      required: false
      default: "notification"
      selector:
        select:
          options:
            - "startup"
            - "tone"
            - "tone_up"
            - "tone_down"
            - "seq_up"
            - "seq_down"
            - "notification"
            - "alert"
            - "alert_fast"
            - "elise"
            - "none"
    timeout:
      name: "Timeout"
      description: >-
        Seconds until the notification auto-dismisses.  Leave empty
        (default), or enter 0, to keep it queued until dismissed on the panel.
        Valid timeout values are 1–3600 seconds.
      required: false
      example: 10
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: "s"
          mode: box
    persistent:
      name: "Persistent"
      description: >-
        When on, the notification opens immediately and its sound loops until
        the notification is dismissed on the panel (or its timeout expires).
      required: false
      default: false
      selector:
        boolean:
    force_show:
      name: "Force show"
      description: >-
        When on, opens the notification panel immediately.  If a
        notification popup or list is already open, the new
        notification waits in the queue instead of ripping it away.
        Persistent notifications force-show even when this is off.
      required: false
      default: false
      selector:
        boolean:
    text_size:
      name: "Text size"
      description: >-
        Popup body text size — "auto" (the largest font that fits the
        whole message on one page) or a font size 1-3.
      required: false
      default: "auto"
      selector:
        select:
          options:
            - "auto"
            - "1"
            - "2"
            - "3"

# ── nspanel_haui.reset_last_interaction ──────────────────────
reset_last_interaction:
  name: Reset last interaction
  description: >-
    Reset the panel's idle timer as if the user just touched it —
    keeps the display on or delays display-off.  Optionally add an
    offset (in seconds) to the reset point.
  fields:
    device:
      name: "Device"
      description: "Target NSPanel device. If omitted, applies to all devices."
      required: false
      selector:
        device:
          integration: nspanel_haui
    offset:
      name: "Offset"
      description: "Additional seconds of wake time before the display returns to idle."
      required: false
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: "s"
          mode: box