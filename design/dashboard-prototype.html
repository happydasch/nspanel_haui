                <div class="d-device-table-head"><div class="d-device-columns"><span>Device</span><span class="d-col-ip">IP address</span><span>Firmware</span><span>Display</span></div><span class="d-update-column">Actions</span></div>
                ${DEVICES.map(renderDDeviceRow).join('')}
              </div>
            </section>
            <section class="surface">
              <div class="surface-heading"><div><h3>Recent activity</h3><p>Across your devices</p></div><span class="variant-badge">24h</span></div>
              ${renderActivity(FLEET_ACTIVITY, true)}
            </section>
          </div>`;
      }

      function panelIsNavigation(device, key) {
        return !device.hiddenPanels?.includes(key);
      }

      function yamlValue(value) {
        if (value === null || value === undefined) return 'null';
        if (typeof value === 'boolean' || typeof value === 'number') return String(value);
        const text = String(value);
        const plain = /^[A-Za-z0-9_./-][A-Za-z0-9 _./@-]*$/.test(text)
          && !['true', 'false', 'null', '~'].includes(text);
        return plain ? text : JSON.stringify(text);
      }

      function yamlScalar(raw) {
        const text = raw.trim();
        if (!text) return '';
        if (text.startsWith('"')) {
          try { return JSON.parse(text); } catch { return text.slice(1, -1); }
        }
        if (text.startsWith("'") && text.endsWith("'")) return text.slice(1, -1).replace(/''/g, "'");
        if (text === 'true') return true;
        if (text === 'false') return false;
        if (text === 'null' || text === '~') return null;
        return text;
      }

      function deviceToYaml(device) {
        const lines = [
          '# NSPanel HAUI device configuration',
          `name: ${yamlValue(device.name)}`,
          `node: ${yamlValue(device.node)}`,
          `orientation: ${yamlValue(device.orientation)}`,
          `home_panel: ${yamlValue(device.homePanel)}`,
          `idle_panel: ${yamlValue(device.idlePanel)}`,
          'panels:',
        ];
        device.panelList.forEach(([name, key, , preview]) => {
          lines.push(`  - name: ${yamlValue(name)}`);
          lines.push(`    key: ${yamlValue(key)}`);
          lines.push(`    type: ${yamlValue(PANEL_DETAILS[key]?.type ?? 'grid')}`);
          lines.push(`    preview: ${yamlValue(preview)}`);
          lines.push(`    navigation: ${panelIsNavigation(device, key) ? 'true' : 'false'}`);
        });
        return `${lines.join('\n')}\n`;
      }

      function parseDeviceYaml(text) {
        const config = { panels: [] };
        let panel = null;
        text.split(/\r?\n/).forEach((raw, index) => {
          const trimmed = raw.trim();
          if (!trimmed || trimmed.startsWith('#') || trimmed === '---' || trimmed === '...') return;
          const item = trimmed.match(/^-\s+([\w-]+):\s*(.*)$/);
          if (item) {
            panel = {};
            config.panels.push(panel);
            panel[item[1]] = yamlScalar(item[2]);
            return;
          }
          const entry = trimmed.match(/^([\w-]+):\s*(.*)$/);
          if (!entry) throw new Error(`line ${index + 1} is not valid device YAML`);
          const [, key, value] = entry;
          if (panel && /^\s/.test(raw)) {
            panel[key] = yamlScalar(value);
            return;
          }
          panel = null;
          if (key === 'panels' && !value.trim()) return;
          config[key] = yamlScalar(value);
        });
        return config;
      }

      function applyDeviceYaml(device, config) {
        const name = typeof config.name === 'string' ? config.name.trim() : '';
        if (!name) throw new Error('the device name is missing');
        const panels = Array.isArray(config.panels) ? config.panels : [];
        const seen = new Set();
        const panelList = [];
        const hiddenPanels = [];
        panels.forEach((entry) => {
          const key = typeof entry.key === 'string' ? entry.key.trim() : '';
          if (!key || seen.has(key)) return;
          seen.add(key);
          const catalog = PANEL_CATALOG.find((panel) => panel.key === key)
            ?? PANEL_CATALOG.find((panel) => panel.details.type === entry.type);
          const label = typeof entry.name === 'string' && entry.name.trim() ? entry.name.trim() : catalog?.name ?? key;
          const preview = PANEL_CATALOG.some((panel) => panel.preview === entry.preview) ? entry.preview : catalog?.preview ?? 'grid';
          if (!PANEL_DETAILS[key]) {
            PANEL_DETAILS[key] = catalog?.details ?? { type: entry.type || 'grid', description: 'Imported panel.', items: 0 };
          }
          panelList.push([label, key, catalog?.glyph ?? 'grid', preview]);
          if (entry.navigation === false) hiddenPanels.push(key);
        });
        if (!panelList.length) throw new Error('no panels are defined');
        device.name = name;
        if (typeof config.node === 'string' && config.node.trim()) device.node = config.node.trim();
        if (config.orientation === 'portrait' || config.orientation === 'landscape') device.orientation = config.orientation;
        device.panelList = panelList;
        device.hiddenPanels = hiddenPanels;
        device.panels = panelList.length;
        device.homePanel = panelList.some((panel) => panel[1] === config.home_panel) ? config.home_panel : null;
        device.idlePanel = panelList.some((panel) => panel[1] === config.idle_panel) ? config.idle_panel : null;
        state.previewPanelKey = device.homePanel ?? panelList[0][1];
        render();
        showToast(`${device.name} imported from YAML.`);
      }

      function exportDeviceYaml(device) {
        if (!device) return;
        const blob = new Blob([deviceToYaml(device)], { type: 'text/yaml' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${device.node}.yaml`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        showToast(`Exported ${device.name} as YAML.`);
      }

      function startDeviceImport(device) {
        if (!device) return;
        state.yamlImportDevice = device.id;
        yamlImportInput.value = '';
        yamlImportInput.click();
      }

      function renderPanelThumbRoles(device, key) {
        const roles = [];
        if (device.homePanel === key) roles.push(`<span class="panel-thumb-role home" title="Home panel" role="img" aria-label="Home panel">${icon('home')}</span>`);
        if (device.idlePanel === key) roles.push(`<span class="panel-thumb-role idle" title="Idle panel" role="img" aria-label="Idle panel">${icon('clock')}</span>`);
        return roles.length ? `<span class="panel-thumb-roles">${roles.join('')}</span>` : '';
      }

      function renderPanelListRow(device, panel, group) {
        const [name, key, , preview] = panel;
        const details = PANEL_DETAILS[key];
        return `
          <div class="panel-list-row" draggable="true" data-sort-kind="panel" data-sort-id="${key}" data-sort-group="${device.id}:${group}" data-panel-row="${key}">
            <span class="sort-handle" title="Drag to reorder">${icon('grip')}</span>
            <span class="panel-list-main">
              <span class="panel-list-name"><button class="panel-list-thumb ${device.orientation}" type="button" data-panel-preview="${key}" aria-label="Preview ${name} panel"><img src="${screenUrl(device, preview)}" alt="" loading="lazy">${renderPanelThumbRoles(device, key)}</button><strong>${name}</strong></span>
            </span>
            <span class="panel-list-key">${key}</span>
            <span class="panel-list-meta"><span class="panel-list-count">${details.items ? `${details.items} items` : 'No items'}</span></span>
            <span class="panel-list-actions">
              <button class="panel-list-action" type="button" data-panel-menu="${key}" aria-expanded="false" aria-controls="panelMenuPopover" aria-label="More actions for ${name}">${icon('dots')}</button>
            </span>
          </div>`;
      }

      function renderPanelGroup(device, panels, group) {
        const title = group === 'navigation' ? 'Navigation' : 'Non-Navigation';
        const countLabel = panels.length === 1 ? 'panel' : 'panels';
        return `
          <section class="panel-view-group" data-panel-group="${group}">
            <div class="panel-view-group-heading"><strong>${title} (${panels.length} ${countLabel})</strong><span>Drag to reorder or move between sections</span></div>
            <div class="panel-list-view" data-sort-kind="panel-group" data-sort-group="${device.id}:${group}" aria-label="${title} panels">
              ${panels.map((panel) => renderPanelListRow(device, panel, group)).join('')}
              ${panels.length ? '' : `<div class="panel-dropzone">Drop a panel here to move it to ${title}</div>`}
            </div>
          </section>`;
      }

      function renderPanelOverview(device) {
        if (!device.panelList.length) return '<div class="panel-empty">No panels configured for this device yet.</div>';
        const navigation = device.panelList.filter((panel) => panelIsNavigation(device, panel[1]));
        const hidden = device.panelList.filter((panel) => !panelIsNavigation(device, panel[1]));
        return `<div class="panel-view-groups">${renderPanelGroup(device, navigation, 'navigation')}${renderPanelGroup(device, hidden, 'hidden')}</div>`;
      }

      function renderPanelPreview(device) {
        const panel = device.panelList.find((entry) => entry[1] === state.previewPanelKey)
          || device.panelList.find((entry) => entry[1] === device.homePanel)
          || device.panelList[0];
        if (!panel) return '<div class="panel-empty">No panels configured for this device yet.</div>';
        const [name, , , preview] = panel;
        const isLive = state.previewMode === 'live';
        return `
          <div class="panel-preview-mode">
            <div class="sim-stage ${isLive ? 'live' : ''}">
              <div class="sim-frame ${device.orientation}">
                <div class="sim-screen"><img src="${screenUrl(device, preview)}" alt="${name} panel preview"></div>
                <div class="sim-hw-buttons">
                  <button class="sim-hw" type="button" data-sim-button="left" aria-label="Left button"><span class="sim-relay-light"></span></button>
                  <button class="sim-hw" type="button" data-sim-button="right" aria-label="Right button"><span class="sim-relay-light"></span></button>
                </div>
              </div>
            </div>
          </div>`;
      }

      function renderPanelCatalog(device) {
        const options = PANEL_CATALOG.map((panel) => `
          <button class="panel-catalog-option" type="button" data-add-panel="${panel.key}" aria-label="Add ${panel.name} panel">
            <span class="panel-catalog-screen ${device.orientation}"><img src="${screenUrl(device, panel.preview)}" alt="" loading="lazy"></span>
            <span class="panel-catalog-heading">
              <span class="panel-catalog-icon">${icon(panel.glyph)}</span>
              <strong>${panel.name}</strong>
            </span>
            <span class="panel-catalog-description">${panel.details.description}</span>
          </button>`).join('');
        return `<div class="panel-catalog-grid">${options}</div>`;
      }

      function renderPanelManager(device) {
        const navigationCount = device.panelList.filter((panel) => panelIsNavigation(device, panel[1])).length;
        const roleRow = (label, role, glyph) => `
          <div class="panel-role-row">
            <span class="panel-role-icon">${icon(glyph)}</span>
            <span class="panel-role-copy"><small>${label}</small></span>
            <select class="input panel-role-select" data-panel-role="${role}" aria-label="${label}">
              <option value="">Not assigned</option>
              ${device.panelList.map((panel) => `<option value="${panel[1]}" ${device[`${role}Panel`] === panel[1] ? 'selected' : ''}>${panel[0]}</option>`).join('')}
            </select>
          </div>`;
        return `
          <div class="b-side-stack panel-management">
            <section class="surface panel-management-card">
              <div class="surface-heading panel-manager-heading">
                <div class="panel-manager-heading-copy">
                  <h3>Panels</h3>
                  <p>${device.node}</p>
                </div>
              </div>
              <div class="panel-manager-content">
                <button class="button primary panel-manager-add" type="button" data-action="add-panel">${icon('plus')}Add panel</button>
                <div class="panel-manager-summary">
                  <span><strong>${device.panelList.length}</strong> panels</span>
                  <span class="panel-manager-sep">·</span>
                  <span><strong>${navigationCount}</strong> in navigation</span>
                </div>
                <p class="panel-manager-note">Edit a panel from the list to configure its name, menu visibility and home or idle role.</p>
              </div>
            </section>
            <section class="surface panel-role-card">
              <div class="surface-heading">
                <div>
                  <h3>Home & idle panels</h3>
                  <p>Pages opened by device shortcuts.</p>
                </div>
              </div>
              <div class="panel-role-list">
                ${roleRow('Home panel', 'home', 'home')}
                ${roleRow('Idle panel', 'idle', 'clock')}
              </div>
            </section>
          </div>`;
      }

      function renderPanelWorkspace(device) {
        const isOverview = state.devicePanelView === 'overview';
        const isLive = state.previewMode === 'live';
        const hasPanels = device.panelList.length > 0;
        return `
          <section class="surface panel-workspace ${isOverview && state.previewMode === 'live' ? 'preview-live' : ''}">
            <div class="surface-heading">
              <div class="panel-workspace-actions">
                <div class="panel-workspace-toggle" role="group" aria-label="Panel view">
                  <button class="panel-workspace-toggle-option ${isOverview ? 'active' : ''}" type="button" data-device-panel-view="overview" aria-pressed="${isOverview}" ${hasPanels ? '' : 'disabled'}>${icon('screen')}Overview</button>
                  <button class="panel-workspace-toggle-option ${!isOverview ? 'active' : ''}" type="button" data-device-panel-view="edit" aria-pressed="${!isOverview}">${icon('list')}Panels<span class="panel-workspace-count">${device.panels}</span></button>
                </div>
                ${isOverview ? `<div class="preview-controls-row">
                  <div class="preview-control-actions">
                    <button class="preview-tool-button ${isLive ? 'active' : ''}" type="button" data-preview-live-toggle aria-pressed="${isLive}" aria-label="Live preview" title="Toggle live preview">${icon('activity')}<span>Live</span></button>
                    <button class="preview-tool-button ${state.previewIdle ? 'active' : ''}" type="button" data-preview-idle aria-pressed="${state.previewIdle}" title="Snooze to the idle page">${icon('sleep')}<span>Snooze</span></button>
                    <button class="preview-tool-button ${state.showPreviewTools ? 'active' : ''}" type="button" data-preview-tools aria-label="Advanced preview tools" title="Advanced preview tools" aria-expanded="${state.showPreviewTools}" aria-controls="previewTools">${icon('tune')}</button>
                  </div>
                </div>` : ''}
                ${isOverview && state.showPreviewTools ? `<div class="preview-tools" id="previewTools">
                  <label class="preview-entity-toggle"><input type="checkbox" data-preview-entities ${state.showPreviewEntities ? 'checked' : ''}>Show entities</label>
                  <button class="preview-tool-button" type="button" data-preview-reset>${icon('refresh')}<span>${state.previewMode === 'live' ? 'Reset interaction' : 'Reset sandbox'}</span></button>
                </div>` : ''}
              </div>
            </div>
            <div class="panel-workspace-content">${isOverview ? renderPanelPreview(device) : renderPanelOverview(device)}</div>
          </section>`;
      }

      function renderDeviceDetails(device) {
        const online = device.status === 'online';
        const target = typeof device.update === 'string' ? device.update : null;
        const availability = Number.isFinite(device.availability) ? `${device.availability}%` : '—';
        const recency = online
          ? `Online for ${device.uptime} · replied ${device.seen}`
          : `Last seen ${device.seen}`;
        const versionValue = (current) => target
          ? `<span class="version-current">${current}</span><span class="version-arrow" aria-hidden="true">→</span><span class="version-target">${target}</span>`
          : current;
        // Only readings that come from the device over the connection go stale.
        const facts = [
          { label: 'Current page', value: online ? device.page : '—', glyph: 'panels', stale: !online },
          { label: 'IP address', value: device.ip, tone: 'mono', glyph: 'network' },
          { label: 'Firmware', value: versionValue(device.firmware), tone: target ? '' : 'mono', glyph: 'lightning' },
          { label: 'Display TFT', value: versionValue(device.display), tone: target ? '' : 'mono', glyph: 'screen' },
        ];
        return `
          <div class="b-side-stack">
            <section class="surface device-status-card">
              <div class="surface-heading device-status-heading">
                <div class="device-status-heading-copy">
                  <h3>Connection &amp; device</h3>
                  <p>${device.node}</p>
                </div>
                <div class="device-status-heading-actions">
                  <button class="device-configure-button" type="button" data-action="configure">${icon('settings')}<span>Configure</span></button>
                  <button class="device-more-trigger" type="button" data-device-actions-menu aria-expanded="false" aria-controls="deviceActionsPopover" aria-label="Device actions">${icon('dots')}</button>
                </div>
              </div>
              <div class="connection-hero ${statusClass(device)}">
                <span class="connection-hero-icon" aria-hidden="true">${icon(online ? 'wifi' : 'alert')}</span>
                <div class="connection-hero-copy">
                  <strong>${statusText(device)}</strong>
                  <span>${recency}</span>
                </div>
                <div class="connection-hero-gauge">
                  <strong>${availability}</strong>
                  <small>Availability</small>
                </div>
              </div>
              <dl class="device-facts">
                ${facts.map(({ label, value, tone, glyph, stale }) => `
                  <div class="fact${stale ? ' stale' : ''}">
                    <dt><span class="fact-icon" aria-hidden="true">${icon(glyph)}</span>${label}</dt>
                    <dd${tone ? ` class="${tone}"` : ''}>${value}</dd>
                  </div>`).join('')}
              </dl>
              ${device.update ? `
                <button class="device-status-update" type="button" data-firmware-device="${device.id}" aria-expanded="false" aria-controls="firmwarePopover">
                  <span class="device-status-update-icon" aria-hidden="true">${icon('download')}</span>
                  <span class="device-status-update-copy">
                    <strong>Update available</strong>
                    <small>${online ? `Firmware and display · ${target ?? 'newer release'}` : 'Queued until the device reconnects'}</small>
                  </span>
                  <span class="device-status-update-action">Review ${icon('chevron-right')}</span>
                </button>` : ''}
            </section>
            <section class="surface yaml-card">
              <div class="surface-heading">
                <div>
                  <h3>Configuration file</h3>
                  <p>${device.node}.yaml</p>
                </div>
                <span class="variant-badge">${icon('file')}YAML</span>
              </div>
              <div class="yaml-card-body">
                <p class="yaml-card-note">Back up this device or restore it on another hub. An import replaces the name, orientation, roles and panel list.</p>
                <div class="yaml-card-actions">
                  <button class="button outline" type="button" data-yaml-import>${icon('upload')}Import YAML</button>
                  <button class="button outline" type="button" data-yaml-export>${icon('download')}Export YAML</button>
                </div>
              </div>
            </section>
          </div>`;
      }

      function renderSelectedDevice(device) {
        const sidePanel = state.devicePanelView === 'edit'
          ? renderPanelManager(device)
          : renderDeviceDetails(device);
        return `
          <div class="b-selected-head">
            <div class="b-selected-identity">
              <button class="back-button" type="button" data-action="all" aria-label="Show all devices">${icon('arrow-left')}</button>
              <div class="b-selected-copy"><h2>${device.name}</h2></div>
            </div>
          </div>
          <div class="b-focus-grid">${renderPanelWorkspace(device)}${sidePanel}</div>`;
      }

      function renderDeviceSettings(device) {
        return `
          <section class="form-section"><h3>Device</h3><label class="field"><span class="field-label">Display name</span><input class="input" name="device-name" value="${device.name}"></label><label class="field"><span class="field-label">ESPHome node</span><input class="input" value="${device.node}" disabled></label><label class="switch-row"><span class="switch-copy"><span class="field-label">Enabled</span><span class="field-hint">Include this device in the dashboard.</span></span><input class="switch" type="checkbox" checked></label></section>
          <section class="form-section"><h3>Display</h3><label class="field"><span class="field-label">Model and orientation</span><select class="input"><option ${device.orientation === 'landscape' ? 'selected' : ''}>NSPanel · Landscape</option><option ${device.orientation === 'portrait' ? 'selected' : ''}>NSPanel · Portrait</option></select></label><label class="field"><span class="field-label">Brightness <span class="field-hint" id="brightnessValue">78%</span></span><input class="range" type="range" min="10" max="100" value="78"></label><label class="field"><span class="field-label">Idle page</span><select class="input"><option>Clock</option><option>Weather</option><option>Blank</option></select></label></section>
          <section class="form-section"><h3>Updates</h3><label class="switch-row"><span class="switch-copy"><span class="field-label">Automatic updates</span><span class="field-hint">Install firmware and TFT updates automatically.</span></span><input class="switch" type="checkbox" checked></label><label class="field"><span class="field-label">Release channel</span><select class="input"><option>Stable</option><option>Development</option></select></label><button class="button outline" data-action="update">${icon('download')}Check for updates</button></section>`;
      }

      function renderPanelSettings(device, panel) {
        const [name, key, , preview] = panel;
        const details = PANEL_DETAILS[key];
        const itemLabel = details.items === 1 ? 'item configured' : 'items configured';
        return `
          <div class="panel-editor-preview"><img src="${screenUrl(device, preview)}" alt="${name} panel preview" loading="lazy"></div>
          <section class="form-section">
            <h3>Panel</h3>
            <label class="field"><span class="field-label">Panel name</span><input class="input" name="panel-name" value="${name}"></label>
            <label class="field"><span class="field-label">Panel type</span><input class="input" value="${details.type}" disabled></label>
            <label class="field"><span class="field-label">Panel key</span><input class="input" value="${key}" disabled></label>
          </section>
          <section class="form-section">
            <h3>Panel behavior</h3>
            <label class="switch-row"><span class="switch-copy"><span class="field-label">Show in navigation</span><span class="field-hint">Make this panel available in the device menu.</span></span><input class="switch" name="panel-navigation" type="checkbox" ${panelIsNavigation(device, key) ? 'checked' : ''}></label>
            <label class="switch-row"><span class="switch-copy"><span class="field-label">Home panel</span><span class="field-hint">Open this panel when Home is pressed.</span></span><input class="switch" name="panel-home" type="checkbox" ${device.homePanel === key ? 'checked' : ''}></label>
            <label class="switch-row"><span class="switch-copy"><span class="field-label">Idle panel</span><span class="field-hint">Show this panel after the idle timeout.</span></span><input class="switch" name="panel-idle" type="checkbox" ${device.idlePanel === key ? 'checked' : ''}></label>
          </section>
          <section class="form-section"><h3>Panel content</h3><div class="panel-editor-item-summary"><strong>${details.items}</strong><span>${itemLabel}</span><p>${details.description}</p></div></section>`;
      }

      function renderSidebar() {
        const device = byId(state.selected);
        const footer = $('#sidebarFooter');
        if (state.sidebarMode === 'catalog' && device) {
          $('#configTitle').textContent = 'Add a panel';
          $('#configSubtitle').textContent = `${device.name} · Choose a screen layout`;
          configBody.innerHTML = renderPanelCatalog(device);
          footer.hidden = true;
          return;
        }
        footer.hidden = false;
        if (state.sidebarMode === 'panel' && device) {
          const panel = device.panelList.find((entry) => entry[1] === state.panelEditKey);
          if (panel) {
            $('#configTitle').textContent = 'Edit panel';
            $('#configSubtitle').textContent = `${device.name} · ${panel[0]}`;
            configBody.innerHTML = renderPanelSettings(device, panel);
            $('#saveConfig').textContent = 'Save panel';
            return;
          }
        }
        $('#configTitle').textContent = 'Device configuration';
        $('#configSubtitle').textContent = device ? `${device.name} · ${device.node}` : '';
        configBody.innerHTML = device ? renderDeviceSettings(device) : '';
        $('#saveConfig').textContent = 'Save changes';
      }

      function updateSidebarState() {
        app.classList.toggle('sidebar-open', state.sidebarOpen);
        configPanel.setAttribute('aria-hidden', String(!state.sidebarOpen));
        configPanel.inert = !state.sidebarOpen;
        configPanel.setAttribute('role', 'dialog');
        if (state.sidebarOpen) configPanel.setAttribute('aria-modal', 'true');
        else configPanel.removeAttribute('aria-modal');
        document.body.style.overflow = state.sidebarOpen ? 'hidden' : '';
      }

      function render() {
        closePanelPreviewPopover();
        closeFirmwarePopover();
        if (!state.selected) {
          state.sidebarOpen = false;
          state.sidebarMode = 'device';
          state.panelEditKey = null;
        }
        const scrollLeft = cardScroller.scrollLeft;
        cardScroller.innerHTML = DEVICES.map(renderDeviceCard).join('');
        cardScroller.scrollLeft = scrollLeft;
        app.classList.toggle('device-selected', Boolean(state.selected));
        const device = byId(state.selected);
        overview.innerHTML = device ? renderSelectedDevice(device) : renderAllD();
        renderSidebar();
        updateSidebarState();
      }

      function moveItemTo(items, sourceID, targetID, getID) {
        const sourceIndex = items.findIndex((item) => getID(item) === sourceID);
        const targetIndex = items.findIndex((item) => getID(item) === targetID);
        if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return false;
        const [item] = items.splice(sourceIndex, 1);
        items.splice(targetIndex, 0, item);
        return true;
      }

      function reorderDevice(sourceID, targetID) {
        return moveItemTo(DEVICES, sourceID, targetID, (device) => device.id);
      }

      function reorderPanel(device, sourceKey, targetKey) {
        if (!device) return false;
        const sourceIndex = device.panelList.findIndex((panel) => panel[1] === sourceKey);
        const targetExists = device.panelList.some((panel) => panel[1] === targetKey);
        if (sourceIndex < 0 || !targetExists || sourceKey === targetKey) return false;
        const targetNavigation = panelIsNavigation(device, targetKey);
        const [source] = device.panelList.splice(sourceIndex, 1);
        const hiddenPanels = new Set(device.hiddenPanels || []);
        if (targetNavigation) hiddenPanels.delete(sourceKey);
        else hiddenPanels.add(sourceKey);
        device.hiddenPanels = [...hiddenPanels];
        const destination = device.panelList.filter((panel) => panelIsNavigation(device, panel[1]) === targetNavigation);
        const targetIndex = destination.findIndex((panel) => panel[1] === targetKey);
        destination.splice(targetIndex, 0, source);
        const otherGroup = device.panelList.filter((panel) => panelIsNavigation(device, panel[1]) !== targetNavigation);
        const navigation = targetNavigation ? destination : otherGroup;
        const hidden = targetNavigation ? otherGroup : destination;
        device.panelList.splice(0, device.panelList.length, ...navigation, ...hidden);
        return true;
      }

      function movePanelToGroup(device, key, targetGroup) {
        const sourceIndex = device?.panelList.findIndex((panel) => panel[1] === key) ?? -1;
        if (sourceIndex < 0) return false;
        const targetNavigation = targetGroup.endsWith(':navigation');
        const currentNavigation = panelIsNavigation(device, key);
        const currentGroup = device.panelList.filter((panel) => panelIsNavigation(device, panel[1]) === currentNavigation);
        if (currentNavigation === targetNavigation && currentGroup.at(-1)?.[1] === key) return false;
        const [panel] = device.panelList.splice(sourceIndex, 1);
        const hiddenPanels = new Set(device.hiddenPanels || []);
        if (targetNavigation) hiddenPanels.delete(key);
        else hiddenPanels.add(key);
        device.hiddenPanels = [...hiddenPanels];
        const navigation = device.panelList.filter((entry) => panelIsNavigation(device, entry[1]));
        const hidden = device.panelList.filter((entry) => !panelIsNavigation(device, entry[1]));
        (targetNavigation ? navigation : hidden).push(panel);
        device.panelList.splice(0, device.panelList.length, ...navigation, ...hidden);
        return true;
      }

      function addPanel(device, templateKey) {
        const template = PANEL_CATALOG.find((panel) => panel.key === templateKey);
        if (!device || !template) return;
        const existingKeys = new Set(device.panelList.map((panel) => panel[1]));
        let suffix = 1;
        let key = template.key;
        while (existingKeys.has(key)) {
          suffix += 1;
          key = `${template.key}_${suffix}`;
        }
        const name = suffix === 1 ? template.name : `${template.name} ${suffix}`;
        PANEL_DETAILS[key] = template.details;
        device.panelList.push([name, key, template.glyph, template.preview]);
        device.panels = device.panelList.length;
        state.previewPanelKey = key;
        state.sidebarOpen = false;
        state.sidebarMode = 'device';
        render();
        overview.querySelector(`[data-panel-menu="${key}"]`)?.focus();
        showToast(`${name} panel added.`);
      }

        const margin = 12;

      function positionPanelPreviewPopover(x, y) {
        if (!previewPopoverSize) return;
        const { width, height } = previewPopoverSize;
        const margin = 12;
        const offset = 16;
        let left = x + offset;
        if (left + width > innerWidth - margin) left = x - width - offset;
        left = Math.min(Math.max(margin, left), innerWidth - width - margin);
        let top = y + offset;
        if (top + height > innerHeight - margin) top = y - height - offset;
        top = Math.min(Math.max(margin, top), innerHeight - height - margin);
        panelPreviewPopover.style.left = `${left}px`;
        panelPreviewPopover.style.top = `${top}px`;

      function closeFirmwarePopover(restoreFocus = false) {

      function openFirmwarePopover(trigger, deviceId = trigger.dataset.firmwareDevice) {
        const device = byId(deviceId);
        const available = Boolean(device.update);
        const updateState = available ? 'Update available' : 'Up to date';
        const note = available
          ? device.status === 'offline'
            ? 'This device is offline. The update will be queued until it reconnects.'
            : 'Firmware and display updates are ready to install.'
          : 'Firmware and display are on the latest release.';
        const actionLabel = available
          ? device.status === 'offline' ? 'Queue update' : 'Install update'
          : 'Check for updates';
        const version = (current) => `${current}${available ? `<small>→ ${device.update}</small>` : '<small>Current</small>'}`;

        firmwarePopover.innerHTML = `
          <header class="firmware-popover-heading">
            <div><h3>Firmware & display</h3><p>${device.name} · ${device.node}</p></div>

            <div class="firmware-release-row"><span>Display TFT</span><strong class="firmware-release-version">${version(device.display)}</strong></div>
          </div>
          <div class="firmware-popover-state ${available ? 'available' : ''}"><i class="status-dot ${available ? device.status === 'offline' ? 'offline' : 'warning' : 'online'}"></i>${updateState}</div>
          <p class="firmware-popover-note">${note}</p>
          <button class="button ${available ? 'primary' : 'outline'}" type="button" data-firmware-action>${actionLabel}</button>`;
        firmwarePopover.hidden = false;
        state.firmwareDevice = device.id;
        state.firmwareTrigger = trigger;
        trigger.setAttribute('aria-expanded', 'true');

        const triggerBounds = trigger.getBoundingClientRect();

        const margin = 12;

        const safeBottom = innerHeight - margin;
        const top = below + popoverBounds.height <= safeBottom
          ? below
          : Math.max(margin, triggerBounds.top - popoverBounds.height - 8);
        firmwarePopover.style.left = `${left}px`;
        firmwarePopover.style.top = `${top}px`;
        firmwarePopover.focus();

      function openConfig() {

        renderSidebar();
        updateSidebarState();
        requestAnimationFrame(() => configPanel.focus());
      }

      function openPanelEditor(key) {
        const device = byId(state.selected);
        if (!device?.panelList.some((panel) => panel[1] === key)) return;
        state.returnFocus = document.activeElement;
        state.sidebarMode = 'panel';
        state.panelEditKey = key;
        state.sidebarOpen = true;
        renderSidebar();
        updateSidebarState();
        requestAnimationFrame(() => configPanel.focus());

        state.sidebarMode = 'catalog';
        state.panelEditKey = null;
        state.sidebarOpen = true;
        renderSidebar();
        updateSidebarState();
        requestAnimationFrame(() => configPanel.focus());
      }

      function closeConfig() {
        if (!state.sidebarOpen) return;
        state.sidebarOpen = false;
        state.sidebarMode = 'device';
        state.panelEditKey = null;
        updateSidebarState();
        if (state.returnFocus && typeof state.returnFocus.focus === 'function') state.returnFocus.focus();
      }

      cardScroller.addEventListener('click', (event) => {
        const card = event.target.closest('[data-device]');
        if (card) selectDevice(card.dataset.device);
      });
      overview.addEventListener('click', (event) => {
        const idleButton = event.target.closest('[data-preview-idle]');
        if (idleButton) {
          state.previewIdle = !state.previewIdle;
          render();
          showToast(state.previewIdle ? 'Idle page shown.' : 'Idle page dismissed.');
          return;
        }
        const toolsButton = event.target.closest('[data-preview-tools]');
        if (toolsButton) {
          state.showPreviewTools = !state.showPreviewTools;
          render();
          return;
        }
        const resetPreviewButton = event.target.closest('[data-preview-reset]');
        if (resetPreviewButton) {
          showToast(state.previewMode === 'live' ? 'Interaction timer reset.' : 'Sandbox reset.');
          return;
        }
        const entityToggle = event.target.closest('[data-preview-entities]');
        if (entityToggle) {
          state.showPreviewEntities = entityToggle.checked;
          render();
          return;
        }
        const liveToggle = event.target.closest('[data-preview-live-toggle]');
        if (liveToggle) {
          state.previewMode = state.previewMode === 'live' ? 'simulated' : 'live';
          render();
          return;
        }
        const simButton = event.target.closest('[data-sim-button]');
        if (simButton) {
          showToast(`${simButton.dataset.simButton === 'left' ? 'Left' : 'Right'} button pressed.`);
          return;
        }
        const panelViewButton = event.target.closest('[data-device-panel-view]');
        if (panelViewButton) {
          if (panelViewButton.dataset.devicePanelView === 'overview' && !byId(state.selected).panelList.length) return;
          state.devicePanelView = panelViewButton.dataset.devicePanelView;
          render();
          return;
        }
        const deviceMenuTrigger = event.target.closest('[data-device-menu]');
        if (deviceMenuTrigger) {
          if (state.deviceMenuTrigger === deviceMenuTrigger && !deviceMenuPopover.hidden) closeDeviceMenu(true);
          else {
            closeDeviceMenu();
            closeFirmwarePopover();
            openDeviceMenu(deviceMenuTrigger);
          }
          return;
        }
        const firmwareTrigger = event.target.closest('[data-firmware-device]');
        if (firmwareTrigger) {
          if (state.firmwareTrigger === firmwareTrigger && !firmwarePopover.hidden) closeFirmwarePopover(true);
          else {
            closeDeviceActions();
            closeDeviceMenu();
            closePanelMenu();
            openFirmwarePopover(firmwareTrigger);
          }
          return;
        }
        const deviceActionsTrigger = event.target.closest('[data-device-actions-menu]');
        if (deviceActionsTrigger) {
          if (state.deviceActionsTrigger === deviceActionsTrigger && !deviceActionsPopover.hidden) closeDeviceActions(true);
          else {
            closeDeviceActions();
            closeDeviceMenu();
            closePanelMenu();
            closeFirmwarePopover();
            openDeviceActions(deviceActionsTrigger);
          }
          return;
        }
        const panelMenuTrigger = event.target.closest('[data-panel-menu]');
        if (panelMenuTrigger) {
          if (state.panelMenuTrigger === panelMenuTrigger && !panelMenuPopover.hidden) closePanelMenu(true);
          else {
            closePanelMenu();
            closeDeviceMenu();
            closeFirmwarePopover();
            openPanelMenu(panelMenuTrigger);
          }
          return;
        }
        const panelThumb = event.target.closest('[data-panel-preview]');
        if (panelThumb) {
          openPanelPreviewPopover(panelThumb);
          return;
        }
        const panelRow = event.target.closest('[data-panel-row]');
        if (panelRow) { openPanelEditor(panelRow.dataset.panelRow); return; }
        const yamlExportButton = event.target.closest('[data-yaml-export]');
        if (yamlExportButton) { exportDeviceYaml(byId(state.selected)); return; }
        const yamlImportButton = event.target.closest('[data-yaml-import]');
        if (yamlImportButton) { startDeviceImport(byId(state.selected)); return; }
        const addPanelButton = event.target.closest('[data-add-panel]');

          addPanel(byId(state.selected), addPanelButton.dataset.addPanel);
          return;

        const deviceButton = event.target.closest('[data-device]');
        if (deviceButton) { selectDevice(deviceButton.dataset.device); return; }
        const actionButton = event.target.closest('[data-action]');
        if (!actionButton) return;
        const action = actionButton.dataset.action;
        if (action === 'all') { state.selected = null; render(); scrollToTop(); }
        else if (action === 'configure') openConfig();
        else if (action === 'add-panel') openPanelCatalog();
        else if (action === 'panel' || action === 'panels') showToast('Panel editing would open in this workspace.');
        else if (action === 'logs') showToast('Device logs would open here.');
        else if (action === 'restart') showToast('Restart command sent to the device.');
        else if (action === 'update') showToast('Checking for device updates…');
      });
      overview.addEventListener('pointerover', (event) => {
        if (!(event.target instanceof Element)) return;
        const thumb = event.target.closest('[data-panel-preview]');
        if (!thumb || thumb === state.previewHoverRow) return;
        if (!(event.relatedTarget instanceof Node) || !thumb.contains(event.relatedTarget)) {
          openPanelPreviewPopover(thumb);
        }
      });
      overview.addEventListener('pointermove', (event) => {
        if (!state.previewHoverRow || !(event.target instanceof Element)) return;
        if (event.target.closest('[data-panel-preview]') !== state.previewHoverRow) return;
        positionPanelPreviewPopover(event.clientX, event.clientY);
      });
      overview.addEventListener('pointerout', (event) => {
        if (!(event.target instanceof Element)) return;
        const thumb = event.target.closest('[data-panel-preview]');
        if (!thumb || state.previewHoverRow !== thumb) return;
        if (event.relatedTarget instanceof Node && thumb.contains(event.relatedTarget)) return;
        closePanelPreviewPopover();

      $('#content').addEventListener('scroll', closePanelPreviewPopover, { passive: true });
      window.addEventListener('scroll', closePanelPreviewPopover, { passive: true });
      overview.addEventListener('change', (event) => {
        const selector = event.target.closest('[data-panel-role]');
        if (!selector) return;
        const device = byId(state.selected);
        if (!device) return;
        const role = selector.dataset.panelRole;
        device[`${role}Panel`] = selector.value || null;
        if (role === 'home') state.previewPanelKey = selector.value || device.panelList[0]?.[1] || null;
        render();
        showToast(`${role === 'home' ? 'Home' : 'Idle'} panel updated.`);
      });
      document.addEventListener('dragstart', (event) => {
        if (!(event.target instanceof Element)) return;
        closePanelPreviewPopover();
        const item = event.target.closest('[data-sort-kind][data-sort-id]');
        if (!item) return;
        state.dragItem = { kind: item.dataset.sortKind, id: item.dataset.sortId };
        item.classList.add('sort-dragging');
        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', `${state.dragItem.kind}:${state.dragItem.id}`);
        }
      });
      document.addEventListener('dragover', (event) => {
        if (!state.dragItem || !(event.target instanceof Element)) return;
        const target = event.target.closest('[data-sort-kind="device"][data-sort-id], [data-sort-kind="panel"][data-sort-id], [data-sort-kind="panel-group"][data-sort-group]');
        if (!target) return;
        if (state.dragItem.kind === 'device' && target.dataset.sortKind !== 'device') return;
        if (state.dragItem.kind === 'panel' && !['panel', 'panel-group'].includes(target.dataset.sortKind)) return;
        event.preventDefault();
        if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
        target.classList.add('sort-over');
      });
      document.addEventListener('drop', (event) => {
        if (!state.dragItem || !(event.target instanceof Element)) return;
        const target = event.target.closest('[data-sort-kind="device"][data-sort-id], [data-sort-kind="panel"][data-sort-id], [data-sort-kind="panel-group"][data-sort-group]');
        if (!target) return;
        if (state.dragItem.kind === 'device' && target.dataset.sortKind !== 'device') return;
        if (state.dragItem.kind === 'panel' && !['panel', 'panel-group'].includes(target.dataset.sortKind)) return;
        event.preventDefault();
        const changed = state.dragItem.kind === 'device'
          ? reorderDevice(state.dragItem.id, target.dataset.sortId)
          : target.dataset.sortKind === 'panel'
            ? reorderPanel(byId(state.selected), state.dragItem.id, target.dataset.sortId)
            : movePanelToGroup(byId(state.selected), state.dragItem.id, target.dataset.sortGroup);
        state.dragItem = null;
        if (changed) render();
      });
      document.addEventListener('dragend', () => {
        state.dragItem = null;
        document.querySelectorAll('.sort-dragging, .sort-over').forEach((item) => item.classList.remove('sort-dragging', 'sort-over'));
      });
      deviceMenuPopover.addEventListener('click', (event) => {
        const actionButton = event.target.closest('[data-device-menu-action]');

        event.stopPropagation();
        const device = byId(state.deviceMenuDevice);

        if (action === 'activate') {
          closeDeviceMenu();
          if (state.selected === device.id) scrollToDevicePreview();
          else selectDevice(device.id);
        } else if (action === 'firmware') {
          closeDeviceMenu();
          openFirmwarePopover(trigger, device.id);
        } else if (action === 'delete') {
          closeDeviceMenu();
          const index = DEVICES.findIndex((entry) => entry.id === device.id);
          if (index >= 0) DEVICES.splice(index, 1);
          if (state.selected === device.id) state.selected = null;
          render();
          showToast(`${device.name} removed from the hub.`);
        }
      });
      panelMenuPopover.addEventListener('click', (event) => {
        const actionButton = event.target.closest('[data-panel-menu-action]');
        if (!actionButton) return;
        event.stopPropagation();
        const device = byId(state.panelMenuDevice);
        const key = state.panelMenuKey;
        const action = actionButton.dataset.panelMenuAction;
        if (!device || !key) { closePanelMenu(); return; }
        if (action === 'edit') {
          closePanelMenu();
          openPanelEditor(key);
        } else if (action === 'remove') {
          closePanelMenu();
          const panel = device.panelList.find((entry) => entry[1] === key);
          device.panelList = device.panelList.filter((entry) => entry[1] !== key);
          device.panels = device.panelList.length;
          if (device.homePanel === key) device.homePanel = null;
          if (device.idlePanel === key) device.idlePanel = null;
          render();
          showToast(`${panel?.[0] ?? key} removed.`);
        }
      });
      deviceActionsPopover.addEventListener('click', (event) => {
        const actionButton = event.target.closest('[data-device-actions-action]');
        if (!actionButton) return;
        event.stopPropagation();
        const action = actionButton.dataset.deviceActionsAction;
        closeDeviceActions();
        if (action === 'restart') showToast('Restart command sent to the device.');
        else if (action === 'update') showToast('Checking for device updates…');
        else if (action === 'logs') showToast('Device logs would open here.');
      });
      firmwarePopover.addEventListener('click', (event) => {
        if (event.target.closest('[data-firmware-close]')) {
          closeFirmwarePopover(true);
          return;
        }
        if (event.target.closest('[data-firmware-action]')) {
          const device = byId(state.firmwareDevice);
          showToast(device.update
            ? device.status === 'offline'
              ? `Update queued for ${device.name} when it reconnects.`
              : `Update started for ${device.name}.`
            : `No updates available for ${device.name}.`);
          closeFirmwarePopover(true);
        }
      });
      document.addEventListener('click', (event) => {
        if (!(event.target instanceof Element)) return;
        if (!deviceMenuPopover.hidden && !event.target.closest('#deviceMenuPopover, [data-device-menu]')) closeDeviceMenu();
        if (!panelMenuPopover.hidden && !event.target.closest('#panelMenuPopover, [data-panel-menu]')) closePanelMenu();
        if (!deviceActionsPopover.hidden && !event.target.closest('#deviceActionsPopover, [data-device-actions-menu]')) closeDeviceActions();
        if (firmwarePopover.hidden) return;
        if (event.target.closest('#firmwarePopover, #deviceMenuPopover, #panelMenuPopover, #deviceActionsPopover, [data-firmware-device], [data-device-menu], [data-panel-menu], [data-device-actions-menu]')) return;
        closeFirmwarePopover();
      });
      $('#content').addEventListener('scroll', () => { closeDeviceMenu(); closePanelMenu(); closeDeviceActions(); closeFirmwarePopover(); });
      window.addEventListener('resize', () => { closeDeviceMenu(); closePanelMenu(); closeDeviceActions(); closeFirmwarePopover(); });
      configBody.addEventListener('input', (event) => {
        if (event.target.matches('.range')) $('#brightnessValue').textContent = `${event.target.value}%`;
      });
      configBody.addEventListener('click', (event) => {
        const addPanelButton = event.target.closest('[data-add-panel]');
        if (addPanelButton) {
          addPanel(byId(state.selected), addPanelButton.dataset.addPanel);
          return;
        }
        const actionButton = event.target.closest('[data-action]');
        if (actionButton?.dataset.action === 'update') showToast('Checking for device updates…');
      });
      $('#closeConfig').addEventListener('click', closeConfig);
      $('#cancelConfig').addEventListener('click', closeConfig);
      $('#scrim').addEventListener('click', closeConfig);
      $('#saveConfig').addEventListener('click', () => {
        const device = byId(state.selected);
        if (state.sidebarMode === 'panel') {
          const panelKey = state.panelEditKey;
          const panel = device?.panelList.find((entry) => entry[1] === panelKey);
          if (device && panel) {
            const key = panel[1];
            const nameInput = configBody.querySelector('[name="panel-name"]');
            if (nameInput?.value.trim()) panel[0] = nameInput.value.trim();
            const navigation = configBody.querySelector('[name="panel-navigation"]').checked;
            const hiddenPanels = device.hiddenPanels || [];
            device.hiddenPanels = navigation
              ? hiddenPanels.filter((hiddenKey) => hiddenKey !== key)
              : [...new Set([...hiddenPanels, key])];
            const home = configBody.querySelector('[name="panel-home"]').checked;
            if (home) {
              device.homePanel = key;
              state.previewPanelKey = key;
            } else if (device.homePanel === key) {
              device.homePanel = null;
              state.previewPanelKey = device.panelList.find((entry) => entry[1] !== key)?.[1] ?? null;
            }
            const idle = configBody.querySelector('[name="panel-idle"]').checked;
            if (idle) device.idlePanel = key;
            else if (device.idlePanel === key) device.idlePanel = null;
          }
          state.sidebarOpen = false;
          state.sidebarMode = 'device';
          state.panelEditKey = null;
          render();
          overview.querySelector(`[data-panel-menu="${panelKey}"]`)?.focus();
          showToast('Panel settings saved.');
          return;
        }
        const nameInput = configBody.querySelector('[name="device-name"]');
        if (device && nameInput?.value.trim()) device.name = nameInput.value.trim();
        state.sidebarOpen = false;
        state.sidebarMode = 'device';
        state.panelEditKey = null;
        render();
        showToast('Settings saved in this prototype.');
      });
      $('#notificationsButton').addEventListener('click', () => showToast('Two sample notifications are waiting.'));
      $('#scrollDevicesLeft').addEventListener('click', () => cardScroller.scrollBy({ left: -260, behavior: 'smooth' }));
      $('#scrollDevicesRight').addEventListener('click', () => cardScroller.scrollBy({ left: 260, behavior: 'smooth' }));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !deviceActionsPopover.hidden) { closeDeviceActions(true); return; }
        if (event.key === 'Escape' && !panelMenuPopover.hidden) { closePanelMenu(true); return; }
        if (event.key === 'Escape' && !deviceMenuPopover.hidden) { closeDeviceMenu(true); return; }
        if (event.key === 'Escape' && !firmwarePopover.hidden) { closeFirmwarePopover(true); return; }
        if (event.key === 'Escape' && state.sidebarOpen) { closeConfig(); return; }
      });
      yamlImportInput.addEventListener('change', async () => {
        const file = yamlImportInput.files?.[0];
        const device = byId(state.yamlImportDevice);
        yamlImportInput.value = '';
        state.yamlImportDevice = null;
        if (!file || !device) return;
        try {
          applyDeviceYaml(device, parseDeviceYaml(await file.text()));
        } catch (error) {
          showToast(`Import failed: ${error instanceof Error ? error.message : 'invalid file'}.`);
        }
      });
      render();
    </script>
  </body>
</html>
