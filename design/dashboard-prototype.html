<!doctype html>
<!--
  Single-page dashboard prototype for an NSPanel device fleet.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/png" href="../custom_components/nspanel_haui/brand/logo.png">
    <title>NSPanel HAUI | Dashboard prototype</title>
    <style>
      :root {
        color-scheme: light;

        /* Home Assistant design tokens — light theme */
        --ha-font-family-body: Roboto, "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ha-font-family-code: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        --ha-font-size-xs: 10px;
        --ha-font-size-s: 12px;
        --ha-font-size-m: 14px;
        --ha-font-size-l: 16px;
        --ha-font-size-xl: 20px;
        --ha-font-size-2xl: 24px;
        --ha-font-size-3xl: 28px;
        --ha-font-weight-normal: 400;
        --ha-font-weight-medium: 500;
        --ha-font-weight-bold: 700;
        --ha-line-height-condensed: 1.2;
        --ha-line-height-normal: 1.6;

        --ha-space-1: 4px;
        --ha-space-2: 8px;
        --ha-space-3: 12px;
        --ha-space-4: 16px;
        --ha-space-5: 20px;
        --ha-space-6: 24px;
        --ha-space-7: 28px;
        --ha-space-8: 32px;
        --ha-space-10: 40px;
        --ha-space-12: 48px;
        --ha-space-14: 56px;

        --ha-border-radius-sm: 4px;
        --ha-border-radius-md: 8px;
        --ha-border-radius-lg: 12px;
        --ha-border-radius-xl: 16px;
        --ha-border-radius-pill: 9999px;

        --ha-box-shadow-s: 0 1px 2px 0 rgba(0, 0, 0, .08), 0 1px 3px 0 rgba(0, 0, 0, .12);
        --ha-box-shadow-m: 0 3px 6px -1px rgba(0, 0, 0, .1), 0 8px 16px -2px rgba(0, 0, 0, .15);
        --ha-box-shadow-l: 0 6px 12px -3px rgba(0, 0, 0, .12), 0 16px 32px -6px rgba(0, 0, 0, .2);

        --ha-color-primary-05: #001721;
        --ha-color-primary-10: #002e3e;
        --ha-color-primary-20: #004156;
        --ha-color-primary-30: #006787;
        --ha-color-primary-40: #009ac7;
        --ha-color-primary-50: #18bcf2;
        --ha-color-primary-60: #37c8fd;
        --ha-color-primary-70: #7bd4fb;
        --ha-color-primary-80: #b9e6fc;
        --ha-color-primary-90: #dff3fc;
        --ha-color-primary-95: #eff9fe;

        --ha-color-neutral-05: #141414;
        --ha-color-neutral-10: #202020;
        --ha-color-neutral-20: #363636;
        --ha-color-neutral-30: #4a4a4a;
        --ha-color-neutral-40: #5e5e5e;
        --ha-color-neutral-50: #7a7a7a;
        --ha-color-neutral-60: #989898;
        --ha-color-neutral-70: #b1b1b1;
        --ha-color-neutral-80: #cccccc;
        --ha-color-neutral-90: #e6e6e6;
        --ha-color-neutral-95: #f3f3f3;

        --ha-color-orange-05: #280700;
        --ha-color-orange-10: #3b0f00;
        --ha-color-orange-20: #5e1c00;
        --ha-color-orange-30: #7e2900;
        --ha-color-orange-40: #9d3800;
        --ha-color-orange-50: #c94e00;
        --ha-color-orange-60: #f36d00;
        --ha-color-orange-70: #ff9342;
        --ha-color-orange-80: #ffbb89;
        --ha-color-orange-90: #ffe0c8;
        --ha-color-orange-95: #fff0e4;

        --ha-color-red-05: #2a040b;
        --ha-color-red-10: #3e0913;
        --ha-color-red-20: #631323;
        --ha-color-red-30: #8a132c;
        --ha-color-red-40: #b30532;
        --ha-color-red-50: #dc3146;
        --ha-color-red-60: #f3676c;
        --ha-color-red-70: #fd8f90;
        --ha-color-red-80: #ffb8b6;
        --ha-color-red-90: #ffdedc;
        --ha-color-red-95: #fff0ef;

        --ha-color-green-05: #031608;
        --ha-color-green-10: #052310;
        --ha-color-green-20: #0a3a1d;
        --ha-color-green-30: #0a5027;
        --ha-color-green-40: #036730;
        --ha-color-green-50: #00883c;
        --ha-color-green-60: #00ac49;
        --ha-color-green-70: #5dc36f;
        --ha-color-green-80: #93da98;
        --ha-color-green-90: #c2f2c1;
        --ha-color-green-95: #e3f9e3;

        /* Home Assistant semantic tokens — light theme */
        --ha-color-text-primary: var(--ha-color-neutral-05);
        --ha-color-text-secondary: var(--ha-color-neutral-40);
        --ha-color-text-disabled: var(--ha-color-neutral-60);
        --ha-color-surface-default: #ffffff;
        --ha-color-surface-low: var(--ha-color-neutral-95);
        --ha-color-surface-lower: var(--ha-color-neutral-90);
        --ha-color-border-neutral-quiet: var(--ha-color-neutral-90);
        --ha-color-border-neutral-normal: var(--ha-color-neutral-60);
        --ha-color-fill-primary-quiet-resting: var(--ha-color-primary-95);
        --ha-color-fill-primary-quiet-hover: var(--ha-color-primary-90);
        --ha-color-fill-primary-loud-resting: var(--ha-color-primary-40);
        --ha-color-fill-primary-loud-hover: var(--ha-color-primary-30);
        --ha-color-fill-neutral-quiet-resting: var(--ha-color-neutral-95);
        --ha-color-fill-neutral-quiet-hover: var(--ha-color-neutral-90);
        --ha-color-fill-neutral-normal-resting: var(--ha-color-neutral-90);
        --ha-color-fill-neutral-normal-hover: var(--ha-color-neutral-80);
        --ha-color-on-primary-quiet: var(--ha-color-primary-50);
        --ha-color-on-primary-normal: var(--ha-color-primary-40);
        --ha-color-on-neutral-quiet: var(--ha-color-neutral-50);
        --ha-color-on-neutral-normal: var(--ha-color-neutral-40);
        --ha-color-fill-success-quiet-resting: var(--ha-color-green-95);
        --ha-color-fill-warning-quiet-resting: var(--ha-color-orange-95);
        --ha-color-fill-danger-quiet-resting: var(--ha-color-red-95);
        --ha-color-on-success-normal: var(--ha-color-green-40);
        --ha-color-on-warning-normal: var(--ha-color-orange-40);
        --ha-color-on-danger-normal: var(--ha-color-red-40);

        /* Home Assistant legacy aliases */
        --primary-color: var(--ha-color-primary-40);
        --primary-text-color: var(--ha-color-text-primary);
        --secondary-text-color: var(--ha-color-text-secondary);
        --disabled-text-color: var(--ha-color-text-disabled);
        --card-background-color: var(--ha-color-surface-default);
        --primary-background-color: #fafafa;
        --secondary-background-color: var(--ha-color-neutral-90);
        --divider-color: var(--ha-color-neutral-90);
        --error-color: var(--ha-color-red-40);
        --warning-color: var(--ha-color-orange-40);
        --success-color: var(--ha-color-green-40);
        --info-color: var(--ha-color-primary-40);
        --header-height: 56px;
        --app-header-background-color: var(--ha-color-surface-default);
        --app-header-text-color: var(--ha-color-text-primary);
        --ha-card-border-radius: var(--ha-border-radius-lg);
        --ha-card-border-color: var(--divider-color);
        --ha-card-background: var(--card-background-color);
        --ha-card-box-shadow: none;
        --ha-button-height: 40px;
        --ha-button-border-radius: var(--ha-border-radius-pill);

        /* Prototype aliases */
        --font: var(--ha-font-family-body);
        --mono: var(--ha-font-family-code);
        --primary: var(--primary-color);
        --primary-dark: var(--ha-color-primary-30);
        --primary-ink: var(--ha-color-primary-30);
        --primary-soft: var(--ha-color-fill-primary-quiet-resting);
        --primary-border: var(--ha-color-primary-80);
        --page: var(--primary-background-color);
        --surface: var(--card-background-color);
        --surface-soft: #f7f7f7;
        --surface-muted: var(--ha-color-fill-neutral-quiet-resting);
        --surface-strong: var(--ha-color-fill-neutral-normal-resting);
        --text: var(--primary-text-color);
        --text-secondary: var(--secondary-text-color);
        --text-disabled: var(--disabled-text-color);
        --border: var(--divider-color);
        --border-strong: var(--ha-color-border-neutral-normal);
        --divider: var(--divider-color);
        --good: var(--success-color);
        --good-soft: var(--ha-color-fill-success-quiet-resting);
        --warn: var(--warning-color);
        --warn-soft: var(--ha-color-fill-warning-quiet-resting);
        --bad: var(--error-color);
        --bad-soft: var(--ha-color-fill-danger-quiet-resting);
        --radius: var(--ha-card-border-radius);
        --radius-sm: var(--ha-border-radius-md);
        --radius-pill: var(--ha-border-radius-pill);
        --shadow-1: var(--ha-box-shadow-s);
        --shadow-2: var(--ha-box-shadow-l);
        --screen: radial-gradient(ellipse at 50% 8%, #2a343d 0, #171d23 58%, #0e1216 100%);
        --preview-live-surface: #e8f4f2;
        --preview-live-border: #9ac8be;
        --preview-live-heading-border: #c8dfda;
        --screen-bezel: #262c32;
        --screen-edge: #32383d;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        background: var(--page);
        color: var(--text);
        font: 14px/1.45 var(--font);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      button, input, select { font: inherit; }
      button { color: inherit; }
      .icon-library { position: absolute; width: 0; height: 0; overflow: hidden; }
      .icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Shell and app bar */
      .shell { display: flex; min-height: 100dvh; flex-direction: column; }
      .titlebar {
        position: sticky;
        z-index: 20;
        top: 0;
        display: flex;
        height: var(--header-height);
        flex: 0 0 var(--header-height);
        align-items: center;
        gap: 12px;
        padding: 0 clamp(14px, 2vw, 24px);
        border-bottom: 1px solid var(--divider-color);
        background: var(--app-header-background-color);
        color: var(--app-header-text-color);
      }
      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
      }
      .brand-mark img { display: block; width: 100%; height: 100%; }
      .brand { display: flex; min-width: 0; align-items: center; gap: 10px; }
      .brand-name { font-size: 16px; font-weight: 500; white-space: nowrap; }
      .brand-divider { height: 20px; border-left: 1px solid var(--border); }
      .brand-section { color: var(--text-secondary); font-size: 14px; white-space: nowrap; }
      .prototype-tag {
        padding: 3px 8px;
        border-radius: var(--radius-pill);
        background: var(--primary-soft);
        color: var(--primary-ink);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .titlebar-spacer { flex: 1; }
      .icon-button {
        position: relative;
        display: inline-grid;
        width: 40px;
        height: 40px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background .15s ease, color .15s ease;
      }
      .icon-button:hover { background: var(--surface-muted); color: var(--text); }
      .notification-count {
        position: absolute;
        top: 3px;
        right: 2px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border: 2px solid var(--surface);
        border-radius: var(--radius-pill);
        background: var(--bad);
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        line-height: 12px;
        text-align: center;
      }

      /* Page frame */
      .workspace { display: flex; min-height: 0; flex: 1; }
      .content {
        width: 100%;
        max-width: 1440px;
        min-width: 0;
        flex: 1 1 auto;
        margin-inline: auto;
        padding: 28px clamp(16px, 2.6vw, 36px) 56px;
        overflow: auto;
        container: dashboard / inline-size;
      }
      .devices-section { margin: 0 auto 24px; }
      .section-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      .section-heading h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -.01em; }
      .section-heading p { margin: 4px 0 0; color: var(--text-secondary); font-size: 14px; }
      .section-actions { display: flex; align-items: center; gap: 8px; }

      /* Buttons and focus */
      .button {
        display: inline-flex;
        min-height: var(--ha-button-height);
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 var(--ha-space-4);
        border: 1px solid transparent;
        border-radius: var(--ha-button-border-radius);
        background: transparent;
        color: var(--text);
        font-size: var(--ha-font-size-m);
        font-weight: var(--ha-font-weight-medium);
        white-space: nowrap;
        cursor: pointer;
        transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s ease;
      }
      .button:active { transform: translateY(1px); }
      .button .icon { width: 18px; height: 18px; }
      .button.primary { background: var(--ha-color-fill-primary-loud-resting); color: #fff; }
      .button.primary:hover { background: var(--ha-color-fill-primary-loud-hover); }
      .button.outline { border-color: var(--border-strong); background: var(--surface); }
      .button.outline:hover { border-color: var(--text-disabled); background: var(--surface-soft); }
      .button.quiet { color: var(--text-secondary); }
      .button.quiet:hover { background: var(--surface-muted); color: var(--text); }
      .button.active { border-color: transparent; background: var(--primary-soft); color: var(--primary-ink); }
      .button.active:hover { background: var(--primary-border); }
      .icon-button:focus-visible,
      .button:focus-visible,
      .device-card:focus-visible,
      .back-button:focus-visible,
      .panel-list-action:focus-visible,
      .panel-catalog-option:focus-visible,
      .device-more-trigger:focus-visible,
      .device-menu-item:focus-visible,
      .firmware-popover-close:focus-visible,
      .scroll-arrow:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* Device switcher */
      .device-scroll-wrap { position: relative; }
      .device-scroll {
        display: flex;
        gap: 14px;
        padding: 4px 4px 10px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: x mandatory;
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }
      .device-scroll::-webkit-scrollbar { height: 6px; }
      .device-scroll::-webkit-scrollbar-thumb { border-radius: var(--radius-pill); background: var(--border-strong); }
      .scroll-arrow {
        position: absolute;
        z-index: 2;
        top: calc(50% - 18px);
        display: grid;
        width: 36px;
        height: 36px;
        padding: 0;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        box-shadow: var(--shadow-1);
        color: var(--text);
        cursor: pointer;
        opacity: 0;
        transition: opacity .15s ease, background .15s ease;
      }
      .device-scroll-wrap:hover .scroll-arrow,
      .scroll-arrow:focus-visible { opacity: 1; }
      .scroll-arrow:hover { background: var(--surface-muted); }
      .scroll-arrow.left { left: -14px; }
      .scroll-arrow.right { right: -14px; }
      .scroll-arrow .icon { width: 17px; height: 17px; }
      .device-card {
        flex: 0 0 264px;
        min-width: 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: inherit;
        text-align: left;
        cursor: pointer;
        scroll-snap-align: start;
        transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      }
      .device-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); transform: translateY(-1px); }
      .device-card.selected { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
      .device-cover {
        position: relative;
        display: flex;
        height: 196px;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
        background: var(--screen);
      }
      .device-cover::after {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, .07);
        border-radius: inherit;
        content: "";
        pointer-events: none;
      }
      .device-cover img {
        display: block;
        width: auto;
        height: 100%;
        max-width: 100%;
        object-fit: contain;
        border-radius: 7px;
        background: #101010;
        box-shadow: 0 8px 22px rgba(0, 0, 0, .4);
      }
      .device-cover.portrait img { height: 100%; }
      .sort-cue {
        position: absolute;
        z-index: 1;
        top: 9px;
        left: 9px;
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 7px;
        background: rgba(0, 0, 0, .38);
        color: rgba(255, 255, 255, .72);
        cursor: grab;
        opacity: .7;
        transition: opacity .15s ease;
      }
      .device-card:hover .sort-cue { opacity: 1; }
      .sort-cue .icon { width: 14px; height: 14px; }
      .cover-update {
        position: absolute;
        right: 10px;
        bottom: 9px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: var(--radius-pill);
        background: var(--warn-soft);
        box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
        color: var(--warn);
        font-size: 11px;
        font-weight: 500;
      }
      .cover-update .icon { width: 14px; height: 14px; }
      .selected-mark {
        position: absolute;
        top: 9px;
        right: 9px;
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        transform: scale(.8);
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        opacity: 0;
        transition: opacity .15s ease, transform .15s ease;
      }
      .selected-mark .icon { width: 14px; height: 14px; stroke-width: 2.4; }
      .device-card.selected .selected-mark { transform: scale(1); opacity: 1; }
      .device-card-body { display: flex; flex-direction: column; gap: 5px; padding: 12px 14px 14px; }
      .device-card-title { display: flex; min-width: 0; align-items: center; gap: 7px; }
      .device-card-title strong { flex: 0 1 auto; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .device-card-title .tiny-chip { margin-left: auto; }
      .tiny-chip {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: var(--radius-pill);
        background: var(--surface-muted);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
      }
      .tiny-chip.attention { background: var(--warn-soft); color: var(--warn); }
      .status-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--text-disabled); }
      .status-dot.online { background: var(--good); }
      .status-dot.offline { background: var(--bad); }
      .status-dot.warning { background: var(--warn); }

      /* Compact switcher while a device is open */
      .shell.device-selected .devices-section { display: none; }
      .shell.device-selected .device-cover { height: 150px; padding: 18px; }
      .shell.device-selected .device-cover img { height: 100%; }
      .shell.device-selected .device-card { flex-basis: 224px; }
      .shell.device-selected .device-card-body { gap: 2px; padding: 10px 12px 12px; }

      /* Surfaces */
      .overview { display: flex; max-width: 100%; flex-direction: column; gap: 18px; margin: 0 auto; }
      .surface {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--ha-card-border-color);
        border-radius: var(--ha-card-border-radius);
        background: var(--ha-card-background);
        box-shadow: var(--ha-card-box-shadow);
      }
      .surface-heading {
        display: flex;
        min-height: 64px;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--divider);
      }
      .surface-heading h3 { margin: 0; font-size: 16px; font-weight: 500; }
      .surface-heading p { margin: 3px 0 0; color: var(--text-secondary); font-size: 13px; }
      .variant-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: var(--radius-pill);
        background: var(--surface-muted);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
      }
      .variant-badge .icon { width: 15px; height: 15px; }

      /* Fleet summary */
      .fleet-summary {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        border-color: transparent;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        box-shadow: var(--shadow-1);
        color: #fff;
      }
      .fleet-stats {
        display: flex;
        align-items: stretch;
      }
      .fleet-stat {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        align-items: center;
        gap: 10px;
        padding: 18px 22px;
      }
      .fleet-stat + .fleet-stat { border-left: 1px solid rgba(255, 255, 255, .22); }
      .fleet-stat-icon {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 12px;
        background: rgba(255, 255, 255, .16);
        color: #fff;
      }
      .fleet-stat-icon .icon { width: 24px; height: 24px; stroke-width: 2; }
      .fleet-stat-copy { display: flex; min-width: 0; flex-direction: column; gap: 2px; }
      .fleet-stat-label { color: rgba(255, 255, 255, .78); font-size: 12px; white-space: nowrap; }
      .fleet-stat-value { display: flex; align-items: baseline; gap: 6px; }
      .fleet-stat strong { font-size: 22px; font-weight: 500; line-height: 1; letter-spacing: -.02em; }
      .fleet-stat small { color: rgba(255, 255, 255, .78); font-size: 12px; white-space: nowrap; }
      .fleet-health {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-top: 1px solid rgba(255, 255, 255, .22);
      }
      .fleet-health-copy { display: flex; min-width: 0; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .fleet-health strong { font-size: 13px; font-weight: 600; }
      .fleet-health small { color: rgba(255, 255, 255, .78); font-size: 12px; }
      .fleet-dot {
        position: relative;
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 15%, transparent);
      }
      .fleet-dot::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px solid var(--good);
        animation: fleet-pulse 2.4s ease-out infinite;
      }
      @keyframes fleet-pulse {
        0% { transform: scale(.55); opacity: .7; }
        70%, 100% { transform: scale(1.7); opacity: 0; }
      }
      .presence-spark { display: flex; height: 26px; align-items: flex-end; gap: 3px; margin-left: 6px; }
      .presence-spark i { width: 4px; border-radius: 4px 4px 1px 1px; background: var(--primary-border); }

      /* All-devices layout */
      .d-overview-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .85fr); align-items: start; gap: 18px; }
      .d-device-table { display: flex; flex-direction: column; }
      .d-device-table-head,
      .d-device-entry {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 56px;
        align-items: center;
        gap: 0;
      }
      .d-device-table-head {
        padding: 10px 18px;
        border-bottom: 1px solid var(--divider);
        background: var(--surface-muted);
      }
      .d-device-columns,
      .d-device-row {
        display: grid;
        grid-template-columns: minmax(180px, 1.7fr) 112px 92px 88px;
        align-items: center;
        gap: 12px;
      }
      .d-device-table-head span {
        color: var(--text-secondary);
        font-size: var(--ha-font-size-s);
        font-weight: var(--ha-font-weight-medium);
        white-space: nowrap;
      }
      .d-update-column { text-align: right; }
      .d-device-entry {
        padding: 0 18px;
        border-bottom: 1px solid var(--divider);
        transition: background .13s ease;
      }
      .d-device-entry:last-child { border-bottom: 0; }
      .d-device-entry:hover { background: var(--surface-soft); }
      .d-device-row {
        width: 100%;
        min-height: 56px;
        padding: 10px 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .d-device-primary { display: flex; min-width: 0; align-items: center; gap: 10px; }
      .d-device-copy { display: flex; min-width: 0; flex-direction: column; gap: 2px; }
      .d-device-name { display: flex; min-width: 0; align-items: center; gap: 7px; }
      .d-device-name strong { overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .d-device-copy small { overflow: hidden; color: var(--text-secondary); font: 12px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
      .d-device-mobile-meta { display: none; color: var(--text-secondary); font-size: 12px; }
      .row-mono { color: var(--text-secondary); font: 13px var(--mono); white-space: nowrap; }
      .row-small { color: var(--text-secondary); font-size: 13px; white-space: nowrap; }
      .d-device-actions { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
      .device-more-trigger {
        display: grid;
        width: 32px;
        height: 32px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background .15s ease, color .15s ease;
      }
      .device-more-trigger:hover,
      .device-more-trigger[aria-expanded="true"] { background: var(--surface-muted); color: var(--text); }
      .device-more-trigger.update { color: var(--warn); }
      .device-more-trigger .icon { width: 15px; height: 15px; }

      /* Device actions menu */
      .device-menu-popover {
        position: fixed;
        z-index: 85;
        min-width: 180px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-2);
      }
      .device-menu-popover[hidden] { display: none; }
      .device-menu-popover:focus { outline: none; }

      /* Hover preview of a panel */
      .panel-preview-popover {
        position: fixed;
        z-index: 80;
        width: min(340px, calc(100vw - 24px));
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-2);
        pointer-events: none;
      }
      .panel-preview-popover[hidden] { display: none; }
      .panel-preview-screen { display: block; width: 100%; aspect-ratio: 450 / 320; overflow: hidden; border-radius: var(--radius-sm); background: var(--screen); }
      .panel-preview-screen.portrait { aspect-ratio: 320 / 480; }
      .panel-preview-screen img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .panel-preview-copy { display: flex; min-width: 0; flex-direction: column; gap: 2px; margin-top: 8px; }
      .panel-preview-copy strong { font-size: 13px; font-weight: 500; }
      .panel-preview-copy span { color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
      .device-menu-item {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .device-menu-item:hover { background: var(--surface-muted); }
      .device-menu-item.danger { color: var(--bad); }
      .device-menu-item .icon { width: 16px; height: 16px; }
      .device-menu-divider { height: 1px; margin: 5px 4px; background: var(--divider); }

      /* Activity */
      .activity-list { display: flex; flex-direction: column; }
      .activity-entry { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--divider); }
      .activity-entry:last-child { border-bottom: 0; }
      .activity-icon {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary-ink);
      }
      .activity-icon.good { background: var(--good-soft); color: var(--good); }
      .activity-icon.warn { background: var(--warn-soft); color: var(--warn); }
      .activity-icon.bad { background: var(--bad-soft); color: var(--bad); }
      .activity-icon .icon { width: 15px; height: 15px; }
      .activity-copy { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
      .activity-copy strong { font-size: 14px; font-weight: 400; }
      .activity-copy strong span { font-weight: 500; }
      .activity-copy small { color: var(--text-secondary); font-size: 12px; }

      /* Selected device */
      .b-selected-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .b-selected-identity { display: flex; min-width: 0; align-items: center; gap: 14px; }
      .back-button {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--text-secondary);
        cursor: pointer;
        transition: border-color .15s ease, color .15s ease, background .15s ease;
      }
      .back-button:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-ink); }
      .b-selected-copy { min-width: 0; }
      .b-selected-copy h2 { overflow: hidden; margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
      .b-selected-copy p { margin: 4px 0 0; color: var(--text-secondary); font-size: 14px; }
      .b-selected-header-actions { display: flex; align-items: center; gap: 8px; }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 12px;
        border-radius: var(--radius-pill);
        background: var(--surface-muted);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .status-pill.online { background: var(--good-soft); color: var(--good); }
      .status-pill.offline { background: var(--bad-soft); color: var(--bad); }
      .status-pill .status-dot { width: 7px; height: 7px; }
      .b-focus-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, .9fr); align-items: start; gap: 18px; }
      .b-side-stack { display: flex; min-width: 0; flex-direction: column; gap: 18px; }

      /* Panel workspace */
      .panel-workspace-toggle {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        background: var(--surface-muted);
      }
      .panel-workspace-toggle-option {
        display: inline-flex;
        height: 30px;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        border: 0;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background .15s ease, color .15s ease;
      }
      .panel-workspace-toggle-option:hover { color: var(--text); }
      .panel-workspace-toggle-option.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
      .panel-workspace-toggle-option:disabled { color: var(--text-disabled); cursor: not-allowed; opacity: .6; }
      .panel-workspace-toggle-option .icon { width: 15px; height: 15px; }
      .panel-workspace-count {
        display: inline-flex;
        min-width: 20px;
        height: 20px;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        border-radius: var(--radius-pill);
        background: var(--surface-soft);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
      }
      .panel-workspace-content { min-width: 0; }
      .panel-workspace { scroll-margin-top: 76px; }
      .panel-workspace > .surface-heading { min-height: 64px; justify-content: flex-end; padding: 14px 18px; }
      .panel-empty { padding: 48px 20px; color: var(--text-secondary); font-size: 14px; text-align: center; }
      .panel-workspace-actions { display: flex; width: 100%; flex: 0 0 auto; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
      .preview-controls-row { display: flex; min-width: 0; align-items: center; justify-content: flex-end; gap: 8px; margin-left: auto; }
      .preview-control-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
      .preview-tool-button {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }
      .preview-tool-button:hover { background: var(--surface-muted); color: var(--text); }
      .preview-tool-button.active { background: var(--primary-soft); color: var(--primary-ink); }
      .preview-tool-button:focus-visible,
      .preview-tools input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .preview-tool-button .icon { width: 16px; height: 16px; }
      .preview-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 18px;
        width: 100%;
        padding: 9px 2px 2px;
        border-top: 1px solid var(--divider);
      }
      .preview-entity-toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--text-secondary); font-size: 12px; cursor: pointer; }
      .preview-entity-toggle input { accent-color: var(--primary); }
      .sim-stage {
        position: relative;
        display: grid;
        min-height: 360px;
        place-items: center;
        padding: 40px;
        background: var(--screen);
        transition: background .2s ease;
      }
      .sim-stage.live { background: radial-gradient(ellipse at 50% 8%, #294b48 0, #1c3534 58%, #142624 100%); }
      .preview-live { border-color: var(--preview-live-border); background: var(--preview-live-surface); transition: background .2s ease, border-color .2s ease; }
      .preview-live > .surface-heading { border-color: var(--preview-live-heading-border); background: var(--preview-live-surface); }
      .preview-live .panel-workspace-content { background: var(--preview-live-surface); }
      .sim-frame {
        display: inline-flex;
        max-width: 100%;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border-radius: 12px;
        background: #17191e;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
      }
      .sim-screen { max-width: 100%; overflow: hidden; border-radius: 4px; }
      .sim-screen img { display: block; max-width: 100%; max-height: 380px; }
      .sim-frame.portrait .sim-screen img { max-height: 460px; }
      .sim-hw-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .sim-hw {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        height: 56px;
        padding: 12px 0 0;
        border: 1px solid #34383f;
        border-radius: 9px;
        background: #22252b;
        cursor: pointer;
      }
      .sim-hw:active { background: #292d34; }
      .sim-relay-light { width: 40px; height: 6px; border-radius: 999px; background: #20242a; box-shadow: inset 0 1px 2px #000a; }
      .action-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--divider); }
      .panel-preview-actions { padding: 14px 18px; }

      /* Panel list */
      .panel-view-groups { display: flex; flex-direction: column; }
      .panel-view-group { padding: 0; }
      /* The group row is a table header band: it carries its own rule and a
         background distinct from the row content below it. */
      .panel-view-group-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; border-bottom: 1px solid var(--divider); background: var(--surface-muted); }
      .panel-view-group-heading strong { font-size: 14px; font-weight: 600; }
      .panel-view-group-heading span { color: var(--text-secondary); font-size: 12px; }
      .panel-list-view { display: flex; min-height: 48px; flex-direction: column; }
      .panel-list-row {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) auto auto auto;
        align-items: center;
        gap: 14px;
        min-height: 56px;
        padding: 10px 18px;
        border-top: 1px solid var(--divider);
        cursor: pointer;
        transition: background .12s ease, opacity .15s ease;
      }
      .panel-list-row:first-child { border-top: 0; }
      .panel-list-row:last-child { border-bottom: 1px solid var(--divider); }
      .panel-list-row:hover { background: var(--surface-soft); }
      .panel-list-row > .sort-handle { width: 16px; height: 32px; }
      .panel-list-row > .sort-handle .icon { width: 16px; height: 16px; }
      .panel-list-main { display: flex; min-width: 0; align-items: center; }
      .panel-list-name { display: flex; min-width: 0; align-items: center; gap: 6px; }
      .panel-list-name strong { overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .panel-list-thumb {
        position: relative;
        display: block;
        width: 72px;
        height: 51px;
        flex: 0 0 auto;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--screen);
        cursor: zoom-in;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      .panel-list-thumb.portrait { width: 40px; height: 60px; }
      .panel-list-thumb:hover { border-color: var(--primary); box-shadow: var(--shadow-1); }
      .panel-list-thumb:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .panel-list-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
      /* Home/idle markers overlay the preview thumbnail's bottom-right corner:
         two fit side by side on the landscape thumb, and stack on the narrow
         portrait one, so the row keeps its text height and nothing overhangs. */
      .panel-thumb-roles {
        position: absolute;
        right: 2px;
        bottom: 2px;
        display: flex;
        gap: 2px;
        pointer-events: none;
      }
      .panel-list-thumb.portrait .panel-thumb-roles { flex-direction: column; }
      /* The portrait screen is only 40px wide: shrink the markers to match. */
      .panel-list-thumb.portrait .panel-thumb-role { width: 14px; height: 14px; }
      .panel-list-thumb.portrait .panel-thumb-role .icon { width: 9px; height: 9px; }
      .panel-thumb-role {
        display: grid;
        width: 16px;
        height: 16px;
        place-items: center;
        border-radius: 50%;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .55);
      }
      .panel-thumb-role.home { background: var(--primary); color: #ffffff; }
      .panel-thumb-role.idle { background: var(--warn); color: #14181c; }
      .panel-thumb-role .icon { width: 10px; height: 10px; stroke-width: 2.3; }
      .panel-list-meta { display: flex; min-width: 0; flex-wrap: wrap; align-items: center; gap: 5px; }
      .panel-list-key { color: var(--text-secondary); font: 12px var(--mono); white-space: nowrap; }
      .panel-list-count { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
      .panel-list-actions { display: flex; align-items: center; gap: 2px; }
      .panel-list-action {
        display: grid;
        width: 32px;
        height: 32px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background .15s ease, color .15s ease;
      }
      .panel-list-action:hover:not(:disabled) { background: var(--surface-muted); color: var(--text); }
      .panel-list-action:disabled { color: var(--text-disabled); cursor: default; opacity: .5; }
      .panel-list-action .icon { width: 15px; height: 15px; }
      .panel-dropzone { margin: 0 18px 12px; padding: 16px 12px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 12px; text-align: center; }
      .sort-handle { display: inline-flex; align-items: center; justify-content: center; color: var(--text-disabled); cursor: grab; }
      .sort-handle .icon { width: 14px; height: 14px; }
      .sort-dragging { opacity: .4; }
      .sort-over { outline: 2px dashed var(--primary); outline-offset: -3px; }

      /* Panel manager */
      .panel-management-card { display: flex; flex-direction: column; }
      .panel-manager-content { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
      .panel-manager-heading { min-height: 64px; padding: 14px 18px; }
      .panel-manager-heading-copy { min-width: 0; }
      .panel-manager-heading-copy p {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .panel-manager-add { width: 100%; justify-content: center; }
      .panel-manager-summary { display: flex; align-items: baseline; gap: 6px; color: var(--text-secondary); font-size: 13px; }
      .panel-manager-summary strong { color: var(--text); font-size: 15px; font-weight: 600; }
      .panel-manager-sep { color: var(--text-disabled); }
      .panel-manager-note { margin: 0; color: var(--text-secondary); font-size: 12px; line-height: 1.55; }
      .panel-role-card { display: flex; flex-direction: column; }
      .panel-role-list { display: flex; flex-direction: column; }
      .panel-role-row {
        display: grid;
        grid-template-columns: 36px minmax(80px, .7fr) minmax(150px, 1.3fr);
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-top: 1px solid var(--divider);
      }
      .panel-role-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; background: var(--primary-soft); color: var(--primary-ink); }
      .panel-role-icon .icon { width: 17px; height: 17px; }
      .panel-role-copy { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
      .panel-role-copy small { color: var(--text-secondary); font-size: 12px; }
      .panel-role-select { min-width: 0; height: 40px; padding: 0 10px; font-size: 13px; }

      /* Panel catalog */
      .panel-catalog-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
      .panel-catalog-option {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: border-color .15s ease, background .15s ease;
      }
      .panel-catalog-option:hover { border-color: var(--primary); background: var(--primary-soft); }
      .panel-catalog-screen { display: block; width: 100%; aspect-ratio: 450 / 320; overflow: hidden; border-radius: var(--radius-sm); background: var(--screen); }
      .panel-catalog-screen.portrait { aspect-ratio: 320 / 480; }
      .panel-catalog-screen img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .panel-catalog-heading { display: flex; min-width: 0; align-items: center; gap: 8px; padding: 0 2px; }
      .panel-catalog-heading strong { min-width: 0; overflow: hidden; font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .panel-catalog-icon { display: grid; width: 26px; height: 26px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: var(--primary-soft); color: var(--primary-ink); }
      .panel-catalog-icon .icon { width: 15px; height: 15px; }
      .panel-catalog-option:hover .panel-catalog-icon { background: var(--surface); }
      .panel-catalog-description { padding: 0 2px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; white-space: normal; }

      /* Panel editor */
      .panel-editor-preview { display: grid; place-items: center; }
      .panel-editor-preview img { display: block; max-width: 100%; max-height: 220px; object-fit: contain; }
      .panel-editor-item-summary { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px; padding: 14px; border-radius: var(--radius-sm); background: var(--surface-muted); }
      .panel-editor-item-summary strong { font-size: 22px; font-weight: 500; }
      .panel-editor-item-summary span { color: var(--text-secondary); font-size: 13px; }
      .panel-editor-item-summary p { grid-column: 1 / -1; margin: 0; color: var(--text-secondary); font-size: 12px; line-height: 1.55; }

      /* Device details */
      .device-status-heading { min-height: 64px; padding: 14px 18px; }
      .device-status-heading-copy { min-width: 0; }
      .device-status-heading-copy p {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .device-status-heading-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
      .device-configure-button {
        display: inline-flex;
        min-height: 32px;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: var(--radius-pill);
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition: background .15s ease, color .15s ease;
      }
      .device-configure-button:hover { background: var(--surface-muted); color: var(--text); }
      .device-configure-button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .device-configure-button .icon { width: 15px; height: 15px; }
      .device-status-card { container-type: inline-size; }

      /* Connection hero: state, recency and the availability reading */
      .connection-hero {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 14px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
      }
      .connection-hero.online {
        border-color: color-mix(in srgb, var(--good) 32%, transparent);
        background: var(--good-soft);
      }
      .connection-hero.offline {
        border-color: color-mix(in srgb, var(--bad) 32%, transparent);
        background: var(--bad-soft);
      }
      .connection-hero-icon {
        display: grid;
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--surface);
        color: var(--text-secondary);
      }
      .connection-hero.online .connection-hero-icon { color: var(--good); }
      .connection-hero.offline .connection-hero-icon { color: var(--bad); }
      .connection-hero-icon .icon { width: 19px; height: 19px; }
      .connection-hero-copy { display: flex; min-width: 0; flex-direction: column; }
      .connection-hero-copy strong { font-size: 15px; font-weight: 500; }
      .connection-hero-copy span {
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.35;
      }
      .connection-hero-gauge {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
        margin-left: auto;
      }
      .connection-hero-gauge strong { font-size: 15px; font-weight: 500; }
      .connection-hero-gauge small {
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: .05em;
        text-transform: uppercase;
      }

      /* Fact rows */
      .device-facts { display: flex; flex-direction: column; margin: 0; padding: 0 6px 6px; }
      .fact {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 12px;
        border-top: 1px solid var(--divider);
      }
      .fact:first-child { border-top: 0; }
      .fact dt {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 9px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .fact-icon {
        display: grid;
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        place-items: center;
        color: var(--ha-color-on-neutral-quiet);
      }
      .fact-icon .icon { width: 16px; height: 16px; }
      .fact dd {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        overflow: hidden;
        font-size: 13px;
        font-weight: 500;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fact dd.mono { font-family: var(--mono); font-size: 12px; }
      .fact.stale dt,
      .fact.stale dd { color: var(--text-disabled); }
      .version-current { color: var(--text-secondary); font-family: var(--mono); font-size: 12px; }
      .version-arrow { color: var(--text-disabled); }
      .version-target { color: var(--warn); font-family: var(--mono); font-size: 12px; }

      /* Update call to action */
      .device-status-update {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border: 0;
        border-top: 1px solid var(--divider);
        background: var(--warn-soft);
        color: var(--warn);
        text-align: left;
        cursor: pointer;
        transition: filter .15s ease;
      }
      .device-status-update:hover { filter: brightness(.97); }
      .device-status-update-icon {
        display: grid;
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--surface);
      }
      .device-status-update-icon .icon { width: 14px; height: 14px; }
      .device-status-update-copy { display: flex; min-width: 0; flex-direction: column; }
      .device-status-update-copy strong { font-size: 13px; font-weight: 500; }
      .device-status-update-copy small {
        overflow: hidden;
        opacity: .75;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .device-status-update-action {
        display: inline-flex;
        align-items: center;
        gap: 1px;
        margin-left: auto;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .device-status-update-action .icon { width: 14px; height: 14px; }

      /* Device configuration file */
      .yaml-card-body { display: flex; flex-direction: column; gap: 12px; padding: 14px 18px 16px; }
      .yaml-card-note { margin: 0; color: var(--text-secondary); font-size: 12px; line-height: 1.55; }
      .yaml-card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .yaml-card-actions .button { flex: 1 1 120px; }
      .yaml-card-actions .icon { width: 16px; height: 16px; }

      /* Sidebar */
      .config-panel {
        position: fixed;
        z-index: 35;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        width: 380px;
        max-width: 100vw;
        flex-direction: column;
        overflow: hidden;
        transform: translateX(102%);
        border-left: 1px solid var(--border);
        background: var(--surface);
        box-shadow: -10px 0 40px rgba(0, 0, 0, .16);
        transition: transform .24s cubic-bezier(.2, 0, 0, 1);
      }
      .shell.sidebar-open .config-panel { transform: translateX(0); }
      .config-panel:focus { outline: none; }
      .sidebar-inner { display: flex; width: 100%; height: 100%; min-height: 0; flex-direction: column; }
      .sidebar-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 16px; border-bottom: 1px solid var(--divider); }
      .sidebar-heading h2 { margin: 0; font-size: 20px; font-weight: 500; }
      .sidebar-heading p { margin: 4px 0 0; color: var(--text-secondary); font-size: 13px; }
      .sidebar-body { display: flex; flex: 1; flex-direction: column; gap: 24px; padding: 20px; overflow: auto; }
      .form-section { display: flex; flex-direction: column; gap: 12px; }
      .form-section h3 { margin: 0; font-size: 14px; font-weight: 600; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field-label { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; }
      .field-hint { color: var(--text-secondary); font-size: 12px; font-weight: 400; }
      .input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        outline: none;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      .input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 154, 199, .2); }
      .input:disabled { color: var(--text-secondary); background: var(--surface-soft); }
      .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .switch-copy { display: flex; flex-direction: column; gap: 2px; }
      .switch {
        position: relative;
        width: 48px;
        height: 24px;
        flex: 0 0 auto;
        appearance: none;
        border: 0;
        border-radius: var(--radius-pill);
        background: var(--surface-strong);
        cursor: pointer;
        transition: background .15s ease;
      }
      .switch::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--ha-box-shadow-s);
        content: "";
        transition: transform .15s ease;
      }
      .switch:checked { background: var(--primary); }
      .switch:checked::after { transform: translateX(24px); }
      .range { width: 100%; accent-color: var(--primary); }
      .sidebar-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--divider); background: var(--surface); }
      .sidebar-footer[hidden] { display: none; }
      .scrim {
        position: fixed;
        z-index: 30;
        inset: 0;
        display: block;
        padding: 0;
        border: 0;
        background: rgba(0, 0, 0, .4);
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s ease;
      }
      .shell.sidebar-open .scrim { opacity: 1; pointer-events: auto; }

      /* Firmware popover */
      .firmware-popover {
        position: fixed;
        z-index: 85;
        width: min(320px, calc(100vw - 24px));
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-2);
      }
      .firmware-popover[hidden] { display: none; }
      .firmware-popover:focus { outline: none; }
      .firmware-popover-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .firmware-popover-heading h3 { margin: 0; font-size: 16px; font-weight: 500; }
      .firmware-popover-heading p { margin: 4px 0 0; color: var(--text-secondary); font-size: 12px; }
      .firmware-popover-close {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .firmware-popover-close:hover { background: var(--surface-muted); color: var(--text); }
      .firmware-popover-close .icon { width: 16px; height: 16px; }
      .firmware-release-list { display: flex; flex-direction: column; margin: 14px 0 12px; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; }
      .firmware-release-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--divider); }
      .firmware-release-row:last-child { border-bottom: 0; }
      .firmware-release-row > span:first-child { color: var(--text-secondary); font-size: 13px; }
      .firmware-release-version { display: flex; align-items: center; gap: 5px; font: 12px var(--mono); }
      .firmware-release-version small { color: var(--primary-ink); font: 11px var(--mono); }
      .firmware-popover-state { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; }
      .firmware-popover-state.available { color: var(--warn); }
      .firmware-popover-state .status-dot { width: 7px; height: 7px; }
      .firmware-popover-note { margin: 6px 0 16px; color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
      .firmware-popover .button { width: 100%; }

      /* Toast */
      .toast {
        position: fixed;
        z-index: 100;
        bottom: 24px;
        left: 50%;
        max-width: calc(100vw - 32px);
        padding: 12px 18px;
        transform: translate(-50%, 9px);
        border-radius: var(--radius-sm);
        background: #202020;
        box-shadow: var(--shadow-2);
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s ease, transform .18s ease;
      }
      .toast.show { transform: translate(-50%, 0); opacity: 1; }

      /* Responsive */
      @container dashboard (max-width: 1120px) {
        .d-device-columns,
        .d-device-row { grid-template-columns: minmax(160px, 1.7fr) 92px 88px; }
        .d-device-table-head .d-col-ip,
        .d-device-row .d-col-ip { display: none; }
        .d-device-table-head,
        .d-device-entry { grid-template-columns: minmax(0, 1fr) 56px; }
      }
      @container dashboard (max-width: 1100px) {
        .fleet-stat { padding: 15px 16px; }
        .fleet-health { padding: 12px 16px; }
        .fleet-stat-icon { width: 38px; height: 38px; }
        .fleet-stat-icon .icon { width: 20px; height: 20px; }
        .presence-spark { display: none; }
      }
      @container dashboard (max-width: 980px) {
        .d-overview-grid { grid-template-columns: 1fr; }
        .b-focus-grid { grid-template-columns: 1fr; }
        .b-side-stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
      }
      @container dashboard (max-width: 720px) {
        .content { padding: 20px 16px 40px; }
        .section-heading { align-items: flex-start; }
        .section-actions { flex-wrap: wrap; justify-content: flex-end; }
        .device-card { flex-basis: 232px; }
        .device-cover { height: 176px; }
        .shell.device-selected .device-card { flex-basis: 206px; }
        .shell.device-selected .device-cover { height: 136px; }
        .fleet-stat { padding: 10px 12px; }
        .b-selected-head { align-items: flex-start; flex-direction: column; }
        .b-selected-header-actions { width: 100%; }
        .b-side-stack { display: flex; align-items: stretch; }
        .panel-workspace > .surface-heading { align-items: center; flex-wrap: nowrap; }
        .panel-view-group-heading span { display: none; }
        .sim-stage { min-height: 240px; padding: 24px; }
        .sim-screen img { max-height: 300px; }
        .sim-frame.portrait .sim-screen img { max-height: 380px; }
        .d-device-table-head { display: none; }
        .d-device-entry { grid-template-columns: minmax(0, 1fr) auto; padding: 0 12px; }
        .d-device-row { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 10px 0; }
        .d-device-row .d-col-ip,
        .d-device-row .d-col-firmware,
        .d-device-row .d-col-display { display: none; }
        .d-device-copy small { display: none; }
        .d-device-mobile-meta { display: block; overflow-wrap: anywhere; }
        .d-device-actions { gap: 2px; }
        .panel-list-row { grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 8px; padding: 8px 12px; }
        .panel-list-row > .sort-handle { grid-column: 1; }
        .panel-list-main { grid-column: 2; }
        .panel-list-key { grid-column: 3; font-size: 11px; }
        .panel-list-meta { display: none; }
        .panel-list-actions { grid-column: 4; }
        .panel-list-action { width: 28px; height: 28px; }
        .panel-list-action .icon { width: 14px; height: 14px; }
        .panel-role-row { grid-template-columns: 36px minmax(0, 1fr); }
        .panel-role-select { grid-column: 1 / -1; }
        .fact { padding: 8px 10px; }
        .sidebar-footer { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      }
      @container dashboard (max-width: 600px) {
        .fleet-stats { flex-wrap: wrap; }
        .fleet-stat,
        .fleet-stat + .fleet-stat { flex: 1 1 100%; border-left: 0; border-top: 1px solid var(--divider); }
        .fleet-stat:first-child { border-top: 0; }
      }
      @media (max-width: 600px) {
        .titlebar { gap: 8px; padding: 0 12px; }
        .brand-name { font-size: 15px; }
        .brand-divider, .brand-section, .prototype-tag { display: none; }
        .section-heading { flex-direction: column; }
        .section-actions { width: 100%; justify-content: flex-end; }
        .section-actions .button { min-height: 36px; padding: 0 14px; }
        .device-card { flex-basis: 220px; }
        .device-cover { height: 168px; }
        .shell.device-selected .device-card { flex-basis: 196px; }
        .shell.device-selected .device-cover { height: 128px; }
        .device-more-trigger { width: 28px; height: 28px; }
        .device-more-trigger .icon { width: 14px; height: 14px; }
        .panel-catalog-grid { grid-template-columns: 1fr; }
        .firmware-popover {
          left: 12px !important;
          right: 12px;
          top: auto !important;
          bottom: max(12px, env(safe-area-inset-bottom));
          width: auto;
          max-height: calc(100dvh - 24px);
          overflow: auto;
        }
        .toast { bottom: max(12px, env(safe-area-inset-bottom)); white-space: nowrap; }
      }
      @media (max-width: 900px) {
        .config-panel { width: min(400px, 100vw); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }

      /* Dark theme, following Home Assistant's dark palette */
      @media (prefers-color-scheme: dark) {

          --ha-color-fill-primary-quiet-resting: var(--ha-color-primary-05);

          --ha-color-fill-neutral-normal-resting: var(--ha-color-neutral-10);
          --ha-color-fill-neutral-normal-hover: var(--ha-color-neutral-20);
          --ha-color-on-primary-quiet: var(--ha-color-primary-70);
          --ha-color-on-primary-normal: var(--ha-color-primary-60);

          --ha-color-on-success-normal: var(--ha-color-green-70);

          --primary-background-color: #111111;
          --secondary-background-color: var(--ha-color-neutral-20);
          --divider-color: var(--ha-color-neutral-20);
          --error-color: var(--ha-color-red-70);
          --warning-color: var(--ha-color-orange-70);
          --success-color: var(--ha-color-green-70);
          --info-color: var(--ha-color-primary-60);
          --app-header-background-color: var(--ha-color-surface-default);

          --primary-soft: var(--ha-color-primary-10);
          --primary-ink: var(--ha-color-primary-70);
          --preview-live-surface: #10231f;
          --preview-live-border: #2d4f48;
          --preview-live-heading-border: #1e3a34;
        }
        .button.outline { background: transparent; }
        .button.outline:hover { background: var(--surface-muted); }
        .toast { background: #f5f5f5; color: #141414; }
      }
    </style>
  </head>
