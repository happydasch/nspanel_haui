# Config Variables
substitutions:

  # Heartbeat interval in seconds
  heartbeat_interval: '5'
  # Friendly name of the device
  friendly_name: 'NSPanel HAUI'
  # Name of the device (used as ESPHome device name and hostname)
  name: nspanel-haui  # this name is also used for hostname


  # Accounts and Passwords
  ota_password: !secret ota_password
  api_encryption_key: !secret api_encryption_key
  # The ESPHome web server is optional and disabled by default (see
  # nspanel_haui/base.yaml). To enable it, uncomment the web_server block at
  # the end of this file and set its credentials.
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password: !secret ap_password

  # Custom Update Urls (landscape and portrait TFT)
  tft_update_url: https://github.com/happydasch/nspanel_haui/raw/master/nextion/nspanel_haui.tft
  tft_update_url_portrait: https://github.com/happydasch/nspanel_haui/raw/master/nextion/nspanel_haui_portrait.tft

packages:
  remote_package:
    url: https://github.com/happydasch/nspanel_haui
    ref: master
    files:
      - esphome/nspanel_haui.yaml
# Optional: ESPHome web server (disabled by default, see base.yaml).
# Uncomment to serve the web UI on port 80. Home Assistant then shows a
# "Visit" link for the device. Use your own values or !secret entries.
#
# web_server:
#   port: 80
#   auth:
#     username: admin
#     password: !secret web_password

