#
# Configuration for NSPanel HomeAssistant UI
#

# The substituions will be defined in the install.yaml.
# this file should not be directly edited.

substitutions:
  # General config
  heartbeat_interval: $heartbeat_interval
  friendly_name: $friendly_name
  name: $name
  # Accounts and Passwords
  ota_password: $ota_password
  api_encryption_key: $api_encryption_key
  # No web credentials: the web server is optional and disabled by default
  # (see base.yaml). Add a web_server block to your own YAML to enable it.
  wifi_ssid: $wifi_ssid
  wifi_password: $wifi_password
  ap_password: $ap_password
  # Default TFT URL of the display component (enables TFT upload support);
  # the hub's TFT update always sends the URL of the TFT it installs
  tft_update_url: $tft_update_url

# Temporary: the numeric-response delivery fix for the stock `nextion`
# component (esphome/esphome#17744) merged two days after the 2026.10.0
# release tag was cut, so no released ESPHome contains it.  Without it every
# display read logs "Numeric return but '...' invalid type 0" and the value
# is dropped.  This overrides the stock component with the patched copy
# vendored in this repo (esphome/nextion_patch/), which is the 2026.10.0
# component plus the cherry-picked fix and the TFT upload TX buffer option
# (#21435) and therefore compiles against ESPHome 2026.10.0.  Remove this
# whole block AND esphome/nextion_patch/ once a released ESPHome contains
# #17744 and #21435 (expected in 2026.11.0), and bump min_version
# in base.yaml together with it.  `ref` stays `dev` for the whole bridge: dev
# carries the patch dir first, and the file disappears from both branches in
# the same cleanup, so master users on this package keep working until then.
external_components:
  - source:
      type: git
      url: https://github.com/happydasch/nspanel_haui
      ref: dev
      path: esphome/nextion_patch
    components: [nextion]

packages:
  version: !include nspanel_haui/version.yaml
  globals: !include nspanel_haui/globals.yaml
  base: !include nspanel_haui/base.yaml
  hardware: !include nspanel_haui/hardware.yaml
  display: !include nspanel_haui/display.yaml
  interval: !include nspanel_haui/interval.yaml
  scripts_common: !include nspanel_haui/scripts_common.yaml
  scripts_connection: !include nspanel_haui/scripts_connection.yaml
  scripts_interaction: !include nspanel_haui/scripts_interaction.yaml
  scripts_display: !include nspanel_haui/scripts_display.yaml
  scripts_event: !include nspanel_haui/scripts_event.yaml
  api: !include nspanel_haui/api.yaml
  button: !include nspanel_haui/button.yaml
  number: !include nspanel_haui/number.yaml
  switch: !include nspanel_haui/switch.yaml
  sensor: !include nspanel_haui/sensor.yaml
  # debug: !include nspanel_haui/debug.yaml
