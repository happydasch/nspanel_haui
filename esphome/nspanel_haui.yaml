# NSPanel HAUI package. Substitutions come from install.yaml; edit that file,
# not this one.

substitutions:
  # General config
  heartbeat_interval: $heartbeat_interval
  friendly_name: $friendly_name
  name: $name
  # Accounts and Passwords
  # The API key also encrypts native OTA uploads (base.yaml)
  api_encryption_key: $api_encryption_key
  # No web credentials: the web server is optional and disabled by default
  # (see base.yaml). Add a web_server block to your own YAML to enable it.
  wifi_ssid: $wifi_ssid
  wifi_password: $wifi_password
  ap_password: $ap_password
  # Build identity in the device state; the hub only updates a panel whose
  # firmware reports the matching variant. The universal image reports
  # `universal`, every custom build `custom`.
  firmware_variant: 'custom'

  # Display default only; the hub sends the URL of the TFT it installs
  tft_update_url: https://github.com/happydasch/nspanel_haui/raw/master/nextion/nspanel_haui.tft

# Vendored nextion override for installed setups (git source); remove it once
# every fix in nextion_patch/README.md ships in a released ESPHome. Track this
# repo's dev branch without caching.
external_components:
  - source:
      type: git
      url: https://github.com/happydasch/nspanel_haui
      ref: dev
      path: esphome/nextion_patch
    components: [nextion]
    refresh: 0s

packages:
  haui: !include nspanel_haui/packages.yaml
