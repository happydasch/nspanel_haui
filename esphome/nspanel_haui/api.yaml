---
# API Configuration
api:

  # Also encrypts native OTA uploads (base.yaml)
  encryption:
    key: $api_encryption_key

  # Native API client connected (Home Assistant)
  on_client_connected:
    then:
      - lambda: |-
          id(hub_availability) = true;
      - delay: 500ms
      - script.execute: publish_connection_request

  # The callback fires after the client is removed, so is_connected() is false
  # only when the last client is gone. Reset hub_availability then; otherwise
  # the hub-unavailable branches in check_connection/check_hub_connection never
  # run.
  on_client_disconnected:
    then:
      - lambda: |-
          id(hub_availability) = global_api_server->is_connected();
      - script.execute:
          id: set_hub_connected
          connected: 0
          force: 0

  # Available actions
  actions:

    # Install the TFT at ``url``. Prefer the hub's "HAUI Display" entity or
    # nspanel_haui.update_tft, which track the install. The upload blocks the
    # main loop for the whole transfer, so active activities are suspended first.
    - action: upload_tft_url
      variables:
        url: string
      then:
        - lambda: id(prepare_tft_upload).execute(url);

    # Install the app image at ``url`` (nspanel_haui_ota.bin, not the factory
    # image); ``md5sum`` is its checksum (``md5`` is ESPHome's component).
    # Prefer the hub's "HAUI Firmware" entity or nspanel_haui.update_firmware,
    # which track the install.
    - action: install_firmware_url
      variables:
        url: string
        md5sum: string
      then:
        - script.execute: suspend_activities
        - ota.http_request.flash:
            url: !lambda return url;
            md5: !lambda return md5sum;

    # Stream one slice of a draw program: runs as ``x,y,w,h,colour`` in base 36,
    # joined with ';' (see image.yaml and haui/utils/draw_wire.py). Several of
    # these make one image; each is reported back as ``res_draw``, which is what
    # releases the next one. This is what puts an image on the panel; the hub's
    # nspanel_haui.show_image rasterises and slices it.
    - action: draw_runs
      variables:
        program: string
      then:
        # A bare `program: program` is not the variable: ESPHome compiles the
        # value as a literal, so the display was sent the word "program", queued
        # one bogus command and reported a successful draw of one run. The other
        # actions below pass every string variable the same way.
        - script.execute:
            id: haui_draw_runs
            program: !lambda 'return program;'

    # Batch: send every command, then flush once
    - action: send_commands
      variables:
        commands: string[]
      then:
        - lambda: |-
            for (auto& cmd : commands) {
              id(haui_disp).send_command(cmd.c_str());
            }
            id(haui_disp).update();

    # HA answers req_connection; the device replies with res_connection
    - action: hub_connection_response
      variables:
        version: string  # hub version; accepted but not used
      then:
        - script.execute: publish_connection_response

    # Handshake complete
    - action: hub_connection_initialized
      then:
        - script.execute:
            id: set_hub_connected
            connected: 1
            force: 0
      # set_hub_connected(1) already sets hub_connection; do not set it here too.

    # Hub closed the connection
    - action: hub_connection_closed
      then:
        - script.execute:
            id: set_hub_connected
            connected: 0
            force: 1

    # HA requests device state
    - action: req_device_state
      then:
        - script.execute: publish_device_state

    # Send one command to the display
    - action: send_command
      variables:
        cmd: string
      then:
        - lambda: |-
            id(haui_disp).send_command(cmd.c_str());

    # intensity: 0-100
    - action: set_brightness
      variables:
        intensity: int
      then:
        - lambda: id(set_brightness).execute(intensity);

    # Open a display page
    - action: goto_page
      variables:
        page: string
      then:
        - script.execute:
            id: goto_page
            page: !lambda 'return page;'

    # Explicit hardware sleep; the automatic state machine never sleeps the panel
    - action: display_off
      then:
        - script.execute: display_off

    # Wake the display from hardware sleep
    - action: display_on
      then:
        - script.execute: display_on

    # Reset the device's heartbeat timeout clock
    - action: hub_heartbeat
      then:
        - lambda: |-
            id(hub_heartbeat) = millis() / 1000;

    # Read a number value; answered with read_response
    - action: req_val
      variables:
        name: string
      then:
        - script.execute:
            id: request_number
            component: !lambda 'return name;'

    # Read a text value; answered with read_response
    - action: req_txt
      variables:
        name: string
      then:
        - script.execute:
            id: request_text
            component: !lambda 'return name;'

    # Play any RTTTL string (https://picaxe.com/rtttl-ringtones-for-tune-command/)
    - action: play_rtttl
      variables:
        song_str: string
      then:
        - lambda: id(play_rtttl).execute(song_str);

    # Play a built-in sound (see play_sound in scripts_common.yaml)
    - action: play_sound
      variables:
        name: string
      then:
        - lambda: id(play_sound).execute(name);

    # offset: seconds to rewind the interaction clock
    - action: reset_last_interaction
      variables:
        offset: int
      then:
        - lambda: id(reset_interaction_timer).execute(offset);

    # Every parameter is required by this action (the HA service and notify
    # entities expose them as optional): "" for no icon/colour, "none" for
    # silence, false and "auto" for the defaults. There is no severity field;
    # the hub opens persistent notifications immediately and loops their sound.
    - action: send_notification
      variables:
        title: string
        message: string
        icon: string
        # true = loop the alert sound until dismissed
        persistent: bool
        # "auto" or a font size 1-3
        text_size: string
        # "#rrggbb" or an RGB565 number; empty = theme text colour
        icon_color: string
        # play_sound name; empty or "none" = silent
        sound: string
      then:
        - lambda: |-
            id(send_notification).execute(
              title, message, icon, persistent, text_size, icon_color, sound
            );
