---
# API Configuration
api:

  # API Password for HA
  encryption:
    key: $api_encryption_key

  # When native API client connects (HA)
  on_client_connected:
    then:
      - lambda: |-
          id(hub_availability) = true;
      - delay: 500ms
      - script.execute: publish_connection_request

  # When native API client disconnects (HA)
  # on_client_disconnected fires after the client is removed, so
  # is_connected() is false only when the last client is gone. Reset
  # hub_availability then, otherwise the hub-unavailable branches in
  # check_connection / check_hub_connection never run.
  on_client_disconnected:
    then:
      - lambda: |-
          id(hub_availability) = global_api_server->is_connected();
      - script.execute:
          id: set_hub_connected
          connected: 0
          force: 0

  # Available actions
  actions:

    # Install the TFT file at ``url``.  The hub's TFT update (the "HAUI
    # Display" update entity and the nspanel_haui.update_tft action) sends
    # it; call those instead, they track the install.
    # ``prepare_tft_upload`` suspends active device activities first (see
    # ``suspend_activities``): upload_tft() blocks the main loop for the whole
    # transfer, so a playing rtttl tune would sound until the reboot.
    - action: upload_tft_url
      variables:
        url: string
      then:
        - lambda: id(prepare_tft_upload).execute(url);

    # Batch send_commands - receives string array, sends each to display
    - action: send_commands
      variables:
        commands: string[]
      then:
        - lambda: |-
            for (auto& cmd : commands) {
              id(haui_disp).send_command(cmd.c_str());
            }
            id(haui_disp).update();

    # Connection handshake - called by HA when it receives req_connection event
    - action: hub_connection_response
      variables:
        version: string
      then:
        - script.execute: publish_connection_response

    # HA acknowledges initialization complete
    - action: hub_connection_initialized
      then:
        - script.execute:
            id: set_hub_connected
            connected: 1
            force: 0
      # NOTE: set_hub_connected(1) already updates hub_connection internally.
      # Do NOT add an extra lambda setting id(hub_connection)=true here.

    # HA closes connection
    - action: hub_connection_closed
      then:
        - script.execute:
            id: set_hub_connected
            connected: 0
            force: 0

    # HA requests device info
    - action: req_device_info
      then:
        - script.execute: publish_device_info

    # HA requests device state
    - action: req_device_state
      then:
        - script.execute: publish_device_state

    # Action to send a command
    # This will send a command to the nextion display
    - action: send_command
      variables:
        cmd: string
      then:
        - lambda: |-
            id(haui_disp).send_command(cmd.c_str());

    # Action to change the brightness of the display
    - action: set_brightness
      variables:
        intensity: int
      then:
        - lambda: id(set_brightness).execute(intensity);

    # Action to change the page of the display
    - action: goto_page
      variables:
        page: string
      then:
        - script.execute:
            id: goto_page
            page: !lambda 'return page;'

    # Action to put the display into hardware sleep (no-hub path only)
    - action: display_off
      then:
        - script.execute: display_off

    # Action to wake the display out of hardware sleep
    - action: display_on
      then:
        - script.execute: display_on

    # HA heartbeat - resets heartbeat timer on device
    - action: hub_heartbeat
      then:
        - lambda: |-
            id(hub_heartbeat) = millis() / 1000;

    # Reconnect request from HA
    - action: req_reconnect
      then:
        - script.execute:
            id: set_hub_connected
            connected: 0
            force: 0

    # Request a number value
    - action: req_val
      variables:
        name: string
      then:
        - script.execute:
            id: request_number
            component: !lambda 'return name;'

    # Request a text value
    - action: req_txt
      variables:
        name: string
      then:
        - script.execute:
            id: request_text
            component: !lambda 'return name;'

    # Action to play a song for RTTTL strings
    - action: play_rtttl
      variables:
        # see https://picaxe.com/rtttl-ringtones-for-tune-command/
        song_str: string
      then:
        - lambda: id(play_rtttl).execute(song_str);

    # Action to play a named sound
    - action: play_sound
      variables:
        name: string
      then:
        - lambda: id(play_sound).execute(name);

    # Action to reset the last interaction value
    - action: reset_last_interaction
      variables:
        offset: int
      then:
        - lambda: id(update_last_interaction).execute(-1, offset);
    # Action to support device discovery - returns device identity metadata
    - action: haui_discover
      then:
        - script.execute: publish_haui_discover


    # Action to send a notification
    # ``persistent`` and ``text_size`` are optional; omitted values fall back
    # to false / "" (the client applies the defaults).
    - action: send_notification
      variables:
        title: string
        message: string
        icon: string
        # True loops the alert sound until dismissed.
        persistent: bool
        # "auto" or a font size 1-3.
        text_size: string
      then:
        - lambda: |-
            id(send_notification).execute(
              title, message, icon, persistent, text_size
            );
