---
substitutions:
  log_level: INFO


# ESP Configuration
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      # The NSPanel's flash runs on ESP-IDF's generic driver; dropping the unused
      # vendor drivers frees their IRAM.
      flash_chip: generic


# ESPHome Configuration
esphome:
  # 2026.11.0 is the API baseline; the vendored nextion patch adds only the TFT
  # upload retry fix. See esphome/nextion_patch/README.md for the removal
  # condition; bump this and requirements-esphome.txt together.
  min_version: 2026.11.0
  # Component phase every 2 ms (ESPHome's default is 16 ms). The Nextion pacer
  # leaves at most one command per component phase, so the loop interval *is*
  # the display's command spacing: at 16 ms opening a panel (112-156 commands)
  # took 1.8-2.5 s and a paging step 0.4-0.5 s. Keep this at or below
  # ``command_spacing`` in display.yaml — a faster loop alone does not raise the
  # command rate, a slower one silently lowers it.
  loop_interval: 2ms
  name: $name
  friendly_name: $friendly_name
  project:
    name: happydasch.nspanel_haui
    version: $yaml_version
  # A reboot resets only the CPUs, not the LEDC peripheral, so a note playing
  # at that moment keeps sounding through the boot (see ``suspend_activities``).
  on_shutdown:
    - script.execute: suspend_activities

# JSON Configuration
# Required for json::build_json() in the event scripts.
json:


# Logger Configuration
logger:
  # DEBUG or VERBOSE for troubleshooting; INFO or NONE otherwise.
  level: $log_level


# HTTP client for the HTTP OTA platform, which downloads the image the hub names
# (``install_firmware_url``), usually from GitHub. GitHub sends ~5.4 KB of
# redirect headers, and the signed target URL overflows the 512-byte default TX
# buffer, so both default buffers are too small.
http_request:
  id: haui_http
  useragent: nspanel-haui
  timeout: 10s
  buffer_size_rx: 8192
  buffer_size_tx: 2048


# OTA Configuration
# Native OTA for dashboard/manual flashing plus HTTP OTA so the device can pull
# the image the hub names. Native OTA is encrypted with the API key (a bare
# ``encryption:`` inherits ``api_encryption_key``) because a password wastes
# flash and RAM. Both transfers block the main loop, so active activities are
# suspended first. The hub's "HAUI Firmware" entity owns firmware updates.
# Password-build migration: docs/develop/esphome.md, "Encrypted native OTA".
ota:
  - platform: esphome
    encryption:
    on_begin:
      - script.execute: suspend_activities
  - platform: http_request
    on_begin:
      - script.execute: suspend_activities


# WIFI Configuration
wifi:
  # use_address helps when the device name is changed or does not resolve
  #use_address: nspanel.local
  ssid: $wifi_ssid
  password: $wifi_password
  power_save_mode: none
  # Open fallback AP (captive portal) when the configured network is unreachable
  ap:
    ssid: $name
    password: $ap_password


# Captive Portal
captive_portal:


# Web server — optional, disabled by default: it costs flash and RAM that the
# HTTP OTA path (TLS, JSON, http_request) needs. Home Assistant shows a "Visit"
# link only for firmware that runs it.
#
# Enable it in YOUR device YAML (the file that includes `nspanel_haui.yaml` as a
# package), not in a package file:
#
#   web_server:
#     port: 80
#     auth:
#       username: admin
#       password: !secret web_password
#
# See docs/develop/esphome.md → "Web server (optional)".
