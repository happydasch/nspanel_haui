debug:
  update_interval: 30s          # log free heap and loop time every 30 s

sensor:
  - platform: uptime
    name: Uptime
    id: uptime_sensor

  - platform: debug
    free:
      name: "Heap Free"         # falling trend = leak
    block:
      name: "Heap Max Block"    # largest contiguous block = fragmentation
    loop_time:
      name: "Loop Time"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"      # why the panel last rebooted
