# Display
display:

  - platform: nextion
    uart_id: haui_uart
    id: haui_disp
    # Only for an explicit hardware sleep; the display state machine never sleeps
    wake_up_page: 0
    # Bound the queue: 800 entries absorb a full config+render burst plus
    # concurrent updates without drops, and an RX overflow cannot pile up
    # orphaned entries and fragment the heap.
    max_queue_size: 800
    # How many queued commands one component phase may transmit. With the pacer
    # in force this never binds (it allows one per phase); it is what bounds a
    # phase while a draw runs unpaced (``draw_spacing`` in image.yaml), where
    # it matches ``draw_window`` so a phase writes at most that many fills -
    # about 300 bytes, inside the display's 1 KB receive buffer. It also bounds
    # how many replies the firmware parses from the display per loop.
    max_commands_per_loop: 12
    # One command per component phase keeps bursts from overrunning the
    # display's 1 KB RX buffer; ``loop_interval`` in base.yaml is the pace this
    # turns into (2 ms per command), so the two belong together. A draw sets
    # this to 0 for its duration and restores it when the program ends.
    command_spacing: ${command_spacing_ms}ms
    # Compile-time fallback only; the hub passes the URL of the TFT it installs
    # (upload_tft_url → prepare_tft_upload → set_tft_url()).
    tft_url: $tft_update_url
    # GitHub redirects release TFTs to a signed URL of ~870 characters; the
    # request line overflows the 512-byte default TX buffer (esphome/esphome#21435).
    tft_upload_http_buffer_size_tx: 2048

    on_setup:
      then:
        # Re-publish the restored brightness values, then apply full brightness
        # to the backlight; this clears the NaN guard in update_display.
        - number.set:
            id: brightness_full
            value: !lambda return int(id(brightness_full).state);
        - number.set:
            id: brightness_dim
            value: !lambda return int(id(brightness_dim).state);
        - script.execute:
            id: set_brightness
            intensity: !lambda return int(id(brightness_full).state);
        # haui_init gates the connection handshake
        - lambda: |-
              ESP_LOGI("haui", "NSPanel HAUI Init");
              id(haui_init) = true;

    on_page:
      then:
        - lambda: |-
            ESP_LOGD("haui", "Display page: %d", x);
            id(page).publish_state(x);

    on_touch:
      then:
        - lambda: |-
            // A tap shorter than the 200 ms coordinate poll can fall between two
            // polls, so the display's own touch report resets the timer too.
            id(reset_interaction_timer).execute(0);
            std::string event = std::to_string(page_id) + "," + std::to_string(component_id);
            event += "," + std::to_string(touch_event);
            id(publish_event_native).execute("esphome.component", event);
            if (touch_event == 1) {
              id(publish_event_native).execute("esphome.touch_start", "1");
            }

    on_buffer_overflow:
      then:
        - lambda: |-
            ESP_LOGW("haui", "Nextion buffer overflow detected");
            id(publish_event_native).execute("esphome.buffer_overflow", "1");
        # A 0x24 loses the instructions in flight; re-send a draw program once
        # so a burst of ``fill`` commands does not leave half an image behind.
        - script.execute: haui_draw_retry
