---
# Globals Configuration
globals:

  # Whether the display's setup finished
  - id: haui_init
    type: bool
    restore_value: false

  # Display state: 0 = off, 1 = dim, 2 = on
  - id: haui_display_state
    type: int
    restore_value: false

  # Whether a native API client (Home Assistant) is connected
  - id: hub_availability
    type: bool
    restore_value: false

  # Uptime seconds of the last hub heartbeat
  - id: hub_heartbeat
    type: int
    restore_value: false

  # Last hub_connection transition; starts the brightness grace after it
  - id: hub_state_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Unsigned millis() timestamps keep the elapsed-time math wrap-safe
  - id: last_interaction_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: interaction_age_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: interaction_timer_initialized
    type: bool
    restore_value: false
    initial_value: 'false'

  # Whether the handshake with the hub completed
  - id: hub_connection
    type: bool
    restore_value: false
