---
# Internal buzzer
output:
  - platform: ledc
    id: haui_rtttl_out
    pin:
      number: 21


# RTTTL sound playback
rtttl:
  id: haui_rtttl
  output: haui_rtttl_out


# Display UART
uart:
  tx_pin: 16
  rx_pin: 17
  # The TFT boots the display at 921600; older or stock TFTs are found by the
  # boot scan in display_baud.yaml.
  baud_rate: 921600
  id: haui_uart
