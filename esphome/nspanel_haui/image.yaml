---
# Drawing over the current page
#
# ``draw_runs`` streams a *slice* of a draw program to the Nextion. The hub cuts
# one image into slices (``haui/utils/draw_wire.py``) because a pass is longer
# than one API message and far bigger than this panel's heap: each slice is
# staged, streamed, and reported, and the hub sends the next one when that report
# arrives. The picture appears in bands; RAM stays the size of one slice.
#
# A run on the wire is ``x,y,w,h,colour`` with every number in base 36
# ("3c,1s,8,8,1ekf"), a third shorter than the display's own
# ``fill 120,64,8,8,65535``; the enqueue lambda decodes it back. Runs are joined
# with ';'. Everything above the firmware keeps speaking display commands.
#
# A draw does not run at the pacer's pace. ``command_spacing`` leaves one command
# per component phase - 2 ms per fill, 500 a second - which is the right pace for
# a page render, where the display is busy re-laying-out widgets and its 1 KB
# receive buffer has to survive the burst. A fixed 2 ms is also what made an
# image cost its run count times 2 ms, while the display takes a fraction of that
# per fill and the 921600-baud link carries a 25-byte fill every 0.27 ms.
#
# So a draw switches the spacing off (``draw_spacing``) and is flow-controlled by
# the display instead: it keeps at most ``draw_window`` fills in flight - unsent
# or unacknowledged, which is what ``queue_size()`` counts - and adds a run only
# once an acknowledgement freed a place. A display that needs longer per fill is
# therefore drawn at its own rate instead of being overrun, and a quick one is
# streamed until the UART is the limit. ``haui_draw_report`` puts the pacer back,
# so page renders keep the pacing that protects the receive buffer.
#
# The Nextion queues serial instructions and executes them one at a time
# (instruction set, general rule 20), so there is no "stop updating while
# painting" on the display side: ``com_stop`` would stop our own fills too and
# the docs warn it overflows the buffer, and ``code_c`` discards commands rather
# than delaying them. Ordering is the safe lever.
#
# ``fill`` takes x,y,w,h - width and height, not a second corner - and is
# available on every Nextion model (instruction set section 4, `sAll`).
substitutions:
  # Fills in flight while a program streams: unsent or unacknowledged in the
  # display's queue. The pacer is off for a draw, so this is what bounds it - a
  # run only goes out once an acknowledgement freed a place, which makes the
  # display's own rate the rate of the draw. In bytes it is ``draw_window`` times
  # the 40-byte run buffer, a fifth of the display's 1 KB receive buffer even
  # with page commands interleaved.
  draw_window: '12'
  # How often a full window is looked at again: one component phase
  # (``loop_interval`` in base.yaml), so a freed place is taken at once and the
  # stream never idles behind a poll.
  draw_queue_poll: '2ms'
  # The pacer's spacing while a program streams; 0 sends everything the window
  # holds in the next phase. ``command_spacing_ms`` (base.yaml) is restored when
  # the program reports, so only a draw runs unpaced.
  draw_spacing: '0'
  # Passes in a row without progress - no run queued and the queue no shorter -
  # before the program is failed instead of polling forever. At 2 ms a pass this
  # is one second; the queue's own ``max_queue_age`` would only clear it after
  # eight, with the pacer still off.
  draw_stall_polls: '500'
  # Longest slice accepted (packed characters). The hub slices a pass at 8 000
  # (``draw_wire.DRAW_SLICE_CHARS``); this is the device's backstop, above it so
  # the two never disagree, and far below the 32 KB API message limit.
  draw_program_max: '9000'
  # Free contiguous heap a slice needs besides its own length: the action's
  # argument and the staged copy are two of it while it moves into place, and the
  # run queue, the report and the API's own buffers come on top. A slice that
  # would not leave this much is refused by name instead of aborting the panel on
  # a failed allocation.
  draw_heap_reserve: '10000'
  # Marker written into the Nextion's ``system.resVal`` as the fence that ends a
  # program. The hub reads resVal too, so only this value ends a draw.
  draw_fence_marker: '31337'

globals:
  # The program being streamed, and how far it got. It is held once: the action
  # hands its argument over with ``std::move``, and the hub keeps its own copy to
  # re-send the slice after an overflow.
  - id: haui_draw_program
    type: std::string
    restore_value: false
  - id: haui_draw_cursor
    type: size_t
    restore_value: false
    initial_value: '0'
  # Runs in the program, and how many the display accepted
  - id: haui_draw_run_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: haui_draw_sent
    type: int
    restore_value: false
    initial_value: '0'
  # Runs that are not ``fill`` instructions. A program of anything else paints
  # nothing, and a display that accepts the text reports success - so this is
  # what keeps a wrong program from looking like a drawn image.
  - id: haui_draw_rejected
    type: int
    restore_value: false
    initial_value: '0'
  # millis() of the first pass; the fence reply turns it into elapsed_ms
  - id: haui_draw_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # The fence readback is queued and its reply not seen yet
  - id: haui_draw_awaiting
    type: bool
    restore_value: false
    initial_value: 'false'
  # The current program was accepted, and already re-sent after an overflow
  - id: haui_draw_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: haui_draw_resent
    type: bool
    restore_value: false
    initial_value: 'false'
  # The queue depth the previous pass ended at: a window that neither took a run
  # nor shrank means the display stopped acknowledging.
  - id: haui_draw_queue_mark
    type: size_t
    restore_value: false
    initial_value: '0'
  - id: haui_draw_stall_polls
    type: int
    restore_value: false
    initial_value: '0'

sensor:
  # Fence: the reply to this read can only arrive after the program's last run
  # was sent, which is the only "everything before this is out" signal the
  # transport offers. It reads the same variable as ``res_val`` (sensor.yaml).
  - platform: nextion
    nextion_id: haui_disp
    name: Draw fence
    id: haui_draw_fence
    component_name: system.resVal
    update_interval: never
    accuracy_decimals: 0
    internal: true
    on_value:
      - lambda: |-
          if (!id(haui_draw_awaiting) || int(x) != ${draw_fence_marker}) return;
          id(haui_draw_awaiting) = false;
          id(haui_draw_report).execute(
              id(haui_draw_sent) == id(haui_draw_run_count) && id(haui_draw_rejected) == 0,
              int(millis() - id(haui_draw_started_ms)));

script:
  # Accept a program and stream it. ``mode: restart`` cancels a program still in
  # flight: a second image should replace the first, not queue behind it.
  - id: haui_draw_runs
    mode: restart
    parameters:
      program: std::string
    then:
      # Validate and stage the program; a refusal leaves haui_draw_ok false and
      # the tail of this script reports it instead of drawing.
      - lambda: |-
          id(haui_draw_cursor) = 0;
          id(haui_draw_run_count) = 0;
          id(haui_draw_sent) = 0;
          id(haui_draw_rejected) = 0;
          id(haui_draw_awaiting) = false;
          id(haui_draw_resent) = false;
          id(haui_draw_ok) = false;
          id(haui_draw_queue_mark) = 0;
          id(haui_draw_stall_polls) = 0;
          id(haui_draw_program) = "";
          if (program.empty()) {
            ESP_LOGW("haui", "draw_runs: empty program");
            return;
          }
          if (program.size() > ${draw_program_max}) {
            ESP_LOGE("haui", "draw_runs: %zu characters, over the %s limit",
                     program.size(), "${draw_program_max}");
            return;
          }
          // Staging the program is a second copy of it, so check the largest
          // free block first: an allocation that fails aborts the panel.
          const size_t block = RAMAllocator<uint8_t>().get_max_free_block_size();
          if (program.size() + ${draw_heap_reserve} > block) {
            ESP_LOGE("haui", "draw_runs: %zu characters need %u more bytes than the %u-byte block",
                     program.size(), ${draw_heap_reserve}, static_cast<unsigned>(block));
            return;
          }
          if (id(haui_disp).is_updating()) {
            ESP_LOGW("haui", "draw_runs: refused, a TFT upload is running");
            return;
          }
          if (!id(haui_disp).is_setup()) {
            ESP_LOGW("haui", "draw_runs: refused, the display does not answer");
            return;
          }
          id(haui_draw_run_count) = 1;
          for (char c : program) {
            if (c == ';') id(haui_draw_run_count)++;
          }
          id(haui_draw_program) = std::move(program);
          id(haui_draw_ok) = true;
          ESP_LOGD("haui", "draw_runs: %d runs, %zu characters, %u free heap, %u largest block",
                   id(haui_draw_run_count), id(haui_draw_program).size(),
                   static_cast<unsigned>(RAMAllocator<uint8_t>().get_free_heap_size()),
                   static_cast<unsigned>(RAMAllocator<uint8_t>().get_max_free_block_size()));
      # A sleeping display silently drops every command (send_command()); wake
      # it and give the wake command a moment before the first run.
      - if:
          condition:
            lambda: return id(haui_draw_ok) && id(haui_disp).is_sleeping();
          then:
            - script.execute: display_on
            - delay: 300ms
      - if:
          condition:
            lambda: return id(haui_draw_ok);
          then:
            # The pacer leaves for the duration of the program: one command per
            # component phase is 2 ms per fill, while the display needs a
            # fraction of that. The window the enqueue pass keeps in flight is
            # what protects its receive buffer instead, and the report below puts
            # the spacing back.
            - lambda: |-
                id(haui_disp).set_command_spacing(${draw_spacing});
                id(haui_draw_started_ms) = millis();

            - script.execute: haui_draw_enqueue_batch
      - if:
          condition:
            lambda: return !id(haui_draw_ok);
          then:
            - lambda: id(haui_draw_report).execute(false, 0);

  # Keep at most ``draw_window`` runs in flight and, while runs remain, look
  # again after ``draw_queue_poll``. A run only goes out when an acknowledgement
  # freed a place, so the display's own rate is the rate of the draw - it is
  # never handed more than it has taken, whatever the pacer is set to.
  # ``mode: restart``: a new program restarts this chain instead of leaving a
  # stale one enqueuing the previous image behind it.
  - id: haui_draw_enqueue_batch
    mode: restart
    then:
      - lambda: |-
          const std::string &program = id(haui_draw_program);
          const size_t size = program.size();
          size_t cursor = id(haui_draw_cursor);
          const size_t window = ${draw_window};
          const int sent_before = id(haui_draw_sent);
          const size_t mark = id(haui_draw_queue_mark);
          // A run is x,y,w,h,colour in base 36 ("3c,1s,8,8,1ekf") and the display
          // wants "fill x,y,w,h,colour". Anything that does not decode is a wrong
          // program and must not be sent: the display accepts garbage silently.
          const auto decode = [](const std::string &packed, char *out, size_t out_size) -> bool {
            long field[5] = {0, 0, 0, 0, 0};
            int index = 0;
            bool digits = false;
            for (char c : packed) {
              if (c == ',') {
                if (!digits || index == 4) return false;
                index++;
                digits = false;
                continue;
              }
              int digit = (c >= '0' && c <= '9')   ? c - '0'
                          : (c >= 'a' && c <= 'z') ? c - 'a' + 10
                          : (c >= 'A' && c <= 'Z') ? c - 'A' + 10
                                                   : -1;
              if (digit < 0 || field[index] > 65535 / 36) return false;
              field[index] = field[index] * 36 + digit;
              digits = true;
            }
            if (!digits || index != 4) return false;
            const int written = snprintf(out, out_size, "fill %ld,%ld,%ld,%ld,%ld", field[0],
                                         field[1], field[2], field[3], field[4]);
            return written > 0 && static_cast<size_t>(written) < out_size;
          };
          while (cursor < size && id(haui_disp).queue_size() < window) {
            size_t end = program.find(';', cursor);
            if (end == std::string::npos) end = size;
            std::string packed = program.substr(cursor, end - cursor);
            if (!packed.empty()) {
              char run[40];
              if (!decode(packed, run, sizeof(run))) {
                ESP_LOGE("haui", "draw_runs: '%.20s' is not a run", packed.c_str());
                id(haui_draw_rejected)++;
              } else if (id(haui_disp).send_command(run)) {
                id(haui_draw_sent)++;
              } else {
                // The command was not taken at all, so this would spin: the
                // display went away mid-program. Stop and report the partial
                // draw.
                ESP_LOGW("haui", "draw_runs: the display refused a command");
                id(haui_draw_ok) = false;
                break;
              }
            }
            cursor = end + 1;
          }
          id(haui_draw_cursor) = cursor;
          // Progress is an acknowledgement freeing a place or a run going out. A
          // window that does neither means the display stopped answering, and
          // waiting for the queue's own age limit would leave the pacer off for
          // eight seconds: fail the program instead.
          id(haui_draw_queue_mark) = id(haui_disp).queue_size();
          if (id(haui_draw_ok) && id(haui_draw_sent) == sent_before &&
              id(haui_draw_queue_mark) == mark) {
            if (++id(haui_draw_stall_polls) >= ${draw_stall_polls}) {
              ESP_LOGE("haui", "draw_runs: the display stopped acknowledging, %d of %d runs out",
                       id(haui_draw_sent), id(haui_draw_run_count));
              id(haui_draw_ok) = false;
            }
          } else {
            id(haui_draw_stall_polls) = 0;
          }
      - if:
          condition:
            lambda: |-
              return id(haui_draw_ok) && id(haui_disp).is_setup() &&
                     id(haui_draw_cursor) < id(haui_draw_program).size();
          then:
            - delay: ${draw_queue_poll}
            - script.execute: haui_draw_enqueue_batch
          else:
            - if:
                condition:
                  lambda: return !id(haui_draw_ok);
                then:
                  - lambda: |-
                      id(haui_draw_report).execute(
                          false, int(millis() - id(haui_draw_started_ms)));
                else:
                  # The fence readback can only answer after every run above was sent.
                  - lambda: |-
                      id(haui_draw_awaiting) = true;
                      id(haui_disp).send_command_printf("system.resVal.val=%d", ${draw_fence_marker});
                      id(haui_draw_fence).update();
                      ESP_LOGD("haui", "draw_runs: %d runs queued", id(haui_draw_run_count));

  # Re-send the current program once after a buffer overflow: a 0x24 loses the
  # instructions in flight, which would leave half an image on the screen.
  - id: haui_draw_retry
    then:
      - lambda: |-
          if (!id(haui_draw_ok) || id(haui_draw_resent) || id(haui_draw_program).empty()) return;
          id(haui_draw_resent) = true;
          ESP_LOGW("haui", "draw_runs: re-sending %d runs after a buffer overflow",
                   id(haui_draw_run_count));
          id(haui_draw_runs).execute(id(haui_draw_program));

  # Report a finished or refused draw; the hub logs ok and elapsed_ms. Every way
  # a program ends comes through here, which is why the pacer is restored here
  # rather than at the end of the stream: a refusal, a stall and a lost display
  # all leave through this script, and a pacer left off would send page renders
  # as fast as the UART takes them.
  - id: haui_draw_report
    parameters:
      ok: bool
      elapsed_ms: int
    then:
      - lambda: id(haui_disp).set_command_spacing(${command_spacing_ms});
      - lambda: |-
          const json::json_build_t payload = [ok, elapsed_ms](JsonObject root) {
            root["runs"] = id(haui_draw_sent);
            root["ok"] = ok;
            root["elapsed_ms"] = elapsed_ms;
          };
          ESP_LOGD("haui", "draw_runs: %d runs, %d rejected, ok=%d, %d ms", id(haui_draw_sent),
                   id(haui_draw_rejected), ok ? 1 : 0, elapsed_ms);
          id(publish_event_native).execute("esphome.res_draw", json::build_json(payload));
