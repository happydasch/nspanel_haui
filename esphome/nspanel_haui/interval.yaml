---
# Interval Configuration
interval:

  # Check state timer
  - interval: 100ms
    then:
      - lambda: |-
          id(check_hub_connection).execute();
          id(check_connection).execute();
          if (!id(interaction_timer_initialized)) {
            id(last_interaction_ms) = millis();
            id(interaction_timer_initialized) = true;
          }
          id(interaction_age_ms) = millis() - id(last_interaction_ms);
          id(update_display).execute();
          // Device→hub heartbeat only while connected; otherwise the event
          // would trigger a premature handshake (livesign). Every
          // heartbeat_interval seconds.
          static uint16_t heartbeat_counter = 0;
          heartbeat_counter++;
          if (heartbeat_counter >= int($heartbeat_interval * 10)) {
            heartbeat_counter = 0;
            if (id(hub_connection)) {
              id(publish_heartbeat).execute();
            }
          }

  # 200 ms balances responsiveness with queue pressure: every tick issues two
  # Nextion reads (10/s); a touch start still arrives instantly via on_touch.
  - interval: 200ms
    then:
      - lambda: |-
          id(check_interaction).execute();

  # Hub→device heartbeats arrive as the hub_heartbeat action; timeouts are
  # detected in check_hub_connection above.
