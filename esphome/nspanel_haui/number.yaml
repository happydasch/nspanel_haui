---
# Number Configuration
number:

  # Full brightness
  - platform: template
    name: Brightness Full
    id: brightness_full
    entity_category: config
    unit_of_measurement: '%'
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50.0
    restore_value: true
    optimistic: true

  # Dimmed brightness
  - platform: template
    name: Brightness Dimmed
    id: brightness_dim
    entity_category: config
    unit_of_measurement: '%'
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 20.0
    restore_value: true
    optimistic: true

  # Dimming ramp duration
  - platform: template
    name: Duration Dimming
    id: duration_dim
    entity_category: config
    unit_of_measurement: 's'
    min_value: 0.0
    max_value: 5.0
    step: 0.1
    initial_value: 2.0
    restore_value: true
    optimistic: true

  # Inactivity before dimming
  - platform: template
    name: Timeout Dimming
    id: timeout_dim
    entity_category: config
    unit_of_measurement: 's'
    min_value: 0
    max_value: 3600
    step: 1
    initial_value: 10.0
    restore_value: true
    optimistic: true

  # Inactivity before the display turns off
  - platform: template
    name: Timeout Display-Off
    id: timeout_display_off
    entity_category: config
    unit_of_measurement: 's'
    min_value: 0
    max_value: 3600
    step: 1
    initial_value: 120.0
    restore_value: true
    optimistic: true

  # Temperature Correction
  - platform: template
    name: Temperature Correction
    id: temperature_correction
    entity_category: config
    unit_of_measurement: '°C'
    min_value: -10
    max_value: 10
    initial_value: 0
    step: 0.1
    restore_value: true
    optimistic: true
