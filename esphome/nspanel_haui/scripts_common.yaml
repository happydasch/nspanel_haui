---
script:

  # is_sleeping() guards only a real hardware-sleep session (the no-hub path);
  # request scripts wake the panel first so a read never lands on a dark display.

  # Send a notification
  - id: send_notification
    parameters:
      title: string
      message: string
      icon: string        # "" = no icon
      persistent: bool    # true = loop the sound until dismissed
      text_size: string   # "auto" or a font size 1-3
      icon_color: string  # "#rrggbb" or RGB565; "" = theme text colour
      sound: string       # play_sound name; "" or "none" = silent
    then:
      - lambda: |-
          ESP_LOGV("haui", "Script: send_notification: %s - %s - %s - persistent:%i - text_size:%s - icon_color:%s - sound:%s", title.c_str(), message.c_str(), icon.c_str(), persistent, text_size.c_str(), icon_color.c_str(), sound.c_str());
          const json::json_build_t payload = [
              title, message, icon, persistent, text_size, icon_color, sound
          ](JsonObject root) {
            root["title"] = title;
            root["message"] = message;
            if (!icon.empty()) {
              root["icon"] = icon;
            }
            root["persistent"] = persistent;
            if (!text_size.empty()) {
              root["text_size"] = text_size;
            }
            if (!icon_color.empty()) {
              root["icon_color"] = icon_color;
            }
            root["sound"] = sound;
          };
          std::string payload_str = json::build_json(payload);
          id(publish_event_native).execute("esphome.send_notification", payload_str);

  # Request a number value from a component or global variable
  - id: request_number
    parameters:
      component: string
    then:
      - lambda: |-
          id(req_val_component).publish_state(component);
          if (id(haui_disp).is_sleeping()) { id(display_on).execute(); }
          id(haui_disp).send_command_printf("system.resVal.val=%s.val", component.c_str());
          id(res_val).update();

  # Request a text value from a component or global variable
  - id: request_text
    parameters:
      component: string
    then:
      - lambda: |-
          id(req_txt_component).publish_state(component);
          if (id(haui_disp).is_sleeping()) { id(display_on).execute(); }
          id(haui_disp).send_command_printf("system.resTxt.txt=%s", component.c_str());
          id(res_txt).update();

  # Play an RTTTL string
  - id: play_rtttl
    parameters:
      song_str: std::string
    then:
      - lambda: |-
          ESP_LOGI("haui", "play_rtttl %s", song_str.c_str());
          id(haui_rtttl).play(song_str);

  # Play a named sound
  - id: play_sound
    parameters:
      name: std::string
      # startup, tone, tone_up, tone_down, seq_up, seq_down, notification,
      # alert, alert_fast, elise
    then:
      - lambda: |-
          ESP_LOGI("haui", "Script play_sound %s", name.c_str());
          std::string sound_string = "";

          if (name == "startup") {
            sound_string = "startup:d=4,o=5,b=200:8c7,8g7,8d7,8g7";
          } else if (name == "tone") {
            sound_string = "tone:d=8,o=6,b=200:16e6";
          } else if (name == "tone_up") {
            sound_string = "tone_up:d=8,o=6,b=200:16d6";
          } else if (name == "tone_down") {
            sound_string = "tone_down:d=8,o=6,b=200:16g6";
          } else if (name == "seq_up") {
            sound_string = "seq_up:d=16,o=5,b=160:16e6,16g6";
          } else if (name == "seq_down") {
            sound_string = "seq_down:d=16,o=5,b=160:16g6,16d6";
          } else if (name == "notification") {
            sound_string = "notification:d=8,o=6,b=200:16e,16c6,16g6,8c6,8g6";
          } else if (name == "alert_fast") {
            sound_string = "alert_fast:d=8,o=6,b=200:16c7,16d7,16c7,16d7,16c7,16d7,16c7,16d7,16e7";
          } else if (name == "alert") {
            sound_string = "alert:d=16,o=6,b=400:16c7,16d7,16c7,16d7,16c7,16d7,16c7,16d7,16e7";
          } else if (name == "elise") {
            sound_string = "elise:d=8,o=5,b=125:32p,e6,d#6,e6,d#6,e6,b,d6,c6,4a.,32p,c,e,a,4b.,32p,e,g#,b,4c.6,32p,e,e6,d#6,e6,d#6,e6,b,d6,c6,4a.,32p,c,e,a,4b.,32p,d,c6,b,2a";
          }

          if (sound_string != "") {
            id(haui_rtttl).play(sound_string);
          }

  # Stop every active device activity before a long blocking operation (TFT
  # upload, OTA, shutdown). Add each new stoppable component here.
  - id: suspend_activities
    then:
      - lambda: |-
          ESP_LOGI("haui", "Suspending active device activities");
          // rtttl only turns a note off from its loop(); a blocked loop or a
          // CPU-only reboot leaves the LEDC sounding it.
          id(haui_rtttl).stop();

  # Start a TFT upload: suspend activities, set the URL, run the blocking upload.
  - id: prepare_tft_upload
    parameters:
      url: std::string
    then:
      - lambda: |-
          ESP_LOGI("haui", "Script prepare_tft_upload %s", url.c_str());
      - script.execute: suspend_activities
      - lambda: |-
          id(haui_disp).set_tft_url(url.c_str());
          id(haui_disp).upload_tft();
