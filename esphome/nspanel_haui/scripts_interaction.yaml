---
script:

  - id: reset_interaction_timer
    mode: restart
    parameters:
      offset: int
    then:
      - lambda: |-
          id(last_interaction_ms) = millis() - static_cast<uint32_t>(offset) * 1000U;
          id(interaction_timer_initialized) = true;

  - id: check_interaction
    then:
      - lambda: |-
          id(touch_x).update();
          id(touch_y).update();
          int curr_x = id(touch_x).state;
          int curr_y = id(touch_y).state;
          static int prev_x = 0;
          static int prev_y = 0;
          static int start_x = 0;
          static int start_y = 0;
          bool is_touch = false;

          // Non-zero coordinates mean an active touch
          if (curr_x > 0 && curr_y > 0) {
            is_touch = true;
          }

          // Publish each touch edge once
          if (is_touch) {  // touch active
            if (!id(touch).state) {
              ESP_LOGD("haui", "Touch Start (%d,%d)", curr_x, curr_y);
              id(reset_interaction_timer).execute(0);
              id(touch).publish_state(true);
              id(publish_event_native).execute("esphome.touch_start", "");
              start_x = curr_x;
              start_y = curr_y;
            }
          } else {  // touch inactive
            if (id(touch).state) {
              ESP_LOGD("haui", "Touch End (%d,%d)", prev_x, prev_y);
              std::string touch_event = to_string(start_x) + "," + to_string(start_y);
              touch_event += "," + to_string(prev_x) + "," + to_string(prev_y);
              id(publish_event_native).execute("esphome.touch_end", touch_event);
              id(touch).publish_state(false);
              id(process_touch_gesture).execute(start_x, start_y, prev_x, prev_y);
              start_x = 0;
              start_y = 0;
            }
          }
          prev_x = curr_x;
          prev_y = curr_y;

  # Process touch gestures
  - id: process_touch_gesture
    parameters:
      x1: int
      y1: int
      x2: int
      y2: int
    then:
      - lambda: |-
          if (!x1 || !y1 || !x2 || !y2) {
            ESP_LOGD("haui", "Cannot process gesture with provided values: (%i,%i) - (%i,%i)", x1, y1, x2, y2);
            return;
          }
          ESP_LOGD("haui", "Checking gesture with provided values: (%i,%i) - (%i,%i)", x1, y1, x2, y2);

          // Swipe thresholds
          int min_distance_x = 200;
          int min_distance_y = 150;
          int max_angle = 20;
          int border_margin = 40;
          // Landscape or portrait (the hub syncs it). The landscape digitizer
          // spans 0..479 but only 450 px are visible (the rest sits under the
          // bezel); portrait is rotated, so its touch space is 320x480.
          bool portrait = id(display_model).current_option() == "Portrait";
          int visible_width = portrait ? 320 : 450;
          int screen_h = portrait ? 480 : 320;

          // Swipe direction
          bool is_horizontal = abs(x2 - x1) > abs(y2 - y1);
          bool is_swipe_right = (x2 - x1) > 0;
          bool is_swipe_down = (y2 - y1) > 0;
          // Right-edge starts are measured from visible_width, so touches in the
          // hidden 450..479 zone also count as right-edge starts.
          bool is_near_border = false;
          if (x1 < border_margin || y1 < border_margin
              || x1 > (visible_width - border_margin)
              || y1 > (screen_h - border_margin)) {
              is_near_border = true;
          }

          // Distance and angle of the swipe
          int delta_x = abs(x2 - x1);
          int delta_y = abs(y2 - y1);
          int distance = sqrt(delta_x*delta_x + delta_y*delta_y);
          int angle = atan2(delta_y, delta_x) * 180 / M_PI;

          // Check the distance and angle thresholds
          bool meets_distance_threshold = is_horizontal ? distance >= min_distance_x :  distance >= min_distance_y;
          bool meets_angle_threshold = (is_horizontal && abs(angle) <= max_angle) || (!is_horizontal && abs(angle) >= 90 - max_angle);

          // Publish the swipe event
          std::string swipe_event = "";
          if (is_near_border && meets_distance_threshold && meets_angle_threshold) {
            if (is_horizontal && is_swipe_right) {
              swipe_event = "swipe_right";
            } else if (is_horizontal && !is_swipe_right) {
              swipe_event = "swipe_left";
            } else if (!is_horizontal && is_swipe_down) {
              swipe_event = "swipe_down";
            } else if (!is_horizontal && !is_swipe_down) {
              swipe_event = "swipe_up";
            }
          }
          if (swipe_event != "") {
            ESP_LOGD("haui", "gesture %s", swipe_event.c_str());
            id(publish_event_native).execute("esphome.gesture", swipe_event);
          }
