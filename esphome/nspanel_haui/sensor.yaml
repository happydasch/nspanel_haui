---

# Binary Sensor Configuration
binary_sensor:

  # Touch state
  - platform: template
    name: Touch
    id: touch
    internal: false
    disabled_by_default: true

  # Physical relay button below the display
  - platform: gpio
    name: Button Left
    id: button_left
    pin:
      number: 14
      inverted: true
    # Debounce both edges so on_press fires once per physical press
    filters:
      - delayed_on_off: 10ms
    on_press:
      then:
        - lambda: |-
            id(publish_event_native).execute("esphome.button_left", "1");
            if (id(use_button_interaction).state) {
              id(reset_interaction_timer).execute(0);
            }
        # Toggle on the press edge: on_click only covered 50-350 ms presses, so
        # a long press (the usual way to wake a dimmed screen) did nothing.
        - if:
            condition:
              - switch.is_on: use_relay_left
            then:
              - switch.toggle: relay_left
    on_release:
      then:
        - lambda: |-
            id(publish_event_native).execute("esphome.button_left", "0");


  # Physical relay button below the display
  - platform: gpio
    name: Button Right
    id: button_right
    pin:
      number: 27
      inverted: true
    # Debounce both edges so on_press fires once per physical press
    filters:
      - delayed_on_off: 10ms
    on_press:
      then:
        - lambda: |-
            id(publish_event_native).execute("esphome.button_right", "1");
            if (id(use_button_interaction).state) {
              id(reset_interaction_timer).execute(0);
            }
        # Toggle on the press edge: on_click only covered 50-350 ms presses, so
        # a long press (the usual way to wake a dimmed screen) did nothing.
        - if:
            condition:
              - switch.is_on: use_relay_right
            then:
              - switch.toggle: relay_right
    on_release:
      then:
        - lambda: |-
            id(publish_event_native).execute("esphome.button_right", "0");


# Text Sensor Configuration
text_sensor:

  # TFT Version
  - platform: nextion
    nextion_id: haui_disp
    name: TFT Version
    id: tft_version
    update_interval: never
    component_name: system.tftVersion
    internal: true
    on_value:
      - lambda: |-
          // The boot handshake reads this before the display answers (~5 s in);
          // republish the device state as soon as the version arrives.
          if (id(hub_connection) && !id(tft_version).state.empty()) {
            id(publish_device_state).execute();
          }

  # Number request component
  - platform: template
    name: Request number component
    id: req_val_component
    update_interval: never
    internal: true

  # Text request component
  - platform: template
    name: Request text component
    id: req_txt_component
    update_interval: never
    internal: true

  # Response text
  - platform: nextion
    nextion_id: haui_disp
    name: Response Text
    id: res_txt
    update_interval: never
    component_name: system.resTxt
    internal: true
    on_value:
      - lambda: |-
          if (id(req_txt_component).state != "") {
            auto name = id(req_txt_component).state;
            const json::json_build_t payload = [name, x](JsonObject root) {
              root["name"] = name;
              root["type"] = "text";
              root["value"] = x;
            };
            auto payload_str = json::build_json(payload);
            id(publish_event_native).execute("esphome.read_response", payload_str);
          }

  # WiFi information
  - platform: wifi_info
    ip_address:
      name: IP
      id: ip_address
    ssid:
      name: SSID
      id: wifi_ssid
    bssid:
      name: BSSID
      disabled_by_default: true
      id: wifi_bssid

  # Page name, derived from the page id sensor below
  - platform: template
    name: Current Page
    id: current_page
    icon: mdi:view-dashboard-outline
    update_interval: never
    disabled_by_default: true

  # Hub handshake state ("online"/"offline"), published by set_hub_connected
  - platform: template
    name: Client Status
    id: client_status
    entity_category: diagnostic
    update_interval: never
    internal: false


# Sensor Configuration
sensor:

  # Response number
  - platform: nextion
    nextion_id: haui_disp
    name: Response Number
    id: res_val
    component_name: system.resVal
    update_interval: never
    accuracy_decimals: 0
    internal: true
    on_value:
      - lambda: |-
          if (id(req_val_component).state != "") {
            auto name = id(req_val_component).state;
            const json::json_build_t payload = [name, x](JsonObject root) {
              root["name"] = name;
              root["type"] = "number";
              root["value"] = x;
            };
            auto payload_str = json::build_json(payload);
            id(publish_event_native).execute("esphome.read_response", payload_str);
          }
  # Current page, by Nextion page id; updates on every page change
  - platform: template
    name: Current Page Number
    id: page
    icon: mdi:numeric
    accuracy_decimals: 0
    update_interval: never
    disabled_by_default: true
    on_value:
      then:
        - lambda: |-
            uint8_t page_id = (uint8_t)x;
            id(publish_event_native).execute("esphome.page", std::to_string(page_id));
            // Nextion page names by page id; must match the HMI page order
            // (tests/test_esphome_yaml.py checks it against the hub).
            static const char *const PAGE_NAMES[] = {
              "system", "blank", "about", "settings", "notify", "select",
              "weather", "clock", "clocktwo", "grid", "row", "qr", "timer",
              "light", "media", "vacuum", "climate", "alarm", "cover",
            };
            if (page_id < sizeof(PAGE_NAMES) / sizeof(PAGE_NAMES[0])) {
              id(current_page).publish_state(PAGE_NAMES[page_id]);
            } else {
              ESP_LOGW("haui", "Unknown display page id: %d", page_id);
              id(current_page).publish_state(std::to_string(page_id));
            }

  # Touch X coordinates
  - platform: nextion
    nextion_id: haui_disp
    name: "Touch X"
    id: touch_x
    variable_name: tch0
    update_interval: never
    accuracy_decimals: 0
    internal: true
    filters:
      # Publish only a changed value
      - lambda: |-
          if (id(touch_x).state != x) {
            return x;
          } else {
            return {};
          }

  # Touch Y coordinates
  - platform: nextion
    nextion_id: haui_disp
    name: "Touch Y"
    id: touch_y
    variable_name: tch1
    update_interval: never
    accuracy_decimals: 0
    internal: true
    filters:
      # Publish only a changed value
      - lambda: |-
          if (int(id(touch_y).state) != int(x)) {
            return x;
          } else {
            return {};
          }

  # Brightness of display (last value the firmware set, not a readback)
  - platform: template
    id: brightness
    name: Brightness
    internal: false
    disabled_by_default: true
    accuracy_decimals: 0
    update_interval: never

  # WiFi signal strength
  - platform: wifi_signal
    name: RSSI
    id: wifi_rssi
    update_interval: 60s

  # Internal temperature sensor: ADC value
  - platform: adc
    name: ADC
    id: ntc_source
    pin: 38
    update_interval: 60s
    attenuation: 12db
    entity_category: diagnostic
    disabled_by_default: true

  # ADC reading converted to resistance
  - platform: resistance
    name: Resistance
    id: resistance_sensor
    sensor: ntc_source
    entity_category: diagnostic
    configuration: DOWNSTREAM
    resistor: 11.2kOhm
    disabled_by_default: true

  # Resistance converted to temperature
  - platform: ntc
    name: Temperature
    id: temperature
    sensor: resistance_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    filters:
      # Apply the Temperature Correction number
      - lambda: return x + id(temperature_correction).state;
