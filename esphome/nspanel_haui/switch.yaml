---
# Switch Configuration
switch:

  # Display power (GPIO 4). On after every boot; switching it off leaves the
  # screen dark until it is switched on again or the device restarts.
  - platform: gpio
    name: Screen Power
    id: screen_power
    entity_category: config
    disabled_by_default: true
    restore_mode: ALWAYS_ON
    internal: false
    pin:
      number: 4
      inverted: true

  # Buttons reset the inactivity timer
  - platform: template
    name: Use Button Interaction
    id: use_button_interaction
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # Automatic dimming
  - platform: template
    name: Use Auto-Dimming
    id: use_auto_dimming
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # Automatic brightness 0 after the display-off timeout
  - platform: template
    name: Use Auto Display-Off
    id: use_auto_display_off
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # Left relay. RESTORE_DEFAULT_OFF keeps its last state across reboots,
  # firmware updates and power loss (NVS); ALWAYS_OFF switched connected loads
  # off on every update.
  - platform: gpio
    name: Relay Left
    id: relay_left
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: 22
    on_turn_on:
      then:
        - lambda: |-
            id(publish_event_native).execute("esphome.relay_left", "1");
    on_turn_off:
      then:
        - lambda: |-
            id(publish_event_native).execute("esphome.relay_left", "0");

  # Right relay; same restore behaviour as the left one
  - platform: gpio
    name: Relay Right
    id: relay_right
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: 19
    on_turn_on:
      then:
        - lambda: |-
            id(publish_event_native).execute("esphome.relay_right", "1");
    on_turn_off:
      then:
        - lambda: |-
            id(publish_event_native).execute("esphome.relay_right", "0");

  # Let the left button switch the relay
  - platform: template
    name: Use Relay Left
    id: use_relay_left
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # Let the right button switch the relay
  - platform: template
    name: Use Relay Right
    id: use_relay_right
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
