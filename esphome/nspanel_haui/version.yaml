---
substitutions:
  # Version of this yaml config file (source of truth: manifest.json)
  yaml_version: '0.5.9.dev99'
  # Display TFT version required by this firmware; bump only with --tft-update.
  # Dev builds copy it from the HMIs' system.tftVersion (dev-firmware.yml).
  tft_version: '1.1.0'
  # Contract version between this firmware and the hub. Bump the major version
  # only for an incompatible change to the handshake or the event payloads.
  hub_api_version: '1.0'
