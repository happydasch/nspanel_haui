---
substitutions:
  # Version of this yaml config file (source of truth: manifest.json)
  yaml_version: '0.6.0.dev101'
  # Display TFT version required by this firmware; bump only with --tft-update.
  # Dev builds copy it from the HMIs' system.tftVersion (dev-firmware.yml).
  tft_version: '1.1.2'
  # Contract version between this firmware and the hub. Bump the major version
  # only for an incompatible change to the handshake or the event payloads.
  hub_api_version: '1.0'
  # The program format of the ``draw_runs`` action's argument: 1 = the runs are
  # display ``fill`` instructions, 2 = five base-36 numbers each, decoded back to
  # the instruction (haui/utils/draw_wire.py). The hub sends what the panel says
  # it decodes - a firmware that reports nothing is sent instructions - so bump
  # this in the same commit as the decoder change.
  draw_format: '2'
