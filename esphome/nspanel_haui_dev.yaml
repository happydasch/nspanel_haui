#
# Configuration for NSPanel HomeAssistant UI
#
# useable for local development
#

substitutions:

  # Heartbeat interval in seconds
  heartbeat_interval: '5'
  # Friendly name of the device
  friendly_name: 'NSPanel HAUI'
  # Name of the device
  name: nspanel-haui  # this name is also used for hostname

  # Accounts and Passwords
  ota_password: !secret ota_password
  api_encryption_key: !secret api_encryption_key
  web_username: !secret web_username
  web_password: !secret web_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password: !secret ap_password

  # Custom build identity (see nspanel_haui.yaml): the hub refuses to install
  # the universal release image on it.
  firmware_variant: 'custom'

  # Default TFT URL of the display component.  Install a local TFT build
  # with nspanel_haui.update_tft and its url field, e.g.
  # http://homeassistant.local:8123/local/nspanel/nspanel_haui_portrait.tft
  #tft_update_url: https://github.com/happydasch/nspanel_haui/raw/master/nextion/nspanel_haui.tft
  tft_update_url: http://homeassistant.local:8123/local/nspanel/nspanel_haui.tft

# Temporary: stock `nextion` in released ESPHome lacks the numeric-response
# delivery fix (esphome/esphome#17744, ships in 2026.11.0).  Override it with
# the patched component vendored next to this file (see nextion_patch/README).
external_components:
  - source:
      type: local
      path: nextion_patch
    components: [nextion]

# Local development build: keep the ESPHome web server for diagnostics.
# The production and universal builds drop it (base.yaml) so HTTP OTA has
# flash headroom.
web_server:
  port: 80
  auth:
    username: $web_username
    password: $web_password

packages:
  version: !include nspanel_haui/version.yaml
  globals: !include nspanel_haui/globals.yaml
  base: !include nspanel_haui/base.yaml
  hardware: !include nspanel_haui/hardware.yaml
  display: !include nspanel_haui/display.yaml
  interval: !include nspanel_haui/interval.yaml
  scripts_common: !include nspanel_haui/scripts_common.yaml
  scripts_connection: !include nspanel_haui/scripts_connection.yaml
  scripts_interaction: !include nspanel_haui/scripts_interaction.yaml
  scripts_display: !include nspanel_haui/scripts_display.yaml
  scripts_event: !include nspanel_haui/scripts_event.yaml
  api: !include nspanel_haui/api.yaml
  button: !include nspanel_haui/button.yaml
  number: !include nspanel_haui/number.yaml
  switch: !include nspanel_haui/switch.yaml
  sensor: !include nspanel_haui/sensor.yaml
  debug: !include nspanel_haui/debug.yaml
