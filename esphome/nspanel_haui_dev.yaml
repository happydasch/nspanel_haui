# Local development build: hardcoded substitutions, credentials from
# secrets.yaml, ESPHome web server enabled.
#

substitutions:

  # Heartbeat interval in seconds
  heartbeat_interval: '5'
  # Friendly name of the device
  friendly_name: 'NSPanel HAUI'
  # Device name; also the hostname and entity-ID prefix
  name: nspanel-haui

  # Accounts and Passwords
  # The API key also encrypts native OTA uploads (base.yaml)
  api_encryption_key: !secret api_encryption_key
  web_username: !secret web_username
  web_password: !secret web_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password: !secret ap_password

  # Custom build; the hub never offers it the universal release image.
  firmware_variant: 'custom'

  # Display default only; the hub sends the URL of the TFT it installs
  tft_update_url: https://github.com/happydasch/nspanel_haui/raw/master/nextion/nspanel_haui.tft


# Vendored nextion override for installed setups (git source); remove it once
# every fix in nextion_patch/README.md ships in a released ESPHome. Follow this
# repo's stable branch, refreshed on every build so a compile never pairs a new
# display.yaml with an older patch.
external_components:
  - source:
      type: git
      url: https://github.com/happydasch/nspanel_haui
      ref: master
      path: esphome/nextion_patch
    components: [nextion]
    refresh: 0s

# Dev builds keep the web server for diagnostics; release builds drop it
# (base.yaml) so HTTP OTA has flash and RAM headroom.
web_server:
  port: 80
  auth:
    username: $web_username
    password: $web_password

packages:
  haui: !include nspanel_haui/packages.yaml
  debug: !include nspanel_haui/debug.yaml
