#
# NSPanel HAUI — universal prebuilt firmware.
#
# Builds without secrets: the credentials are the documented public defaults.
# One binary serves any number of panels; `name_add_mac_suffix` appends the
# last six MAC digits at runtime, giving each panel its own hostname, mDNS name
# and setup access point. Provisioning runs over that open access point:
#
#   1. Flash `nspanel_haui.bin` (web.esphome.io or wired).
#   2. Join the AP (named after the device, e.g. "nspanel-haui-a1b2c3"),
#      enter your Wi-Fi; ESPHome stores it and reboots.
#   3. In Home Assistant, add the ESPHome device with the fixed API key below.
#   4. Add the device in the HAUI editor; the hub links and configures it.
#
# Repeat 1-4 per panel; no YAML edit and no local ESPHome build is needed.
#
# Security: the API key, which also encrypts native OTA, is public, so anyone
# with LAN access can reflash the panel. Use `esphome/install.yaml` with secrets
# when that trade-off is not acceptable.
substitutions:
  heartbeat_interval: '5'
  friendly_name: 'NSPanel HAUI'
  # Base device name. The MAC suffix is appended at runtime so panels stay
  # unique; the hub matches devices on `esphome.project.name`
  # (happydasch.nspanel_haui), not on this name.
  name: nspanel-haui

  # Fixed, documented credentials (docs/user/install.md, "Universal image").
  # No web credentials: the web server stays disabled (base.yaml).
  api_encryption_key: 'TlNwYW5lbC1IQVVJLXVuaXZlcnNhbC1rZXktMDAwMDE='
  # base.yaml declares a station network that the wifi block below removes;
  # defined only so the package resolves without warnings.
  wifi_ssid: ''
  wifi_password: ''
  # Open fallback AP so the user can always join and provision.
  ap_password: ''

  # This image is the prebuilt release firmware with the public credentials; the
  # hub only offers/installs it on panels that report the `universal` variant.
  firmware_variant: 'universal'

  # Display default only; the hub's TFT update installs the release asset that
  # matches the panel's display_model.
  tft_update_url: https://github.com/happydasch/nspanel_haui/raw/master/nextion/nspanel_haui.tft

# Vendored nextion override (local source, so CI and the release build validate
# this checkout); remove it once every fix in nextion_patch/README.md ships in a
# released ESPHome.
external_components:
  - source:
      type: local
      path: nextion_patch
    components: [nextion]

# Unique per device: the MAC suffix is appended at runtime, so one binary
# installs any number of panels without colliding on mDNS or entity ids.
esphome:
  name_add_mac_suffix: true
  includes:
    - <nvs.h>
  # Builds before 0.4.3 baked a never-matching station network, so ESPHome
  # keyed the captive-portal Wi-Fi to that build's config hash and the next
  # firmware update forgot it. Without a station network ESPHome uses WiFi's
  # fixed key (WiFiComponent::start(); re-check it when bumping ESPHome), so
  # copy Wi-Fi saved by an older build there once, before WiFi's setup
  # (priority 250) reads it.
  on_boot:
    priority: 800
    then:
      - lambda: |-
          static constexpr uint32_t SAVED_WIFI_KEY = 88491487UL;
          auto pref = global_preferences->make_preference<wifi::SavedWifiSettings>(SAVED_WIFI_KEY, true);
          wifi::SavedWifiSettings saved{};
          if (pref.load(&saved)) {
            return;
          }
          // save_wifi_sta() strncpy's both strings into a zeroed record, so a
          // saved record is two zero-padded strings; nothing else this
          // firmware stores looks like that.
          auto padded = [](const char *text, size_t size, bool allow_empty) {
            size_t len = strnlen(text, size);
            if (len == size || (len == 0 && !allow_empty)) {
              return false;
            }
            for (size_t i = len; i < size; i++) {
              if (text[i] != '\0') {
                return false;
              }
            }
            return true;
          };
          bool found = false;
          // "esphome" is the NVS namespace of ESPHome's ESP32 preferences.
          nvs_iterator_t it = nullptr;
          esp_err_t err = nvs_entry_find(NVS_DEFAULT_PART_NAME, "esphome", NVS_TYPE_BLOB, &it);
          while (err == ESP_OK) {
            nvs_entry_info_t info;
            nvs_entry_info(it, &info);
            wifi::SavedWifiSettings candidate{};
            size_t len = 0;
            if (nvs_get_blob(global_preferences->nvs_handle, info.key, nullptr, &len) == ESP_OK &&
                len == sizeof(saved) &&
                nvs_get_blob(global_preferences->nvs_handle, info.key, &candidate, &len) == ESP_OK &&
                padded(candidate.ssid, sizeof(candidate.ssid), false) &&
                padded(candidate.password, sizeof(candidate.password), true)) {
              ESP_LOGI("haui", "Found Wi-Fi '%s' saved by an older build (key %s)", candidate.ssid, info.key);
              saved = candidate;
              found = true;
            }
            err = nvs_entry_next(&it);
          }
          nvs_release_iterator(it);
          if (found) {
            pref.save(&saved);
            global_preferences->sync();
            ESP_LOGI("haui", "Moved saved Wi-Fi '%s' to the key firmware updates keep", saved.ssid);
          }

# Drop the compile-time AP SSID so the firmware names the AP after the
# suffixed device name (a fixed SSID would collide on a LAN with two panels).
# Drop the station network too: ESPHome keeps captive-portal Wi-Fi across
# updates only when the YAML defines no network of its own.
wifi:
  ssid: !remove
  password: !remove
  ap:
    ssid: !remove

packages:
  haui: !include nspanel_haui/packages.yaml
