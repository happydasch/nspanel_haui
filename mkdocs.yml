# Zensical reads this MkDocs-compatible config; local and CI builds use `zensical`.
site_name: NSPanel HAUI
site_url: https://happydasch.github.io/nspanel_haui/
repo_url: https://github.com/happydasch/nspanel_haui
repo_name: nspanel_haui
edit_uri: edit/dev/docs/
site_description: HomeAssistant UI for the Sonoff NSPanel — a flexible, configurable display system built on ESPHome.
use_directory_urls: false
site_author: happydasch
copyright: Copyright &copy; 2024-2026 happydasch

theme:
  variant: classic
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - assets/embed.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/happydasch/nspanel_haui

nav:
  - Home: README.md
  - User Guide:
    - Setup:
