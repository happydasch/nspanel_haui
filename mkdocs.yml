# Zensical reads this MkDocs-compatible config; local and CI builds use `zensical`.
site_name: NSPanel HAUI
site_url: https://happydasch.github.io/nspanel_haui/
repo_url: https://github.com/happydasch/nspanel_haui
repo_name: nspanel_haui
edit_uri: edit/master/docs/
site_description: HomeAssistant UI for the Sonoff NSPanel — a flexible, configurable display system built on ESPHome.
use_directory_urls: false
site_author: happydasch
copyright: Copyright &copy; 2024-2026 happydasch

theme:
  variant: classic
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_javascript:
  - assets/dev-repo-version.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/happydasch/nspanel_haui

nav:
  - User Guide:
    - README.md
    - Quick Start: user/get-started.md
    - Installation: user/install.md
    - Updating: user/update.md
    - Configuration:
      - Overview: user/configuration/README.md
      - Device Configuration: user/configuration/device.md
      - Themes: user/configuration/themes.md
      - Display Models: user/configuration/display-models.md
      - Panel Configuration: user/configuration/panels.md
      - Item Configuration: user/configuration/items.md
    - Device Description: user/device.md
    - Panels:
      - Overview: user/panels/README.md
      - Weather: user/panels/panel_weather.md
      - Clock: user/panels/panel_clock.md
      - ClockTwo: user/panels/panel_clocktwo.md
      - Grid: user/panels/panel_grid.md
      - Row: user/panels/panel_row.md
      - Light: user/panels/panel_light.md
      - Media: user/panels/panel_media.md
      - Vacuum: user/panels/panel_vacuum.md
      - QR Code: user/panels/panel_qr.md
      - Cover: user/panels/panel_cover.md
      - Climate: user/panels/panel_climate.md
      - Timer: user/panels/panel_timer.md
      - Alarm: user/panels/panel_alarm.md
      - About: user/panels/panel_about.md
      - Blank: user/panels/panel_blank.md
      - System: user/panels/panel_system.md
      - Settings: user/panels/panel_settings.md
      - Popup Notify: user/panels/popup_notify.md
      - Popup Select: user/panels/popup_select.md
      - Popup Unlock: user/panels/popup_unlock.md
    - Examples: user/examples.md
    - Services: user/services.md
    - FAQ: user/faq.md
    - Troubleshooting: user/troubleshooting.md
  - Developer Guide:
    - develop/development.md
    - Release Process & Strategy: develop/release.md
    - Update Process: develop/update-process.md
    - Design Guidelines: develop/design.md
    - Frontend Architecture: develop/frontend.md
    - Communication Overview: develop/communication.md
    - Notification Process: develop/notifications.md
    - ESPHome Component: develop/esphome.md
    - Hub Component: develop/hub.md
    - Nextion Component: develop/nextion.md
    - Nextion Editor (Human Guide): develop/nextion-editor.md
