    - Actions: user/actions.md
    - Dashboard Card: user/dashboard-card.md
    - FAQ: user/faq.md
    - Troubleshooting: user/troubleshooting.md
  - Developer Guide:
    - General:
      - Development setup: develop/development.md
      - Hub & runtime: develop/hub.md
