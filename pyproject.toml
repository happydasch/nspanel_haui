[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nspanel-haui"
# Version kept in sync with custom_components/nspanel_haui/manifest.json (source of truth)
version = "0.5.5"
description = "NSPanel HAUI custom integration for Home Assistant"
requires-python = ">=3.14"

[project.urls]
Homepage = "https://github.com/happydasch/nspanel_haui"
Documentation = "https://happydasch.github.io/nspanel_haui/"
Repository = "https://github.com/happydasch/nspanel_haui"
Issues = "https://github.com/happydasch/nspanel_haui/issues"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
mypy_path = "custom_components"
explicit_package_bases = true
namespace_packages = true
files = "custom_components/nspanel_haui"
# The integration package is the mypy target. Its imports walk up to Home
# Assistant and the app glue; follow those modules for their types but only
# report errors from the package itself.
follow_imports = "silent"

[tool.ruff]
target-version = "py314"
line-length = 100
# The vendored ESPHome component stays byte-identical to the upstream release
# (see esphome/nextion_patch/README.md), so it is neither linted nor reformatted
# here: upstream formatting is not ours to change, and a diff against the release
# tag is the only way to see what the patch actually touches.
extend-exclude = ["esphome/nextion_patch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["S101", "B008"]
