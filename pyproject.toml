[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nspanel-haui"
# Version kept in sync with custom_components/nspanel_haui/manifest.json (source of truth)
version = "0.4.3"
description = "NSPanel HAUI custom integration for Home Assistant"
requires-python = ">=3.14"

[project.urls]
Homepage = "https://github.com/happydasch/nspanel_haui"
Documentation = "https://happydasch.github.io/nspanel_haui/"
Repository = "https://github.com/happydasch/nspanel_haui"
Issues = "https://github.com/happydasch/nspanel_haui/issues"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
mypy_path = "custom_components"
explicit_package_bases = true
namespace_packages = true
files = "custom_components/nspanel_haui/haui"
# Only haui/ is a mypy target. Its TYPE_CHECKING imports walk up to the app
# glue, which imports Home Assistant (not installed in CI); type-check those
# followed modules too but only report errors from haui/ itself.
follow_imports = "silent"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["S101", "B008"]
