<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>editor</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="steps.css">
</head>
<body>
  <div class="frame">
    <div class="step"><span class="num">1</span><i class="mdi">&#xF07D0;</i>
      <h2>Open the editor</h2><p>NSPanel HAUI in the Home Assistant sidebar</p></div>
    <div class="arrow">&#xF0142;</div>
    <div class="step"><span class="num">2</span><i class="mdi">&#xF0ECE;</i>
      <h2>Select a device</h2><p>Every panel found on your network</p></div>
    <div class="arrow">&#xF0142;</div>
    <div class="step"><span class="num">3</span><i class="mdi">&#xF0F8D;</i>
      <h2>Edit panels</h2><p>Panels, items, colours and icons</p></div>
    <div class="arrow">&#xF0142;</div>
    <div class="step last"><span class="num">4</span><i class="mdi">&#xF0741;</i>
      <h2>Live preview</h2><p>Tap, drag and swipe the virtual panel</p></div>
  </div>
</body>
</html>
