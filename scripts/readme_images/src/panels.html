<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>panels</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="steps.css">
</head>
<body>
  <div class="frame">
    <div class="step"><span class="num">1</span><i class="mdi">&#xF056E;</i>
      <h2>Choose a panel</h2><p>13 types, from clock to QR code</p></div>
    <div class="arrow">&#xF0142;</div>
    <div class="step"><span class="num">2</span><i class="mdi">&#xF1542;</i>
      <h2>Add entities</h2><p>Tiles, rows, sliders and toggles</p></div>
    <div class="arrow">&#xF0142;</div>
    <div class="step"><span class="num">3</span><i class="mdi">&#xF073E;</i>
      <h2>Swipe sideways</h2><p>As many panels as you like</p></div>
    <div class="arrow">&#xF0142;</div>
    <div class="step last"><span class="num">4</span><i class="mdi">&#xF0CFD;</i>
      <h2>Tap for controls</h2><p>A tap opens the entity's popup</p></div>
  </div>
</body>
</html>
